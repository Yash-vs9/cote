<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyaki Mall — Exterior &amp; Glass Atrium (WebGL)</title>
<style>
  :root { --panel: rgba(18,20,24,0.72); --line: rgba(255,255,255,0.14); --txt: #e8e6e1; --acc: #ffb84d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#101216; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; color:var(--txt); pointer-events:none; user-select:none; }
  #title { top:16px; left:18px; }
  #title h1 { font-size:15px; font-weight:600; letter-spacing:0.04em; }
  #title p  { font-size:11px; opacity:0.65; margin-top:3px; letter-spacing:0.08em; }
  .chip { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:10px; opacity:0.9; margin-top:8px; letter-spacing:0.05em; }
  #hint { bottom:18px; left:50%; transform:translateX(-50%); font-size:12px; opacity:0.85; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 16px; letter-spacing:0.03em; white-space:nowrap; }
  #tools { bottom:18px; right:18px; display:flex; gap:8px; pointer-events:auto; }
  .btn { font:inherit; font-size:12px; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; letter-spacing:0.03em; transition:background .15s, border-color .15s; }
  .btn:hover { background:rgba(255,255,255,0.12); }
  .btn.on { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title">
  <h1>Keyaki Mall · Exterior &amp; Glass Atrium</h1>
  <p>TOKYO METROPOLITAN ADVANCED NURTURING HIGH SCHOOL</p>
  <div class="chip" id="stats"></div>
</div>
<div class="hud" id="hint">🖱️&nbsp;Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>
<div class="hud" id="tools">
  <button class="btn" id="btnOrbit">Auto-orbit</button>
  <button class="btn" id="btnReset">Reset view</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================ renderer / scene / camera ============================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = 0xE0EDF8;
scene.fog = new THREE.Fog(HORIZON, 80, 260);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);
const HOME_POS = new THREE.Vector3(26, 12, 52);
const HOME_TGT = new THREE.Vector3(0, 8, 15);
camera.position.copy(HOME_POS);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
pmrem.dispose();

/* ============================ sky (gradient dome + clouds) ============================ */
function buildSky() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#4E8FD0');
  g.addColorStop(0.55, '#A8CDEC');
  g.addColorStop(1, '#E0EDF8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 16, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(500, 24, 16),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false })
  );
  scene.add(sky);
}

function buildClouds() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(128, 64, 8, 128, 64, 112);
  grad.addColorStop(0, 'rgba(255,255,255,0.92)');
  grad.addColorStop(0.6, 'rgba(255,255,255,0.45)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 128);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const spots = [[-45, 32, -25, 3], [15, 36, -45, 2.6], [40, 31, 30, 3.5], [-25, 38, 35, 2.8], [60, 33, -12, 3], [-60, 34, 18, 2.6]];
  for (const [x, y, z, s] of spots) {
    const sp = new THREE.Sprite(mat);
    sp.position.set(x, y, z);
    sp.scale.set(9 * s, 4 * s, 1);
    scene.add(sp);
  }
}

/* ============================ lighting: bright day sun + warm interior glow ============================ */
const sun = new THREE.DirectionalLight(0xFFF4E3, 3.0);
sun.position.set(-45, 75, 50);
sun.target.position.set(0, 0, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;  sun.shadow.camera.right = 60;
sun.shadow.camera.top = 70;    sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 5;    sun.shadow.camera.far = 170;
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xFFFDF8, 0x8F8A82, 0.85));

/* ============================ PBR materials ============================ */
const M = {
  chrome:      new THREE.MeshStandardMaterial({ color: 0xC8CCD2, roughness: 0.1, metalness: 0.95 }),
  steel:       new THREE.MeshStandardMaterial({ color: 0x2F3337, roughness: 0.4, metalness: 0.7 }),
  glass:       new THREE.MeshPhysicalMaterial({ color: 0xBFD4E0, transmission: 0.88, roughness: 0.05, metalness: 0.1, ior: 1.5, thickness: 0.15 }),
  glassDoor:   new THREE.MeshPhysicalMaterial({ color: 0x9FBBD0, transmission: 0.8, roughness: 0.06, metalness: 0.1, ior: 1.5, thickness: 0.12 }),
  concrete:    new THREE.MeshStandardMaterial({ color: 0xB5B5B5, roughness: 0.5 }),
  concreteDark:new THREE.MeshStandardMaterial({ color: 0x9E9E9E, roughness: 0.55 }),
  warmStrip:   new THREE.MeshStandardMaterial({ color: 0x1A1408, emissive: 0xFFD9A0, emissiveIntensity: 1.6 }),
  warmPanel:   new THREE.MeshStandardMaterial({ color: 0x2A1F10, emissive: 0xFFC98F, emissiveIntensity: 1.2 }),
  ledHead:     new THREE.MeshStandardMaterial({ color: 0x201A0E, emissive: 0xFFF3D6, emissiveIntensity: 2.2 }),
};

/* ============================ building hull ============================ */
const BLD = { L: 100, D: 70, H: 22, tiers: 5, storyH: 4.4, slab: 0.35 };
const FRONT = BLD.D / 2, BACK = -BLD.D / 2, LEFT = -BLD.L / 2, RIGHT = BLD.L / 2;

function box(w, h, d, mat, x, y, z, opts = {}) {
  const { cast = true, recv = true } = opts;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = recv;
  scene.add(m);
  return m;
}

function buildSlabs() {
  for (let k = 0; k <= BLD.tiers; k++) box(BLD.L, BLD.slab, BLD.D, M.concreteDark, 0, BLD.storyH * k + 0.175, 0);
}

// multi-tiered glass curtain walls — instanced panel meshes
function buildCurtainWalls() {
  const bays = 10;
  const bayW = BLD.L / bays, glassH = BLD.storyH - BLD.slab;
  const front = new THREE.InstancedMesh(new THREE.BoxGeometry(bayW, glassH, 0.02), M.glass, BLD.tiers * bays);
  const back = new THREE.InstancedMesh(front.geometry, M.glass, BLD.tiers * bays);
  const d = new THREE.Object3D();
  let i = 0;
  for (let r = 0; r < BLD.tiers; r++) for (let b = 0; b < bays; b++) {
    d.position.set(LEFT + bayW * (b + 0.5), BLD.storyH * r + 2.375, FRONT - 0.01);
    d.updateMatrix();
    front.setMatrixAt(i, d.matrix);
    d.position.z = BACK + 0.01;
    d.updateMatrix();
    back.setMatrixAt(i, d.matrix);
    i++;
  }
  scene.add(front, back);

  const sideBays = 7, sideW = BLD.D / sideBays;
  const sides = new THREE.InstancedMesh(new THREE.BoxGeometry(0.02, glassH, sideW), M.glass, BLD.tiers * sideBays * 2);
  i = 0;
  for (let r = 0; r < BLD.tiers; r++) for (let b = 0; b < sideBays; b++) {
    for (const sx of [-1, 1]) {
      d.position.set(sx * (BLD.D / 2 - 0.01), BLD.storyH * r + 2.375, BACK + sideW * (b + 0.5));
      d.updateMatrix();
      sides.setMatrixAt(i++, d.matrix);
    }
  }
  scene.add(sides);
}

// polished chrome structural framing every 10 m
function buildPillars() {
  const mk = (x, z) => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.5, BLD.H + 0.35, 0.5), M.chrome);
    p.position.set(x, 11.175, z);
    p.castShadow = true;
    scene.add(p);
  };
  for (let b = 0; b <= 10; b++) { const x = LEFT + 10 * b; mk(x, FRONT); mk(x, BACK); }
  for (let b = 0; b <= 7; b++) { const z = BACK + 10 * b; mk(RIGHT, z); mk(LEFT, z); }
}

// central glass pyramid skylight
function buildPyramid() {
  const half = 17, baseY = BLD.H + 0.35;
  const R = half * Math.SQRT2;
  const geo = new THREE.ConeGeometry(R, 36 - baseY, 4, 1, true);
  const pyr = new THREE.Mesh(geo, M.glass);
  pyr.position.y = baseY + (36 - baseY) / 2;
  scene.add(pyr);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xD9DDE2 }));
  edges.position.copy(pyr.position);
  scene.add(edges);
  box(34, 0.18, 0.18, M.chrome, 0, baseY + 0.01, half, { cast: false });
  box(34, 0.18, 0.18, M.chrome, 0, baseY + 0.01, -half, { cast: false });
  box(0.18, 0.18, 34, M.chrome, half, baseY + 0.01, 0, { cast: false });
  box(0.18, 0.18, 34, M.chrome, -half, baseY + 0.01, 0, { cast: false });
}

// warm mall interior glow, visible through the glass walls
function buildInteriorGlow() {
  const pl = new THREE.PointLight(0xFFC79A, 140, 60, 2);
  pl.position.set(0, 9, 0);
  scene.add(pl);
  for (let k = 0; k < BLD.tiers; k++) {
    box(90, 0.09, 0.06, M.warmStrip, 0, BLD.storyH * k + 2.375, FRONT - 1.5, { cast: false });
  }
  for (const [x, y, z] of [[-22, 8, 15], [22, 8, 15], [0, 4, -8], [-22, 12, -10]]) {
    box(14, 9, 0.08, M.warmPanel, x, y, z, { cast: false });
  }
}

/* ============================ signage textures (gold glow) ============================ */
function makeSignTexture(text, px) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#0E1420'); g.addColorStop(1, '#1A2332');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 256);
  ctx.strokeStyle = 'rgba(255,215,0,0.25)';
  ctx.lineWidth = 6;
  ctx.strokeRect(10, 10, 1004, 236);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#FFD700';
  ctx.font = `bold ${px}px Arial, sans-serif`;
  ctx.fillText(text, 512, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function signMat(tex) {
  return new THREE.MeshStandardMaterial({ map: tex, emissive: 0xFFFFFF, emissiveMap: tex, emissiveIntensity: 1.5, roughness: 0.4, metalness: 0.2 });
}

function buildSigns() {
  // illuminated exterior 3D logos
  const specs = [
    ['SIVCAMERA', 150, 0, 19.4, 14],
    ['Palette', 175, -28, 19.4, 8.5],
    ['Karaoke', 170, 28, 19.4, 9],
  ];
  for (const [txt, px, x, y, w] of specs) {
    box(w + 0.6, 2.6, 0.25, M.chrome, x, y, FRONT + 0.16, { cast: false });
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, 2.2), signMat(makeSignTexture(txt, px)));
    panel.position.set(x, y, FRONT + 0.3);
    scene.add(panel);
  }
}

/* ============================ entrance: canopy + automatic sliding doors ============================ */
function buildEntrance() {
  // cantilevered canopy with LED strip
  box(18, 0.3, 5.5, M.concrete, 0, 6.3, 37.6);
  box(0.4, 6.3, 0.4, M.chrome, -5.5, 3.15, 38.6);
  box(0.4, 6.3, 0.4, M.chrome, 5.5, 3.15, 38.6);
  box(14, 0.07, 0.1, M.ledHead, 0, 6.08, 36.9, { cast: false });

  // automatic double-glass sliding doors
  box(12.4, 0.25, 0.3, M.chrome, 0, 4.35, 35.15, { cast: false });   // header
  box(0.25, 4.35, 0.3, M.chrome, -6.2, 2.175, 35.15, { cast: false }); // jambs
  box(0.25, 4.35, 0.3, M.chrome, 6.2, 2.175, 35.15, { cast: false });
  for (const dx of [-4.05, -1.35, 1.35, 4.05]) {
    const leaf = new THREE.Mesh(new THREE.BoxGeometry(2.7, 3.9, 0.05), M.glassDoor);
    leaf.position.set(dx, 1.95, 35.12);
    scene.add(leaf);
  }

  // "KEYAKI MALL" wordmark above the entrance
  const word = new THREE.Mesh(new THREE.PlaneGeometry(9, 2.2), signMat(makeSignTexture('KEYAKI MALL', 120)));
  word.position.set(0, 5.6, 35.32);
  scene.add(word);
}

/* ============================ courtyard: LED posts, benches, directory board ============================ */
function buildLightPosts() {
  for (const [x, z] of [[-10, 46], [10, 46], [-26, 48], [26, 48], [-40, 44], [40, 44]]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 5, 10), M.steel);
    pole.position.set(x, 2.5, z);
    scene.add(pole);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.14, 0.4), M.ledHead);
    head.position.set(x, 5.05, z);
    scene.add(head);
    const glow = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.25), M.ledHead);
    glow.position.set(x, 4.97, z - 0.18);
    scene.add(glow);
  }
}

function buildBenches() {
  for (const [x, z] of [[-7.5, 44.5], [7.5, 44.5], [-19, 47], [19, 47]]) {
    const seat = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.18, 0.65), M.concrete);
    seat.position.set(x, 0.35, z);
    scene.add(seat);
    const base = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 0.7), M.concreteDark);
    base.position.set(x, 0.1, z);
    scene.add(base);
  }
}

function makeDirectoryTexture() {
  const c = document.createElement('canvas');
  c.width = 528; c.height = 384;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0C1220';
  ctx.fillRect(0, 0, 528, 384);
  ctx.strokeStyle = 'rgba(255,215,0,0.3)';
  ctx.lineWidth = 4;
  ctx.strokeRect(8, 8, 512, 368);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 52px Arial, sans-serif';
  ctx.fillText('KEYAKI MALL', 264, 48);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#8FA3BE';
  ctx.font = '26px Arial, sans-serif';
  ctx.fillText('STORE DIRECTORY', 264, 88);
  const stores = [['Palette', '1F · Fashion'], ['SIVCAMERA', '2F · Electronics'], ['Karaoke', '3F · Entertainment'], ['Atrium Café', '1F · Food Court'], ['Cinema Keyaki', '5F · Cinema'], ['Books & Media', '4F · Lifestyle']];
  ctx.font = '30px Arial, sans-serif';
  let y = 138;
  for (const [name, floor] of stores) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#F2F5F9';
    ctx.fillText(name, 60, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#A9BBD2';
    ctx.fillText(floor, 468, y);
    y += 40;
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function buildDirectory() {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.4, 12), M.steel);
  post.position.set(15, 0.7, 42);
  scene.add(post);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.8, 0.18), M.chrome);
  panel.position.set(15, 2.0, 42);
  scene.add(panel);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.6), signMat(makeDirectoryTexture()));
  screen.position.set(15, 2.0, 41.91);
  screen.rotation.y = Math.PI; // faces the courtyard / approaching visitors
  scene.add(screen);
}

/* ============================ grounds: courtyard plaza + lawns ============================ */
function noiseTexture(base, shades, n, repeat) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = shades[Math.random() * shades.length | 0];
    ctx.globalAlpha = 0.1 + Math.random() * 0.15;
    const s = 1 + Math.random() * 3;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, s, s);
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function paverTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#B8B8B8';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = `rgba(${150 + Math.random() * 60 | 0},${150 + Math.random() * 60 | 0},${150 + Math.random() * 60 | 0},0.15)`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 3, 2 + Math.random() * 3);
  }
  ctx.strokeStyle = 'rgba(120,120,120,0.55)';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 8; i++) {
    ctx.beginPath(); ctx.moveTo(i * 32, 0); ctx.lineTo(i * 32, 256); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * 32); ctx.lineTo(256, i * 32); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(40, 10);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildGrounds() {
  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(240, 240),
    new THREE.MeshStandardMaterial({ map: noiseTexture('#6C9A50', ['#5E8A45', '#53793C', '#78A85B', '#6FA254'], 2200, 48), roughness: 1 })
  );
  grass.rotation.x = -Math.PI / 2;
  grass.position.y = -0.02;
  grass.receiveShadow = true;
  scene.add(grass);

  const plaza = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 20),
    new THREE.MeshStandardMaterial({ map: paverTexture(), roughness: 0.45 })
  );
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.set(0, 0.01, 45); // z 35 → 55, the entrance courtyard
  plaza.receiveShadow = true;
  scene.add(plaza);
}

/* ============================ build everything ============================ */
buildSky();
buildGrounds();
buildSlabs();
buildCurtainWalls();
buildPillars();
buildPyramid();
buildInteriorGlow();
buildSigns();
buildEntrance();
buildLightPosts();
buildBenches();
buildDirectory();
buildClouds();

/* ============================ controls & HUD ============================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 180;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.enablePan = false;
controls.autoRotateSpeed = 0.5;

controls.addEventListener('start', () => { renderer.domElement.style.cursor = 'grabbing'; });
controls.addEventListener('end',   () => { renderer.domElement.style.cursor = 'grab'; });

const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnOrbit.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btnReset').addEventListener('click', () => {
  controls.autoRotate = false;
  btnOrbit.classList.remove('on');
  camera.position.copy(HOME_POS);
  controls.target.copy(HOME_TGT);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// scene stats
let tris = 0, meshes = 0;
scene.traverse(o => {
  if (o.isMesh || o.isInstancedMesh) {
    meshes++;
    const g = o.geometry;
    if (o.isInstancedMesh) tris += g.index ? g.index.count / 3 * o.count : 0;
    else if (g.index) tris += g.index.count / 3;
    else if (g.attributes.position) tris += g.attributes.position.count / 3;
  }
});
document.getElementById('stats').textContent = `${meshes} meshes · ${Math.round(tris).toLocaleString()} tris`;

/* ============================ render loop ============================ */
const clock = new THREE.Clock();
let intro = true;
const introT0 = performance.now();
const INTRO_FROM = new THREE.Vector3(75, 26, 95);
const INTRO_TGT0 = new THREE.Vector3(0, 6, 15);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.elapsedTime;

  if (intro) {
    const p = Math.min((performance.now() - introT0) / 1600, 1);
    const e = 1 - Math.pow(1 - p, 3);
    camera.position.lerpVectors(INTRO_FROM, HOME_POS, e);
    controls.target.lerpVectors(INTRO_TGT0, HOME_TGT, e);
    if (p >= 1) intro = false;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
