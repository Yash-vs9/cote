<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Park · Fountain Plaza</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; font-family: 'Segoe UI', system-ui, sans-serif; }
  #c { position: fixed; inset: 0; }
  #ui { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
  #ui button {
    background: rgba(16, 30, 22, 0.72); color: #e8ffe8; border: 1px solid rgba(130, 220, 150, 0.35);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.2s;
  }
  #ui button:hover { background: rgba(40, 110, 60, 0.7); }
  #stats {
    position: fixed; bottom: 14px; left: 14px; z-index: 10; color: #b8f0c8; font-size: 12px;
    background: rgba(16, 30, 22, 0.6); padding: 6px 12px; border-radius: 12px; backdrop-filter: blur(4px);
  }
  #label {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(12, 26, 18, 0.9); color: #ecffe8; padding: 8px 18px; border-radius: 18px;
    font-size: 14px; border: 1px solid rgba(130, 220, 150, 0.5); opacity: 0; transition: opacity 0.25s;
    pointer-events: none; max-width: 80vw; text-align: center;
  }
  #hint { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 9; color: rgba(210, 240, 210, 0.55); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btnOrbit">Auto-orbit</button>
  <button id="btnReset">Reset view</button>
</div>
<div id="stats">…</div>
<div id="label"></div>
<div id="hint">Drag to orbit · scroll to zoom · click anything to inspect it</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f5);
scene.fog = new THREE.Fog(0xbfe0f5, 90, 260);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 800);
const ctl = new OrbitControls(camera, canvas);
ctl.target.set(0, 1.5, 0);
ctl.enableDamping = true;
ctl.dampingFactor = 0.08;
ctl.maxPolarAngle = Math.PI * 0.495;
ctl.minDistance = 3;
ctl.maxDistance = 120;

// ---------- helpers ----------
const H = (w, h, d, mat, x, y, z, ry = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.y = ry;
  return m;
};
const std = (o, extra = {}) => Object.assign(new THREE.MeshStandardMaterial(o), extra);
const pickable = [];
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- textures ----------
function graniteTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#8e8d8a'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) {
    const v = rand(90, 190) | 0;
    g.fillStyle = `rgba(${v},${v},${v},0.5)`;
    g.fillRect(rand(0, 256), rand(0, 256), rand(1, 3), rand(1, 3));
  }
  for (let i = 0; i < 40; i++) {
    g.fillStyle = `rgba(${rand(30, 70) | 0},${rand(30, 70) | 0},${rand(30, 70) | 0},0.35)`;
    g.fillRect(rand(0, 256), rand(0, 256), rand(2, 6), rand(2, 6));
  }
  return new THREE.CanvasTexture(c);
}
function graniteBump() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1600; i++) {
    const v = rand(40, 220) | 0;
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(rand(0, 256), rand(0, 256), rand(1, 2), rand(1, 2));
  }
  return new THREE.CanvasTexture(c);
}
function brickTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  const bw = 64, bh = 26;
  for (let row = 0; row < 128 / bh; row++) {
    for (let col = -1; col < 256 / bw + 1; col++) {
      const l = 1 + rand(-0.12, 0.12);
      const r = Math.round(139 * l), gg = Math.round(69 * l), b = Math.round(19 * l);
      g.fillStyle = `rgb(${r},${gg},${b})`;
      const off = row % 2 === 1 ? bw / 2 : 0;
      g.fillRect(col * bw + off, row * bh, bw - 2, bh - 2);
      g.fillStyle = 'rgba(255,255,255,0.06)';
      g.fillRect(col * bw + off + 2, row * bh + 2, bw - 6, bh - 6);
    }
  }
  g.strokeStyle = '#5c3a14'; g.lineWidth = 2;
  for (let row = 0; row <= 128 / bh; row++) {
    g.beginPath(); g.moveTo(0, row * bh); g.lineTo(256, row * bh); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function stoneTileTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#a8a6a0'; g.fillRect(0, 0, 256, 256);
  const n = 4, s = 256 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const l = 1 + rand(-0.08, 0.08);
    g.fillStyle = `rgb(${Math.round(168 * l)}, ${Math.round(166 * l)}, ${Math.round(160 * l)})`;
    g.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
    g.fillStyle = 'rgba(255,255,255,0.07)';
    g.fillRect(i * s + 7, j * s + 7, s - 14, s - 14);
  }
  g.strokeStyle = 'rgba(70,70,70,0.5)'; g.lineWidth = 3;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, 256); g.stroke();
    g.beginPath(); g.moveTo(0, i * s); g.lineTo(256, i * s); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function grassTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#7aa84f'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++) {
    const l = rand(0.75, 1.25);
    g.fillStyle = `rgba(${Math.round(110 * l)}, ${Math.round(160 * l)}, ${Math.round(75 * l)}, 0.5)`;
    g.fillRect(rand(0, 256), rand(0, 256), 1, rand(2, 4));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const matGranite = std({ map: graniteTexture(), bumpMap: graniteBump(), bumpScale: 0.6, roughness: 0.5, metalness: 0.02 });
const matBrick = std({ map: brickTexture(), roughness: 0.6, metalness: 0.0 });
const matStoneTile = std({ map: stoneTileTexture(), roughness: 0.45, metalness: 0.02 });
const matGrass = std({ map: grassTexture(), roughness: 0.95 });
const matWood = std({ color: 0x5a3a20, roughness: 0.7, metalness: 0.02 });
const matIron = std({ color: 0x2a2c2e, roughness: 0.5, metalness: 0.8 });
const matHedge = std({ color: 0x3f7a3a, roughness: 0.9, metalness: 0.0 });

// ---------- ground ----------
const lawn = new THREE.Mesh(new THREE.CircleGeometry(78, 64), matGrass);
lawn.rotation.x = -Math.PI / 2;
lawn.position.y = -0.04;
lawn.receiveShadow = true;
scene.add(lawn);
matGrass.map.repeat.set(24, 24);

const plaza = new THREE.Mesh(new THREE.CircleGeometry(20, 64), matStoneTile);
plaza.rotation.x = -Math.PI / 2;
plaza.position.y = 0.02;
plaza.receiveShadow = true;
scene.add(plaza);
matStoneTile.map.repeat.set(10, 10);
pickable.push({ obj: plaza, name: 'Circular stone plaza — 40 m diameter' });

// ---------- brick walkways (cross + ring) ----------
const paths = new THREE.Group();
const brickNS = new THREE.Mesh(new THREE.PlaneGeometry(3, 156), matBrick.clone());
brickNS.rotation.x = -Math.PI / 2;
brickNS.position.set(0, 0.045, 0);
brickNS.material.map = brickTexture();
brickNS.material.map.repeat.set(1, 26);
paths.add(brickNS);
const brickEW = new THREE.Mesh(new THREE.PlaneGeometry(156, 3), matBrick.clone());
brickEW.rotation.x = -Math.PI / 2;
brickEW.position.set(0, 0.045, 0);
brickEW.material.map = brickTexture();
brickEW.material.map.repeat.set(26, 1);
paths.add(brickEW);
const brickRing = new THREE.Mesh(new THREE.RingGeometry(15.4, 16.6, 64), matBrick.clone());
brickRing.rotation.x = -Math.PI / 2;
brickRing.position.y = 0.05;
brickRing.material.map = brickTexture();
brickRing.material.map.repeat.set(10, 1);
paths.add(brickRing);
scene.add(paths);
pickable.push({ obj: paths, name: 'Red-brick walkways — cross & ring paths' });

// ---------- fountain ----------
const fountain = new THREE.Group();
const matGran = matGranite;
// base pool
const poolBase = new THREE.Mesh(new THREE.CylinderGeometry(4.4, 4.7, 0.55, 40), matGran);
poolBase.position.y = 0.275;
poolBase.castShadow = true;
fountain.add(poolBase);
// water ripple shader
const waterUniforms = {
  uTime: { value: 0 },
  uDeep: { value: new THREE.Color(0x2f6f9c) },
  uShallow: { value: new THREE.Color(0x8fd4e8) },
  uSky: { value: new THREE.Color(0xcfe8f8) },
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main() {
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uSky;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main() {
      vec2 c = vUv - 0.5;
      float d = length(c) * 2.0;
      float r = sin(d * 34.0 - uTime * 2.4) * 0.5 + 0.5;
      vec3 col = mix(uDeep, uShallow, 0.25 + r * 0.5);
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - abs(dot(V, vec3(0.0, 1.0, 0.0))), 2.2);
      col = mix(col, uSky, fres * 0.6);
      float spark = pow(max(sin(d * 40.0 - uTime * 3.0), 0.0), 30.0);
      col += vec3(1.0, 1.0, 0.92) * spark * 0.35;
      gl_FragColor = vec4(col, 0.93);
    }
  `,
});
const poolWater = new THREE.Mesh(new THREE.CircleGeometry(4.15, 48), waterMat);
poolWater.rotation.x = -Math.PI / 2;
poolWater.position.y = 0.56;
fountain.add(poolWater);

// tier 1 bowl
const bowl1 = new THREE.Mesh(new THREE.CylinderGeometry(2.7, 2.9, 0.45, 36), matGran);
bowl1.position.y = 1.05;
bowl1.castShadow = true;
fountain.add(bowl1);
const water1 = new THREE.Mesh(new THREE.CircleGeometry(2.55, 36), waterMat);
water1.rotation.x = -Math.PI / 2;
water1.position.y = 1.28;
fountain.add(water1);
// tier 2 bowl
const bowl2 = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.65, 0.4, 32), matGran);
bowl2.position.y = 1.85;
bowl2.castShadow = true;
fountain.add(bowl2);
const water2 = new THREE.Mesh(new THREE.CircleGeometry(1.38, 28), waterMat);
water2.rotation.x = -Math.PI / 2;
water2.position.y = 2.05;
fountain.add(water2);
// center column + finial
const col = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.4, 1.3, 20), matGran);
col.position.y = 2.7;
fountain.add(col);
const finial = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 12), matGran);
finial.position.y = 3.55;
fountain.add(finial);
// water jets
const jetMat = new THREE.MeshBasicMaterial({ color: 0xcfeaf8, transparent: true, opacity: 0.32, depthWrite: false });
const centerJet = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.16, 2.4, 10, 1, true), jetMat);
centerJet.position.y = 4.7;
centerJet.scale.y = 1;
fountain.add(centerJet);
const sideJets = [];
for (let i = 0; i < 6; i++) {
  const a = i * Math.PI / 3;
  const jet = new THREE.Mesh(new THREE.ConeGeometry(0.07, 1.2, 8, 1, true), jetMat);
  jet.position.set(Math.sin(a) * 2.7, 1.3, Math.cos(a) * 2.7);
  jet.rotation.z = -Math.sin(a) * 0.55;
  jet.rotation.x = Math.cos(a) * 0.55;
  fountain.add(jet);
  sideJets.push(jet);
}
scene.add(fountain);
pickable.push({ obj: fountain, name: 'Multi-tiered stone fountain' });
pickable.push({ obj: poolWater, name: 'Fountain pool — animated water ripples' });

// ---------- benches (concentric rings, instanced) ----------
const benchGroup = new THREE.Group();
const benchCount = 24;
const seatGeo = new THREE.BoxGeometry(1.8, 0.07, 0.5);
const backGeo = new THREE.BoxGeometry(1.8, 0.5, 0.06);
const legGeo = new THREE.BoxGeometry(0.07, 0.5, 0.07);
const instSeat = new THREE.InstancedMesh(seatGeo, matWood, benchCount);
const instBack = new THREE.InstancedMesh(backGeo, matWood, benchCount);
const instLegs = new THREE.InstancedMesh(legGeo, matIron, benchCount * 4);
[instSeat, instBack, instLegs].forEach(m => { m.castShadow = true; m.receiveShadow = true; m.userData.noHighlight = true; });
const M = new THREE.Matrix4();
const Q = new THREE.Quaternion();
const rings = [
  { r: 7.6, n: 8, off: 0 },
  { r: 11.2, n: 8, off: Math.PI / 8 },
  { r: 14.6, n: 8, off: 0 },
];
let bi = 0;
for (const ring of rings) {
  for (let i = 0; i < ring.n; i++) {
    const a = ring.off + i * Math.PI * 2 / ring.n;
    const x = ring.r * Math.sin(a), z = ring.r * Math.cos(a);
    Q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), a);
    const p = new THREE.Vector3(x, 0, z);
    const o = (v) => v.clone().applyQuaternion(Q).add(p);
    instSeat.setMatrixAt(bi, M.compose(o(new THREE.Vector3(0, 0.48, 0)), Q, new THREE.Vector3(1, 1, 1)));
    instBack.setMatrixAt(bi, M.compose(o(new THREE.Vector3(0, 0.75, 0.22)), Q, new THREE.Vector3(1, 1, 1)));
    for (const [lx, lz] of [[-0.8, -0.18], [0.8, -0.18], [-0.8, 0.18], [0.8, 0.18]]) {
      instLegs.setMatrixAt(bi * 4 + ((lx > 0 ? 1 : 0) + (lz > 0 ? 2 : 0)),
        M.compose(o(new THREE.Vector3(lx, 0.25, lz)), Q, new THREE.Vector3(1, 1, 1)));
    }
    bi++;
  }
}
benchGroup.add(instSeat, instBack, instLegs);
scene.add(benchGroup);
pickable.push({ obj: benchGroup, name: 'Concentric bench rings — 24 benches facing the fountain' });

// ---------- trees (instanced: cherry blossom + shade) ----------
const treeGroup = new THREE.Group();
const N_TREES = 16;
const trunkGeo = new THREE.CylinderGeometry(0.22, 0.36, 3.2, 7);
const folGeo = new THREE.IcosahedronGeometry(1, 0);
const instTrunks = new THREE.InstancedMesh(trunkGeo, std({ color: 0x5d4328, roughness: 0.9 }), N_TREES);
const instFol = new THREE.InstancedMesh(folGeo,
  std({ color: 0xffffff, roughness: 0.85, flatShading: true }), N_TREES * 3);
instFol.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N_TREES * 3 * 3), 3);
[instTrunks, instFol].forEach(m => { m.castShadow = true; m.receiveShadow = true; m.userData.noHighlight = true; });
const cherry = new THREE.Color(0xf2b8d0);
const cherry2 = new THREE.Color(0xf7d2e2);
const green = new THREE.Color(0x4f9e46);
const green2 = new THREE.Color(0x61ad4f);
const treePositions = [];
while (treePositions.length < N_TREES) {
  const a = rand(0, Math.PI * 2);
  const r = rand(24, 60);
  const x = r * Math.sin(a), z = r * Math.cos(a);
  if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
  treePositions.push([x, z]);
}
let ti = 0;
for (const [tx, tz] of treePositions) {
  const isCherry = Math.random() < 0.42;
  const scale = 0.9 + rand(0, 0.7);
  M.makeTranslation(tx, 1.6 * scale, tz);
  M.scale(new THREE.Vector3(scale, scale, scale));
  instTrunks.setMatrixAt(ti, M);
  for (let k = 0; k < 3; k++) {
    const s = (0.9 + rand(0, 0.45)) * scale;
    const ox = (rand(-0.5, 0.5)) * 1.4 * scale;
    const oy = (3.1 + rand(0, 0.7)) * scale;
    const oz = (rand(-0.5, 0.5)) * 1.4 * scale;
    M.makeTranslation(tx + ox, oy, tz + oz);
    M.scale(new THREE.Vector3(s, s * (0.8 + rand(0, 0.3)), s));
    instFol.setMatrixAt(ti * 3 + k, M);
    const col = isCherry ? (k % 2 ? cherry : cherry2) : (k % 2 ? green : green2);
    instFol.setColorAt(ti * 3 + k, col);
  }
  ti++;
}
treeGroup.add(instTrunks, instFol);
scene.add(treeGroup);
pickable.push({ obj: treeGroup, name: 'Trees — cherry blossom & shade trees' });

// ---------- hedges along the walkways ----------
const hedgeGroup = new THREE.Group();
const hedgeGeo = new THREE.BoxGeometry(1.4, 0.8, 0.55);
const hedgeCount = 96;
const instHedge = new THREE.InstancedMesh(hedgeGeo, matHedge, hedgeCount);
instHedge.castShadow = true;
instHedge.receiveShadow = true;
instHedge.userData.noHighlight = true;
let hi = 0;
for (let s = -58; s <= 58; s += 6) {
  if (Math.abs(s) < 26) continue;
  for (const side of [-1, 1]) {
    M.makeRotationY(0);
    M.setPosition(2.9 * side, 0.4, s);
    instHedge.setMatrixAt(hi++, M);
    M.setPosition(-2.9 * side, 0.4, s);
    instHedge.setMatrixAt(hi++, M);
    M.makeRotationY(Math.PI / 2);
    M.setPosition(s, 0.4, 2.9 * side);
    instHedge.setMatrixAt(hi++, M);
    M.setPosition(s, 0.4, -2.9 * side);
    instHedge.setMatrixAt(hi++, M);
  }
}
hedgeGroup.add(instHedge);
scene.add(hedgeGroup);
pickable.push({ obj: hedgeGroup, name: 'Manicured hedges lining the walkways' });

// ---------- park lamps ----------
const lampGroup = new THREE.Group();
for (let i = 0; i < 6; i++) {
  const a = i * Math.PI / 3 + Math.PI / 6;
  const x = 19.2 * Math.sin(a), z = 19.2 * Math.cos(a);
  const lp = new THREE.Group();
  lp.position.set(x, 0, z);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 3.6, 8), matIron);
  pole.position.y = 1.8;
  pole.castShadow = true;
  lp.add(pole);
  const arm = H(0.5, 0.06, 0.06, matIron, 0.25, 3.55, 0);
  lp.add(arm);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xfff2cf, transparent: true, opacity: 0.95 }));
  head.position.set(0.4, 3.55, 0);
  lp.add(head);
  lp.rotation.y = -a + Math.PI;
  lampGroup.add(lp);
}
scene.add(lampGroup);
pickable.push({ obj: lampGroup, name: 'Park lamps around the plaza' });

// park sign
function makeSignTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#5a3a20'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = '#d8b25a'; g.lineWidth = 5; g.strokeRect(6, 6, 244, 116);
  g.fillStyle = '#ffe9c8'; g.font = 'bold 40px "Segoe UI", sans-serif'; g.textAlign = 'center';
  g.fillText('CENTRAL PARK', 128, 62);
  g.font = '22px "Segoe UI", sans-serif';
  g.fillText('KEYAKI CAMPUS', 128, 98);
  return new THREE.CanvasTexture(c);
}
const signGroup = new THREE.Group();
signGroup.position.set(0, 0, 22.5);
const signPole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 2.2, 8), matIron);
signPole.position.y = 1.1;
signGroup.add(signPole);
const signBoard = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.75), new THREE.MeshBasicMaterial({ map: makeSignTexture() }));
signBoard.position.set(0, 2.25, 0);
signGroup.add(signBoard);
scene.add(signGroup);
pickable.push({ obj: signGroup, name: 'Central Park sign' });

// ---------- sky ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(400, 32, 16),
  new THREE.MeshBasicMaterial({
    map: (() => {
      const c = document.createElement('canvas'); c.width = 64; c.height = 256;
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, '#4f9fe0'); gr.addColorStop(0.55, '#a8d4f2'); gr.addColorStop(1, '#e8f4e8');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
      return new THREE.CanvasTexture(c);
    })(),
    side: THREE.BackSide, fog: false,
  })
);
scene.add(sky);
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, fog: false });
function makeCloud(x, y, z, s) {
  const cl = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry((1.4 + Math.random() * 0.8) * s, 10, 8), cloudMat);
    p.position.set((Math.random() - 0.5) * 4 * s, Math.random() * 0.6 * s, (Math.random() - 0.5) * 2 * s);
    cl.add(p);
  }
  cl.position.set(x, y, z);
  return cl;
}
for (const [cx, cy, cz, cs] of [[-120, 80, -60, 2.2], [80, 100, -90, 2.6], [170, 70, 50, 1.9], [-60, 110, 120, 3], [100, 85, 140, 2.2]]) {
  scene.add(makeCloud(cx, cy, cz, cs));
}

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x6a7a5a, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 2.3);
sun.position.set(38, 48, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0004;
scene.add(sun);

// ---------- picking / labels ----------
const labelEl = document.getElementById('label');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hovered = new Set();
function highlight(mesh, on) {
  if (mesh.userData.noHighlight) return;
  if (mesh.material && mesh.material.emissive) {
    if (on) {
      if (!mesh.userData._baseEm) mesh.userData._baseEm = mesh.material.emissive.clone();
      mesh.material.emissive.copy(mesh.userData._baseEm).addScalar(on ? 0.3 : 0);
      mesh.material.emissiveIntensity = on ? 0.5 : 0;
    } else {
      if (mesh.userData._baseEm) mesh.material.emissive.copy(mesh.userData._baseEm);
      mesh.material.emissiveIntensity = 0;
    }
  }
}
function applyHover(group, on) {
  group.traverse(o => { if (o.isMesh) highlight(o, on); });
}
function setLabel(text, show) {
  labelEl.textContent = text;
  labelEl.style.opacity = show ? 1 : 0;
}
canvas.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    canvas.style.cursor = 'pointer';
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry && !hovered.has(entry.obj)) {
      hovered.forEach(o => applyHover(o, false));
      hovered.clear();
      hovered.add(entry.obj);
      applyHover(entry.obj, true);
      setLabel(entry.name, true);
    }
  } else {
    if (hovered.size) { hovered.forEach(o => applyHover(o, false)); hovered.clear(); }
    canvas.style.cursor = 'grab';
    setLabel('', false);
  }
});
canvas.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry) setLabel(entry.name, true);
  }
});

// ---------- buttons ----------
let autoOrbit = false;
document.getElementById('btnOrbit').addEventListener('click', () => {
  autoOrbit = !autoOrbit;
  document.getElementById('btnOrbit').textContent = autoOrbit ? 'Orbit: ON' : 'Auto-orbit';
});
document.getElementById('btnReset').addEventListener('click', () => {
  intro = { active: true, t: 0 };
  intro.from = camera.position.clone();
  intro.to = new THREE.Vector3(0, 2.6, 27);
  intro.fromT = ctl.target.clone();
  intro.toT = new THREE.Vector3(0, 1.5, 0);
  ctl.enabled = false;
});

// ---------- intro fly-in ----------
let intro = { active: true, t: 0 };
intro.from = new THREE.Vector3(48, 26, 52);
intro.to = new THREE.Vector3(0, 2.6, 27);
intro.fromT = new THREE.Vector3(0, 4, 0);
intro.toT = new THREE.Vector3(0, 1.5, 0);
camera.position.copy(intro.from);
ctl.target.copy(intro.fromT);
ctl.enabled = false;

// ---------- animate ----------
const clock3 = new THREE.Clock();
const statsEl = document.getElementById('stats');
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);
  const t = clock3.elapsedTime;
  waterUniforms.uTime.value = t;
  // pulsing fountain jet
  const pulse = 1 + Math.sin(t * 2.2) * 0.12;
  centerJet.scale.set(1, pulse, 1);
  sideJets.forEach((j, i) => {
    j.scale.set(1, 0.85 + Math.sin(t * 2.8 + i) * 0.2, 1);
  });
  if (intro.active) {
    intro.t += dt / 1.8;
    const k = Math.min(intro.t, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(intro.from, intro.to, e);
    ctl.target.lerpVectors(intro.fromT, intro.toT, e);
    if (k >= 1) { intro.active = false; ctl.enabled = true; }
  }
  ctl.autoRotate = autoOrbit && !intro.active;
  ctl.update();
  renderer.render(scene, camera);
  statsEl.textContent = `${renderer.info.render.triangles.toLocaleString()} tris · ${renderer.info.render.calls} draw calls`;
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
