<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIVCAMERA — Electronics Store Interior (WebGL)</title>
<style>
  :root { --panel: rgba(18,20,24,0.72); --line: rgba(255,255,255,0.14); --txt: #e8e6e1; --acc: #4fc3ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#101216; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; color:var(--txt); pointer-events:none; user-select:none; }
  #title { top:16px; left:18px; }
  #title h1 { font-size:15px; font-weight:600; letter-spacing:0.04em; }
  #title p  { font-size:11px; opacity:0.65; margin-top:3px; letter-spacing:0.08em; }
  .chip { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:10px; opacity:0.9; margin-top:8px; letter-spacing:0.05em; }
  #readout { top:16px; right:18px; text-align:right; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; backdrop-filter:blur(6px); min-width:130px; }
  #readout .lbl { opacity:0.55; font-size:10px; text-transform:uppercase; letter-spacing:0.14em; }
  #readout .val { margin-top:4px; font-weight:600; color:var(--acc); }
  #hint { bottom:18px; left:50%; transform:translateX(-50%); font-size:12px; opacity:0.85; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 16px; letter-spacing:0.03em; white-space:nowrap; }
  #tools { bottom:18px; right:18px; display:flex; gap:8px; pointer-events:auto; }
  .btn { font:inherit; font-size:12px; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; letter-spacing:0.03em; transition:background .15s, border-color .15s; }
  .btn:hover { background:rgba(255,255,255,0.12); }
  .btn.on { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title">
  <h1>SIVCAMERA · Electronics Store Interior</h1>
  <p>TOKYO METROPOLITAN ADVANCED NURTURING HIGH SCHOOL</p>
  <div class="chip" id="stats"></div>
</div>
<div class="hud" id="readout"><div class="lbl">Selection</div><div class="val" id="sel">—</div></div>
<div class="hud" id="hint">🖱️&nbsp;Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click to inspect</div>
<div class="hud" id="tools">
  <button class="btn" id="btnOrbit">Auto-orbit</button>
  <button class="btn" id="btnReset">Reset view</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================ renderer / scene / camera ============================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xE9EEF4);
scene.fog = new THREE.Fog(0xE9EEF4, 16, 36);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
const HOME_POS = new THREE.Vector3(3.4, 2.0, -2.9);
const HOME_TGT = new THREE.Vector3(-0.5, 1.1, 1.6);
camera.position.copy(HOME_POS);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
pmrem.dispose();

/* ============================ lighting: cool 6000K LED + daylight ============================ */
const day = new THREE.DirectionalLight(0xFFF3E2, 2.0);
day.position.set(5, 9, 12); // street side
day.target.position.set(0, 1, 0);
day.castShadow = true;
day.shadow.mapSize.set(2048, 2048);
day.shadow.camera.left = -8;   day.shadow.camera.right = 8;
day.shadow.camera.top = 8;     day.shadow.camera.bottom = -8;
day.shadow.camera.near = 1;    day.shadow.camera.far = 30;
day.shadow.bias = -0.0005;
scene.add(day, day.target);
scene.add(new THREE.HemisphereLight(0xEFF6FF, 0x6E7680, 0.85));
for (const [lx, lz] of [[0, 0], [-2, 1], [2, 1]]) {
  const cool = new THREE.PointLight(0xE4F2FF, 16, 11, 2);
  cool.position.set(lx, 2.5, lz);
  scene.add(cool);
}

/* ============================ PBR materials ============================ */
const M = {
  floor:      new THREE.MeshPhysicalMaterial({ color: 0x3A3E44, roughness: 0.3, metalness: 0.1 }),   // dark slate
  seam:       new THREE.MeshStandardMaterial({ color: 0x2B2E33, roughness: 0.5 }),
  wall:       new THREE.MeshStandardMaterial({ color: 0xE8EAEE, roughness: 0.92 }),
  ceiling:    new THREE.MeshStandardMaterial({ color: 0xE0E2E6, roughness: 0.92 }),
  glass:      new THREE.MeshPhysicalMaterial({ color: 0xC9DAE4, transmission: 0.9, roughness: 0.05, metalness: 0.1, ior: 1.5, thickness: 0.08 }),
  glassCase:  new THREE.MeshPhysicalMaterial({ color: 0xD6E6EF, transmission: 0.92, roughness: 0.08, metalness: 0.1, ior: 1.5, thickness: 0.05 }),
  mullion:    new THREE.MeshStandardMaterial({ color: 0x2F3337, roughness: 0.4, metalness: 0.7 }),
  white:      new THREE.MeshStandardMaterial({ color: 0xF4F5F2, roughness: 0.5 }),
  chrome:     new THREE.MeshStandardMaterial({ color: 0xC8CCD2, roughness: 0.15, metalness: 0.9 }),
  metalDark:  new THREE.MeshStandardMaterial({ color: 0x1C1F23, roughness: 0.4, metalness: 0.7 }),
  camBody:    new THREE.MeshStandardMaterial({ color: 0x23262B, roughness: 0.45, metalness: 0.5 }),
  lensGlass:  new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.2, metalness: 0.4 }),
  trackTip:   new THREE.MeshStandardMaterial({ color: 0x101418, emissive: 0xDFF2FF, emissiveIntensity: 2.4 }),
  screen:     new THREE.MeshStandardMaterial({ color: 0x0A0C10, emissive: 0xC7E6FF, emissiveIntensity: 1.2 }),
  shelfWood:  new THREE.MeshStandardMaterial({ color: 0x9C6B45, roughness: 0.5 }),
  curb:       new THREE.MeshStandardMaterial({ color: 0x8E8B83, roughness: 0.8 }),
  stripe:     new THREE.MeshStandardMaterial({ color: 0xF0F0EE, roughness: 0.7 }),
  fascia:     new THREE.MeshStandardMaterial({ color: 0x0B2A4A, roughness: 0.5 }),
  foliage:    new THREE.MeshStandardMaterial({ color: 0x4E7A3A, roughness: 0.9 }),
};

/* ============================ room shell ============================ */
const ROOM = { w: 10, l: 8, h: 3 };
const NORTH = -ROOM.l / 2, SOUTH = ROOM.l / 2, WEST = -ROOM.w / 2, EAST = ROOM.w / 2;
const DOORWAY = { x: 1.95, w: 1.1, h: 2.2 }; // real opening in the street wall

function box(w, h, d, mat, x, y, z, opts = {}) {
  const { cast = true, recv = true } = opts;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = recv;
  scene.add(m);
  return m;
}

function noiseTexture(base, shades, n, repeat) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = shades[Math.random() * shades.length | 0];
    ctx.globalAlpha = 0.1 + Math.random() * 0.15;
    const s = 1 + Math.random() * 3;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, s, s);
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function slateTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3A3E44';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 700; i++) {
    ctx.fillStyle = `rgba(${40 + Math.random() * 30 | 0},${44 + Math.random() * 30 | 0},${50 + Math.random() * 30 | 0},0.25)`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 4, 2 + Math.random() * 4);
  }
  ctx.strokeStyle = 'rgba(25,28,32,0.7)';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 4; i++) {
    ctx.beginPath(); ctx.moveTo(i * 64, 0); ctx.lineTo(i * 64, 256); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * 64); ctx.lineTo(256, i * 64); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 4);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function pegboardTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#8A8F96';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 400; i++) {
    ctx.fillStyle = `rgba(${120 + Math.random() * 40 | 0},${125 + Math.random() * 40 | 0},${130 + Math.random() * 40 | 0},0.2)`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
  ctx.fillStyle = '#33373C';
  for (let gx = 16; gx < 256; gx += 32) {
    for (let gy = 16; gy < 256; gy += 32) {
      ctx.beginPath();
      ctx.arc(gx, gy, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function textTexture(text, px, color = '#FFFFFF') {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 1024, 256);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.font = `bold ${px}px Arial, sans-serif`;
  ctx.fillText(text, 512, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function buildShell() {
  // dark slate tile floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.l), new THREE.MeshStandardMaterial({ map: slateTexture(), roughness: 0.3, metalness: 0.1 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  for (let i = 1; i < 10; i++) box(0.008, 0.002, ROOM.l, M.seam, WEST + i, 0.004, 0, { cast: false });

  // solid walls: north, east, west
  box(ROOM.w, ROOM.h, 0.14, M.wall, 0, ROOM.h / 2, NORTH - 0.07);
  box(0.14, ROOM.h, ROOM.l, M.wall, EAST + 0.07, ROOM.h / 2, 0);
  box(0.14, ROOM.h, ROOM.l, M.wall, WEST - 0.07, ROOM.h / 2, 0);
  box(ROOM.w, 0.1, ROOM.l, M.ceiling, 0, ROOM.h + 0.05, 0, { cast: false });

  // ---- front elevation: display window (x -5..1) + open doorway (1.4..2.5) + solid end (2.5..5) ----
  const winEnd = 1.0;
  const panes = 4;
  const paneW = (winEnd - WEST) / panes; // 1.5
  for (let i = 0; i < panes; i++) {
    box(paneW, ROOM.h, 0.02, M.glass, WEST + paneW * (i + 0.5), ROOM.h / 2, SOUTH, { cast: false });
  }
  for (let i = 0; i <= panes; i++) {
    const x = WEST + paneW * i;
    box(0.07, ROOM.h + 0.05, 0.07, M.mullion, x, ROOM.h / 2, SOUTH, { cast: false });
  }
  box(winEnd - WEST + 0.1, 0.09, 0.07, M.mullion, (WEST + winEnd) / 2, ROOM.h - 0.03, SOUTH, { cast: false });
  box(winEnd - WEST + 0.1, 0.09, 0.07, M.mullion, (WEST + winEnd) / 2, 0.045, SOUTH, { cast: false });
  // sliver between window and doorway
  box(0.4, ROOM.h, 0.14, M.wall, (winEnd + DOORWAY.x - DOORWAY.w / 2) / 2, ROOM.h / 2, SOUTH);
  // solid end wall
  box(EAST - (DOORWAY.x + DOORWAY.w / 2), ROOM.h, 0.14, M.wall, (DOORWAY.x + DOORWAY.w / 2 + EAST) / 2, ROOM.h / 2, SOUTH);

  // doorway: casing + threshold (opening stays clear)
  box(0.08, DOORWAY.h, 0.12, M.mullion, DOORWAY.x - DOORWAY.w / 2, DOORWAY.h / 2, SOUTH, { cast: false });
  box(0.08, DOORWAY.h, 0.12, M.mullion, DOORWAY.x + DOORWAY.w / 2, DOORWAY.h / 2, SOUTH, { cast: false });
  box(DOORWAY.w + 0.16, 0.1, 0.12, M.mullion, DOORWAY.x, DOORWAY.h + 0.05, SOUTH, { cast: false });
  box(DOORWAY.w + 0.2, 0.04, 0.35, M.mullion, DOORWAY.x, 0.02, SOUTH + 0.06, { cast: false });

  // ---- street exterior: paver sidewalk, curb, road, lawn ----
  const walk = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM.w + 2, 3),
    new THREE.MeshStandardMaterial({ map: noiseTexture('#C2BDB2', ['#B4AFA4', '#CBC6BB', '#A9A499'], 900, 10), roughness: 0.55 })
  );
  walk.rotation.x = -Math.PI / 2;
  walk.position.set(0, 0.005, SOUTH + 1.5);
  scene.add(walk);
  box(ROOM.w + 2.4, 0.14, 0.22, M.curb, 0, 0.07, SOUTH + 2.95, { cast: false });
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 8),
    new THREE.MeshStandardMaterial({ map: noiseTexture('#45494E', ['#3C4046', '#50555C', '#41454B'], 1600, 20), roughness: 0.9 })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.004, SOUTH + 7);
  scene.add(road);
  for (const dx of [-12, -8.6, -5.2, -1.8, 1.6, 5, 8.4, 11.8]) {
    box(2, 0.005, 0.14, M.stripe, dx, 0.008, SOUTH + 7, { cast: false });
  }
  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ map: noiseTexture('#6C9A50', ['#5E8A45', '#53793C', '#78A85B', '#6FA254'], 2000, 30), roughness: 1 })
  );
  grass.rotation.x = -Math.PI / 2;
  grass.position.set(0, -0.02, 18);
  scene.add(grass);

  // fascia sign band with SIVCAMERA branding
  box(ROOM.w + 0.3, 0.5, 0.12, M.fascia, 0, 2.7, SOUTH + 0.14, { cast: false });
  const fasciaText = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 0.42), new THREE.MeshBasicMaterial({ map: textTexture('SIVCAMERA', 150, '#7FD8FF'), transparent: true }));
  fasciaText.position.set(0, 2.7, SOUTH + 0.22);
  scene.add(fasciaText);
  // window decal
  const decal = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.45), new THREE.MeshBasicMaterial({ map: textTexture('CAMERAS · LENSES · ACCESSORIES', 70, '#5FB8E8'), transparent: true, depthWrite: false }));
  decal.position.set(-2.0, 1.7, SOUTH + 0.02);
  scene.add(decal);
}

/* ============================ open glass door ============================ */
const doorsGroup = new THREE.Group(); doorsGroup.name = 'Door'; scene.add(doorsGroup);

function buildDoor() {
  const g = new THREE.Group();
  g.position.set(DOORWAY.x + DOORWAY.w / 2, 0, SOUTH); // hinge on the east jamb
  const pivot = new THREE.Group();
  const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.03, 2.05, DOORWAY.w - 0.18), M.glass);
  leaf.position.set(0.015, 1.06, -(DOORWAY.w - 0.18) / 2);
  const stileH = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.05, 0.05), M.mullion);
  stileH.position.set(0.025, 1.06, -0.025);
  const stileF = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.05, 0.05), M.mullion);
  stileF.position.set(0.025, 1.06, -(DOORWAY.w - 0.18) + 0.025);
  const railT = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, DOORWAY.w - 0.18), M.mullion);
  railT.position.set(0.025, 2.06, -(DOORWAY.w - 0.18) / 2);
  const railB = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, DOORWAY.w - 0.18), M.mullion);
  railB.position.set(0.025, 0.025, -(DOORWAY.w - 0.18) / 2);
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.2), M.chrome);
  handle.position.set(0.06, 1.05, -0.12);
  const hingeA = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.16, 0.04), M.metalDark);
  hingeA.position.set(0.05, 1.7, -0.02);
  const hingeB = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.16, 0.04), M.metalDark);
  hingeB.position.set(0.05, 0.4, -0.02);
  pivot.add(leaf, stileH, stileF, railT, railB, handle, hingeA, hingeB);
  pivot.rotation.y = -Math.PI * 100 / 180; // always open, into the room
  g.add(pivot);
  g.userData.label = 'Store door (open)';
  doorsGroup.add(g);
}

/* ============================ glass display counters ============================ */
const countersGroup = new THREE.Group(); countersGroup.name = 'Counters'; scene.add(countersGroup);

function buildCamera(g, x, y, z) {
  const cam = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.07, 0.08), M.camBody);
  body.position.y = 0.035;
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.032, 0.05, 10), M.lensGlass);
  lens.rotation.x = Math.PI / 2;
  lens.position.set(0, 0.035, 0.055);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.012, 10), M.chrome);
  ring.rotation.x = Math.PI / 2;
  ring.position.set(0, 0.035, 0.03);
  const flash = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.025, 0.03), M.camBody);
  flash.position.set(0, 0.09, -0.02);
  cam.add(body, lens, ring, flash);
  cam.position.set(x, y, z);
  cam.userData.label = 'Digital camera';
  g.add(cam);
}

function buildLens(g, x, y, z) {
  const lens = new THREE.Group();
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.06, 12), M.lensGlass);
  barrel.position.y = 0.03;
  const front = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.02, 12), M.metalDark);
  front.position.y = 0.06;
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.01, 12), M.chrome);
  ring.position.y = 0.035;
  lens.add(barrel, front, ring);
  lens.position.set(x, y, z);
  lens.userData.label = 'DSLR lens';
  g.add(lens);
}

function buildSD(g, x, y, z, c) {
  const sd = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.014, 0.011), new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 }));
  sd.position.set(x, y + 0.007, z);
  sd.userData.label = 'micro-SD card';
  g.add(sd);
}

function buildAcc(g, x, y, z, c) {
  const a = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.035, 0.05), new THREE.MeshStandardMaterial({ color: c, roughness: 0.5 }));
  a.position.set(x, y + 0.0175, z);
  a.userData.label = 'Electronics accessory';
  g.add(a);
}

function buildDisplayCounter(g, x, z) {
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 1.5), M.white);
  top.position.y = 0.85;
  top.receiveShadow = true;
  const caseGlass = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.5, 1.42), M.glassCase);
  caseGlass.position.y = 1.12;
  const rim = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.03, 1.46), M.chrome);
  rim.position.y = 1.37;
  g.add(top, caseGlass, rim);
  for (const [lx, lz] of [[-0.4, -0.68], [0.4, -0.68], [-0.4, 0.68], [0.4, 0.68]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.85, 0.05), M.chrome);
    leg.position.set(lx, 0.425, lz);
    g.add(leg);
  }
  // low-poly items inside the case, standing on the shelf top (y 0.875)
  const cols = [-0.3, -0.1, 0.1, 0.3];
  buildCamera(g, cols[0], 0.9, -0.15);
  buildLens(g, cols[0], 0.9, 0.25);
  buildCamera(g, cols[1], 0.9, 0.2);
  buildLens(g, cols[2], 0.9, -0.2);
  buildCamera(g, cols[3], 0.9, 0.15);
  buildSD(g, cols[1], 0.9, -0.3, '#2E6FD8');
  buildSD(g, cols[2], 0.9, 0.3, '#2E6FD8');
  buildAcc(g, cols[0], 0.9, 0.45, '#D94F4F');
  buildAcc(g, cols[3], 0.9, -0.42, '#3E9B5F');
  g.position.set(x, 0, z);
  g.userData.label = 'Display counter';
  countersGroup.add(g);
}

/* ============================ repair counter + warranty sign ============================ */
const repairGroup = new THREE.Group(); repairGroup.name = 'Repair'; scene.add(repairGroup);

function buildRepair() {
  const g = new THREE.Group();
  g.position.set(-0.3, 0, -3.4);
  // service desk
  const deskTop = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.06, 0.8), M.white);
  deskTop.position.y = 0.78;
  const sideL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.78, 0.8), M.metalDark);
  sideL.position.set(-1.27, 0.39, 0);
  const sideR = sideL.clone(); sideR.position.x = 1.27;
  const front = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.78, 0.05), M.metalDark);
  front.position.set(0, 0.39, 0.38);
  g.add(deskTop, sideL, sideR, front);
  // laptop
  const lapBase = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.02, 0.3), M.metalDark);
  lapBase.position.set(0.25, 0.81, 0.1);
  const lapScreen = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.3, 0.015), M.metalDark);
  lapScreen.position.set(0.25, 1.0, 0.07);
  lapScreen.rotation.x = -0.35;
  const lapDisplay = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.24), M.screen);
  lapDisplay.position.set(0.25, 1.01, 0.065);
  lapDisplay.rotation.x = -0.35;
  lapBase.userData.label = 'Laptop';
  g.add(lapBase, lapScreen, lapDisplay);
  // camera testing equipment
  const testBody = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.2, 0.3), M.metalDark);
  testBody.position.set(-0.55, 0.88, 0.05);
  const testMount = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.06, 12), M.chrome);
  testMount.position.set(-0.55, 1.02, 0.05);
  const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.015, 10), M.chrome);
  dial.rotation.z = Math.PI / 2;
  dial.position.set(-0.42, 0.95, 0.1);
  testBody.userData.label = 'Camera testing equipment';
  g.add(testBody, testMount, dial);

  // hanging "WARRANTY REPAIR" acrylic sign
  const acrylic = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.26, 0.02), M.glassCase);
  acrylic.position.set(0, 2.2, -0.35);
  const signText = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.18), new THREE.MeshBasicMaterial({ map: textTexture('WARRANTY REPAIR', 110, '#5FB8E8'), transparent: true }));
  signText.position.set(0, 2.2, -0.34);
  signText.rotation.y = Math.PI; // face the shop floor (+z)
  acrylic.userData.label = 'Warranty Repair sign';
  g.add(acrylic, signText);
  for (const sx of [-0.45, 0.45]) {
    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.75, 6), M.metalDark);
    wire.position.set(sx, 2.57, -0.35);
    g.add(wire);
  }
  repairGroup.add(g);
}

/* ============================ pegboard shelving ============================ */
const shelvingGroup = new THREE.Group(); shelvingGroup.name = 'Shelving'; scene.add(shelvingGroup);

function buildShelving() {
  const boardMat = new THREE.MeshStandardMaterial({ map: pegboardTexture(), roughness: 0.5, metalness: 0.6 });
  const pkgColors = ['#D94F4F', '#E8892E', '#3E9B5F', '#3B6FD8', '#8A4FC9', '#D8B62E'];
  let ci = 0;
  for (const bz of [-1.3, 1.4]) {
    const board = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.9, 1.6), boardMat);
    board.position.set(EAST - 0.13, 1.55, bz);
    board.userData.label = 'Metal pegboard';
    shelvingGroup.add(board);
    const spots = [[2.25, -0.5], [2.25, 0.15], [1.8, -0.3], [1.8, 0.35], [1.35, -0.45], [1.35, 0.2]];
    for (const [py, pz] of spots) {
      const pkg = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.2, 0.05),
        new THREE.MeshStandardMaterial({ color: pkgColors[ci++ % pkgColors.length], roughness: 0.5 })
      );
      pkg.position.set(EAST - 0.18, py, bz + pz);
      pkg.userData.label = 'Packaged electronics';
      shelvingGroup.add(pkg);
    }
  }
  // small wall shelf on the west wall with boxes
  for (const sy of [1.2, 1.85]) {
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 0.35), M.white);
    shelf.position.set(WEST + 0.12, sy, -1.5);
    shelvingGroup.add(shelf);
    for (let i = 0; i < 3; i++) {
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.14, 0.16),
        new THREE.MeshStandardMaterial({ color: pkgColors[(ci + i) % pkgColors.length], roughness: 0.5 })
      );
      b.position.set(WEST + 0.13, sy + 0.08, -1.7 + i * 0.2);
      shelvingGroup.add(b);
    }
    ci++;
  }
}

/* ============================ track lights + wall logo ============================ */
const decorGroup = new THREE.Group(); decorGroup.name = 'Decor'; scene.add(decorGroup);

function buildDecor() {
  // cool 6000K LED track lights
  for (const tz of [-1.6, 0.8, 2.2]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.06, 0.06), M.metalDark);
    rail.position.set(0, 2.93, tz);
    decorGroup.add(rail);
    for (const tx of [-2.5, 0, 2.5]) {
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.1, 0.1), M.metalDark);
      head.position.set(tx, 2.87, tz);
      const tip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 0.08), M.trackTip);
      tip.position.set(tx, 2.81, tz);
      head.userData.label = 'LED track light';
      decorGroup.add(head, tip);
    }
  }
  // SIVCAMERA wall logo above the repair desk
  const logo = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.8), new THREE.MeshStandardMaterial({ map: textTexture('SIVCAMERA', 120, '#7FD8FF'), roughness: 0.6 }));
  logo.position.set(0, 2.3, NORTH + 0.14);
  logo.rotation.y = Math.PI; // face the shop floor (+z)
  logo.userData.label = 'SIVCAMERA logo';
  decorGroup.add(logo);
}

/* ============================ street furniture ============================ */
function buildTree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09 * s, 0.14 * s, 1.8 * s, 8), M.shelfWood);
  trunk.position.y = 0.9 * s;
  const f1 = new THREE.Mesh(new THREE.SphereGeometry(0.85 * s, 10, 8), M.foliage);
  f1.position.set(0, 2.4 * s, 0);
  const f2 = new THREE.Mesh(new THREE.SphereGeometry(0.55 * s, 10, 8), M.foliage);
  f2.position.set(0.45 * s, 2.0 * s, 0.2 * s);
  g.add(trunk, f1, f2);
  g.position.set(x, 0, z);
  scene.add(g);
}

function buildStreetFurniture() {
  for (const [lx, lz] of [[4.2, 6.4], [-4.4, 7.0]]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 4.5, 10), M.metalDark);
    pole.position.set(lx, 2.25, lz);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.9), M.metalDark);
    arm.position.set(lx, 4.5, lz);
    arm.rotation.x = Math.PI / 2;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.3, 0.3), M.trackTip);
    head.position.set(lx, 4.55, lz + 0.45);
    scene.add(pole, arm, head);
  }
  buildTree(-8.5, 19, 1.2);
  buildTree(2, 20.5, 1.0);
  buildTree(10.5, 19, 1.15);
}

/* ============================ build the store ============================ */
buildShell();
buildDoor();
buildDisplayCounter(countersGroup, -2.2, 0.6);
buildDisplayCounter(countersGroup, 1.6, 0.6);
buildRepair();
buildShelving();
buildDecor();
buildStreetFurniture();

/* ============================ picking & selection ============================ */
const pickGroups = [countersGroup, repairGroup, shelvingGroup, doorsGroup, decorGroup];
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const selEl = document.getElementById('sel');

let activeGroup = null, hlMats = [], hlBase = [];

function findLabel(o) {
  while (o) {
    if (o.userData && o.userData.label) return o.userData.label;
    o = o.parent;
  }
  return null;
}

function clearHighlight() {
  if (activeGroup) {
    hlMats.forEach((m, i) => {
      const b = hlBase[i];
      if (m.emissive && b.e) m.emissive.copy(b.e);
      m.emissiveIntensity = b.i;
    });
    hlMats = []; hlBase = []; activeGroup = null;
  }
}

function highlight(group) {
  clearHighlight();
  activeGroup = group;
  hlMats = [];
  hlBase = [];
  group.traverse(o => {
    if (o.isMesh && o.material) {
      hlMats.push(o.material);
      hlBase.push({ e: o.material.emissive ? o.material.emissive.clone() : null, i: o.material.emissiveIntensity });
    }
  });
}

renderer.domElement.addEventListener('pointermove', e => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickGroups, true)[0];
  renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
});

renderer.domElement.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickGroups, true);
  if (!hits.length) { clearHighlight(); selEl.textContent = '—'; return; }
  let obj = hits[0].object;
  while (obj && !pickGroups.includes(obj)) obj = obj.parent;
  if (!obj) return;
  highlight(obj);
  selEl.textContent = findLabel(hits[0].object) || obj.name || 'Object';
});

/* ============================ controls & HUD ============================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.8;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.enablePan = false;
controls.autoRotateSpeed = 0.6;

controls.addEventListener('start', () => { renderer.domElement.style.cursor = 'grabbing'; });
controls.addEventListener('end',   () => { renderer.domElement.style.cursor = 'grab'; });

const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnOrbit.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btnReset').addEventListener('click', () => {
  controls.autoRotate = false;
  btnOrbit.classList.remove('on');
  camera.position.copy(HOME_POS);
  controls.target.copy(HOME_TGT);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// scene stats
let tris = 0, meshes = 0;
scene.traverse(o => {
  if (o.isMesh) {
    meshes++;
    const g = o.geometry;
    if (g.index) tris += g.index.count / 3;
    else if (g.attributes.position) tris += g.attributes.position.count / 3;
  }
});
document.getElementById('stats').textContent = `${meshes} meshes · ${Math.round(tris).toLocaleString()} tris`;

/* ============================ render loop ============================ */
const clock = new THREE.Clock();
let intro = true;
const introT0 = performance.now();
const INTRO_FROM = new THREE.Vector3(6.5, 3.2, -6.5);
const INTRO_TGT0 = new THREE.Vector3(0, 1, 0);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.elapsedTime;

  if (intro) {
    const p = Math.min((performance.now() - introT0) / 1500, 1);
    const e = 1 - Math.pow(1 - p, 3);
    camera.position.lerpVectors(INTRO_FROM, HOME_POS, e);
    controls.target.lerpVectors(INTRO_TGT0, HOME_TGT, e);
    if (p >= 1) intro = false;
  }

  if (activeGroup) {
    const p = 0.35 + 0.25 * (0.5 + 0.5 * Math.sin(t * 3.5));
    hlMats.forEach(m => {
      if (m.emissive) m.emissive.setHex(0xFFB84D);
      m.emissiveIntensity = p;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
