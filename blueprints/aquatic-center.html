<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquatic Center · 50m Olympic Pool</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1620; font-family: 'Segoe UI', system-ui, sans-serif; }
  #c { position: fixed; inset: 0; }
  #ui {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
  }
  #ui button {
    background: rgba(10, 20, 32, 0.72); color: #d8f2ff; border: 1px solid rgba(120, 200, 255, 0.35);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.2s;
  }
  #ui button:hover { background: rgba(30, 90, 140, 0.75); }
  #stats {
    position: fixed; bottom: 14px; left: 14px; z-index: 10; color: #9fd8ff; font-size: 12px;
    background: rgba(10, 20, 32, 0.6); padding: 6px 12px; border-radius: 12px; backdrop-filter: blur(4px);
  }
  #label {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(8, 18, 30, 0.85); color: #eaf8ff; padding: 8px 18px; border-radius: 18px;
    font-size: 14px; border: 1px solid rgba(120, 200, 255, 0.4); opacity: 0; transition: opacity 0.25s;
    pointer-events: none; max-width: 80vw; text-align: center;
  }
  #hint { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 9; color: rgba(220, 240, 255, 0.55); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btnOrbit">Auto-orbit</button>
  <button id="btnReset">Reset view</button>
</div>
<div id="stats">…</div>
<div id="label"></div>
<div id="hint">Drag to orbit · scroll to zoom · click anything to inspect it</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcecf7);
scene.fog = new THREE.Fog(0xdcecf7, 60, 150);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 800);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2;
controls.maxDistance = 120;

// ---------- helpers ----------
const H = (w, h, d, mat, x, y, z, ry = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.y = ry;
  return m;
};
const std = (o, extra = {}) => Object.assign(new THREE.MeshStandardMaterial(o), extra);
const pickable = [];

function makeTileTexture(base1, base2) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const n = 8, s = 512 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    g.fillStyle = (i + j) % 2 === 0 ? base1 : base2;
    g.fillRect(i * s, j * s, s, s);
    g.strokeStyle = 'rgba(0,0,0,0.14)'; g.lineWidth = 5;
    g.strokeRect(i * s + 2.5, j * s + 2.5, s - 5, s - 5);
    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.fillRect(i * s + 8, j * s + 8, s - 16, s - 16);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const deckTex = makeTileTexture('#b7d4ec', '#e9f2fa');
const wallTex = makeTileTexture('#7fb8dd', '#cfe4f2');
const poolTex = makeTileTexture('#3f9cc9', '#5fb2da');

const matDeck = std({ map: deckTex, roughness: 0.1, metalness: 0.0 });
const matWallTile = std({ map: wallTex, roughness: 0.25, metalness: 0.0 });
const matPoolTile = std({ map: poolTex, roughness: 0.35, metalness: 0.0 });
const matMetal = std({ color: 0x2a2f35, roughness: 0.35, metalness: 0.85 });
const matChrome = std({ color: 0xc9ced4, roughness: 0.12, metalness: 0.95 });
const matLight = std({ color: 0xe8f4ff, roughness: 0.5, metalness: 0.0 });

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xdff0ff, 0x3a4a55, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3dd, 2.6);
sun.position.set(-42, 32, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0004;
scene.add(sun);

const waterLights = [];
for (const z of [-12, 0, 12]) {
  const pl = new THREE.PointLight(0x2fe0b8, 70, 40, 2);
  pl.position.set(0, -1.2, z);
  scene.add(pl); waterLights.push(pl);
}

// ---------- pool floor texture (lane lines) ----------
function makePoolFloorTexture() {
  const W = 640, Hh = 280;
  const c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const g = c.getContext('2d');
  g.fillStyle = '#4aa8d8'; g.fillRect(0, 0, W, Hh);
  g.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++) {
    if ((i + j) % 2) g.fillRect(i * W / 8, j * Hh / 4, W / 8, Hh / 4);
  }
  const ux = (x) => (x + 10.8) / 21.6 * W;
  const uz = (z) => (z + 25) / 50 * Hh;
  g.strokeStyle = '#1c5a82'; g.lineWidth = 7;
  for (let x = -10; x <= 10.0001; x += 2.5) {
    g.beginPath(); g.moveTo(ux(x), 0); g.lineTo(ux(x), Hh); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 6;
  for (let x = -8.75; x <= 8.75; x += 2.5) {
    g.beginPath(); g.moveTo(ux(x), 0); g.lineTo(ux(x), Hh); g.stroke();
  }
  g.strokeStyle = 'rgba(15,50,75,0.5)'; g.lineWidth = 3;
  for (let z = -20; z <= 20; z += 5) {
    g.beginPath(); g.moveTo(0, uz(z)); g.lineTo(W, uz(z)); g.stroke();
  }
  g.fillStyle = 'rgba(255,255,255,0.92)';
  for (let x = -8.75; x <= 8.75; x += 2.5) {
    const y0 = uz(-24.1);
    g.fillRect(ux(x) - 32, y0, 64, 7);
    g.fillRect(ux(x) - 5, y0 - 28, 10, 28);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

// ---------- pool basin ----------
const poolGroup = new THREE.Group();
scene.add(poolGroup);

const floorTex = makePoolFloorTexture();
const poolFloorMat = std({ map: floorTex, roughness: 0.5, metalness: 0.0 });
const poolBottom = new THREE.Mesh(new THREE.PlaneGeometry(21.6, 50), poolFloorMat);
poolBottom.rotation.x = -Math.PI / 2;
poolBottom.position.set(0, -2.0, 0);
poolBottom.receiveShadow = true;
poolGroup.add(poolBottom);

const poolWalls = [
  H(50, 2, 0.35, matPoolTile, 0, -1, -25),
  H(50, 2, 0.35, matPoolTile, 0, -1, 25),
  H(0.35, 2, 50, matPoolTile, -10.8, -1, 0),
  H(0.35, 2, 50, matPoolTile, 10.8, -1, 0),
];
poolWalls.forEach(w => poolGroup.add(w));

// coping around pool rim
const coping = std({ color: 0xe8eef4, roughness: 0.25, metalness: 0.0 });
[
  H(50.4, 0.08, 0.3, coping, 0, 0.04, -10.8),
  H(50.4, 0.08, 0.3, coping, 0, 0.04, 10.8),
  H(0.3, 0.08, 50.4, coping, -10.8, 0.04, 0),
  H(0.3, 0.08, 50.4, coping, 10.8, 0.04, 0),
].forEach(m => poolGroup.add(m));

// ---------- custom animated water shader ----------
const waterUniforms = {
  uTime: { value: 0 },
  uHover: { value: 0 },
  uColor: { value: new THREE.Color(0x00A86B) },
  uDeep: { value: new THREE.Color(0x024a3c) },
  uSunDir: { value: new THREE.Vector3(-0.6, 0.55, 0.25).normalize() },
  uSunCol: { value: new THREE.Color(1.0, 0.95, 0.82) },
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    varying vec3 vWorldPos;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vec3 p = position;
      float w = sin(p.x * 0.33 + uTime * 1.25) * 0.05
              + cos(p.z * 0.26 + uTime * 1.05) * 0.05
              + sin((p.x + p.z) * 0.55 + uTime * 1.8) * 0.025;
      p.y += w;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uHover;
    uniform vec3 uColor;
    uniform vec3 uDeep;
    uniform vec3 uSunDir;
    uniform vec3 uSunCol;
    varying vec3 vWorldPos;
    varying vec2 vUv;
    void main() {
      vec3 dx = dFdx(vWorldPos);
      vec3 dy = dFdy(vWorldPos);
      vec3 n = normalize(cross(dx, dy));
      if (!gl_FrontFacing) n = -n;
      float wave = (n.y + 1.0) * 0.5;
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);
      vec3 col = mix(uDeep, uColor, 0.25 + wave * 0.55);
      col = mix(col, vec3(0.88, 1.0, 0.95), fres * 0.5);
      vec3 Hv = normalize(uSunDir + V);
      float spec = pow(max(dot(n, Hv), 0.0), 220.0);
      col += uSunCol * spec * 1.3;
      float spark = pow(max(sin(vUv.x * 220.0 + uTime * 3.0) * cos(vUv.y * 160.0 - uTime * 2.0), 0.0), 6.0);
      col += vec3(1.0, 1.0, 0.95) * spark * 0.05;
      col += vec3(0.4, 1.0, 0.7) * uHover * 0.18;
      float alpha = 0.82 - fres * 0.22;
      gl_FragColor = vec4(col, alpha);
    }
  `,
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(21.6, 50), waterMat);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.03, 0);
poolGroup.add(water);
pickable.push({ obj: water, name: 'Olympic pool — animated water surface' });

// caustics plane under the water
function makeCausticsTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * 256, y = Math.random() * 256;
    const r = 4 + Math.random() * 16;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,255,255,${0.15 + Math.random() * 0.35})`);
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const caustTex = makeCausticsTexture();
const causticsMat = new THREE.MeshBasicMaterial({
  map: caustTex, blending: THREE.AdditiveBlending, transparent: true,
  opacity: 0.55, depthWrite: false, color: 0x9fe8d0,
});
const caustics = new THREE.Mesh(new THREE.PlaneGeometry(21.6, 50), causticsMat);
caustics.rotation.x = -Math.PI / 2;
caustics.position.set(0, -1.0, 0);
poolGroup.add(caustics);

// ---------- lane ropes + buoys ----------
const laneGroup = new THREE.Group();
const ropeMat = std({ color: 0x406070, roughness: 0.4, metalness: 0.4 });
const buoyMat = std({ color: 0x1f5f8f, roughness: 0.45, metalness: 0.05 });
let ropeIdx = 0;
for (let x = -10; x <= 10.0001; x += 2.5) {
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 50, 6), ropeMat);
  rope.rotation.z = Math.PI / 2;
  rope.position.set(x, 0.16, 0);
  laneGroup.add(rope);
  const n = 33;
  const buoys = new THREE.InstancedMesh(new THREE.SphereGeometry(0.09, 8, 6), buoyMat, n);
  const col = ropeIdx % 2 === 0 ? 0x1f5f8f : 0xe8eef4;
  buoyMat.color.set(col);
  const m = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const z = -24.2 + (i / (n - 1)) * 48.4;
    m.makeTranslation(x, 0.16, z);
    buoys.setMatrixAt(i, m);
  }
  laneGroup.add(buoys);
  ropeIdx++;
}
scene.add(laneGroup);
pickable.push({ obj: laneGroup, name: 'Lane ropes & floating lane dividers (8 lanes)' });

// backstroke flags
const flagMatA = std({ color: 0xe0484f, roughness: 0.6, side: THREE.DoubleSide });
const flagMatB = std({ color: 0xf2c232, roughness: 0.6, side: THREE.DoubleSide });
for (const fz of [-20, 20]) {
  const line = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 22, 4), ropeMat);
  line.rotation.z = Math.PI / 2;
  line.position.set(0, 2.3, fz);
  scene.add(line);
  for (let i = 0; i < 16; i++) {
    const fx = -10.6 + (i / 15) * 21.2;
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.35), i % 2 ? flagMatA : flagMatB);
    flag.position.set(fx, 2.22, fz);
    flag.rotation.x = Math.PI / 2;
    flag.rotation.y = 0;
    scene.add(flag);
  }
}

// ---------- starting blocks ----------
const blockGroup = new THREE.Group();
const matBlock = std({ color: 0xd8dde2, roughness: 0.3, metalness: 0.2 });
const matBlockTop = std({ color: 0x1f7fbf, roughness: 0.25, metalness: 0.1 });
let bi = 0;
for (let x = -8.75; x <= 8.75; x += 2.5) {
  const b = new THREE.Group();
  b.position.set(x, 0, -24.85);
  b.add(H(0.6, 0.5, 0.62, matBlockTop, 0, 0.72, -0.25));
  b.add(H(0.5, 0.55, 0.4, matBlock, 0, 0.27, 0.05));
  const backrest = H(0.6, 0.55, 0.07, matBlock, 0, 0.72, 0.28);
  backrest.rotation.x = 0.18;
  b.add(backrest);
  const rail1 = H(0.03, 0.5, 0.03, matChrome, -0.28, 0.85, -0.3);
  const rail2 = H(0.03, 0.5, 0.03, matChrome, 0.28, 0.85, -0.3);
  b.add(rail1, rail2);
  const grip = H(0.6, 0.03, 0.03, matChrome, 0, 1.05, -0.3);
  b.add(grip);
  blockGroup.add(b);
  bi++;
}
scene.add(blockGroup);
pickable.push({ obj: blockGroup, name: 'Starting blocks (8 lanes, north end)' });

// ---------- wet deck ----------
const deckTiles = [
  H(36, 0.15, 4.4, matDeck, 0, 0.075, -27.2),
  H(36, 0.15, 4.4, matDeck, 0, 0.075, 27.2),
  H(7.2, 0.15, 50.8, matDeck, -14.4, 0.075, 0),
  H(7.2, 0.15, 50.8, matDeck, 14.4, 0.075, 0),
];
deckTiles.forEach(m => { m.receiveShadow = true; m.castShadow = true; scene.add(m); });
deckTiles.forEach(m => m.material.map.repeat.set(m.geometry.parameters.width / 0.5, m.geometry.parameters.depth / 0.5));

// lifeguard chair on west deck
const lgc = new THREE.Group();
lgc.position.set(-13.5, 0, 14);
lgc.add(H(0.06, 2.6, 0.06, matMetal, -0.4, 1.3, 0));
lgc.add(H(0.06, 2.6, 0.06, matMetal, 0.4, 1.3, 0));
lgc.add(H(0.06, 2.6, 0.06, matMetal, -0.4, 1.3, -0.5));
lgc.add(H(0.06, 2.6, 0.06, matMetal, 0.4, 1.3, -0.5));
lgc.add(H(1.1, 0.06, 0.8, matMetal, 0, 2.62, -0.25));
lgc.add(H(1.0, 0.12, 0.7, matLight, 0, 2.72, -0.25));
scene.add(lgc);

// ---------- spectator gallery (2nd floor, east) ----------
const gallery = new THREE.Group();
const matSlab = std({ color: 0x9aa2aa, roughness: 0.5, metalness: 0.1 });
const matSeat = std({ color: 0x2d7fb8, roughness: 0.5, metalness: 0.05 });
const matRail = std({ color: 0x22262b, roughness: 0.4, metalness: 0.8 });

const slab = H(4.4, 0.4, 40, matSlab, 15.8, 5.8, 0);
slab.castShadow = true; slab.receiveShadow = true;
gallery.add(slab);

// railing front + sides
const railPosts = [];
for (let z = -19; z <= 19; z += 2) {
  const p = H(0.06, 1.1, 0.06, matRail, 13.6, 6.5, z);
  gallery.add(p); railPosts.push(p);
}
for (let x = 13.6; x <= 17.8; x += 1.4) {
  const p1 = H(0.06, 1.1, 0.06, matRail, x, 6.5, -20);
  const p2 = H(0.06, 1.1, 0.06, matRail, x, 6.5, 20);
  gallery.add(p1, p2);
}
gallery.add(H(0.05, 0.06, 40, matRail, 13.6, 7.05, 0));
gallery.add(H(0.05, 0.06, 40, matRail, 13.6, 6.3, 0));
gallery.add(H(4.2, 0.06, 0.05, matRail, 15.8, 7.05, -20));
gallery.add(H(4.2, 0.06, 0.05, matRail, 15.8, 7.05, 20));
gallery.add(H(4.2, 0.06, 0.05, matRail, 15.8, 6.3, -20));
gallery.add(H(4.2, 0.06, 0.05, matRail, 15.8, 6.3, 20));

// stepped seating at the back
for (let r = 0; r < 4; r++) {
  const step = H(3.6 - r * 0.35, 0.34, 39, matSeat, 15.2 + r * 0.7, 6.2 + r * 0.4, 0);
  step.position.x = 14.9 + r * 0.72;
  gallery.add(step);
}

// support columns
for (const z of [-16, -8, 0, 8, 16]) {
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 6.1, 12), matRail);
  col.position.set(13.6, 3.05, z);
  gallery.add(col);
}
for (const z of [-16, 0, 16]) {
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 6.1, 12), matRail);
  col.position.set(15.9, 3.05, z);
  gallery.add(col);
}

// stairs up to the gallery (south end of east deck)
for (let i = 0; i < 14; i++) {
  const step = H(3, 0.43, 0.28, matSlab, 13.5, i * 0.43 + 0.215, 24.2 - i * 0.28);
  step.castShadow = true;
  gallery.add(step);
}
gallery.add(H(0.06, 1.0, 0.06, matRail, 12.05, 0.5, 22.4));
gallery.add(H(0.06, 1.0, 0.06, matRail, 12.05, 0.5, 23.9));

scene.add(gallery);
pickable.push({ obj: gallery, name: 'Spectator gallery — 2nd floor balcony with railing' });

// ---------- building enclosure ----------
// north wall
const wallNorth = new THREE.Group();
wallNorth.add(H(36, 2.6, 0.4, matWallTile, 0, 1.3, -29));
wallNorth.add(H(36, 9.0, 0.4, std({ color: 0xe9eef2, roughness: 0.6 }), 0, 7.4, -29));
scene.add(wallNorth);

// scoreboard
function makeScoreboardTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 384;
  const g = c.getContext('2d');
  g.fillStyle = '#0a1420'; g.fillRect(0, 0, 1024, 384);
  g.strokeStyle = '#2fe0b8'; g.lineWidth = 14;
  g.strokeRect(20, 20, 984, 344);
  g.fillStyle = '#2fe0b8';
  g.font = 'bold 92px "Segoe UI", sans-serif';
  g.textAlign = 'center';
  g.fillText('KEYAKI AQUATIC CENTER', 512, 160);
  g.font = '600 54px "Segoe UI", sans-serif';
  g.fillStyle = '#e8f6ff';
  g.fillText('50m OLYMPIC POOL  ·  8 LANES', 512, 250);
  g.fillStyle = '#9fd8ff';
  g.font = '42px "Segoe UI", sans-serif';
  g.fillText('TOKYO METROPOLITAN ADVANCED NURTURING H.S.', 512, 330);
  const t = new THREE.CanvasTexture(c);
  return t;
}
const scoreGroup = new THREE.Group();
const scoreMat = new THREE.MeshBasicMaterial({ map: makeScoreboardTexture() });
const board = new THREE.Mesh(new THREE.PlaneGeometry(13, 4.9), scoreMat);
board.position.set(0, 6.4, -28.7);
scoreGroup.add(board);
scoreGroup.add(H(13.6, 0.25, 0.25, matRail, 0, 8.9, -28.9));
scoreGroup.add(H(13.6, 0.25, 0.25, matRail, 0, 3.9, -28.9));
scene.add(scoreGroup);
pickable.push({ obj: scoreGroup, name: 'Scoreboard — 50m Olympic pool · 8 lanes' });

// wall clock on south wall
function makeClockTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f7fa'; g.beginPath(); g.arc(128, 128, 118, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#222'; g.lineWidth = 10; g.beginPath(); g.arc(128, 128, 118, 0, Math.PI * 2); g.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    g.strokeStyle = '#222'; g.lineWidth = 8;
    g.beginPath();
    g.moveTo(128 + Math.sin(a) * 96, 128 - Math.cos(a) * 96);
    g.lineTo(128 + Math.sin(a) * 112, 128 - Math.cos(a) * 112);
    g.stroke();
  }
  g.strokeStyle = '#222'; g.lineWidth = 8;
  g.beginPath(); g.moveTo(128, 128); g.lineTo(128, 60); g.stroke();
  g.beginPath(); g.moveTo(128, 128); g.lineTo(172, 128); g.stroke();
  const t = new THREE.CanvasTexture(c);
  return t;
}

function makeTree(x, z, s) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 2.4 * s, 7), std({ color: 0x6b4a2f, roughness: 0.9 }));

  for (let i = 0; i < 4; i++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry((0.9 + Math.random() * 0.4) * s, 0),
      std({ color: i % 2 ? 0x4f9e46 : 0x5fb054, roughness: 0.9, flatShading: true }));
    blob.position.set((Math.random() - 0.5) * 1.3 * s, (2.6 + Math.random() * 0.8) * s, (Math.random() - 0.5) * 1.3 * s);
    t.add(blob);
  }
  t.position.set(x, 0, z);
  return t;
}

// ---------- picking / labels ----------
const labelEl = document.getElementById('label');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hovered = new Set();
let selected = null;

function highlight(mesh, on) {
  if (mesh.userData.noHighlight) return;
  if (mesh.material && mesh.material.emissive) {
    if (on) {
      if (!mesh.userData._baseEm) mesh.userData._baseEm = mesh.material.emissive.clone();
      mesh.material.emissive.copy(mesh.userData._baseEm).addScalar(on ? 0.35 : 0);
      mesh.material.emissiveIntensity = on ? 0.6 : 0;
    } else {
      if (mesh.userData._baseEm) mesh.material.emissive.copy(mesh.userData._baseEm);
      mesh.material.emissiveIntensity = 0;
    }
  }
}
function applyHover(group, on) {
  group.traverse(o => {
    if (o.isMesh) highlight(o, on);
  });
}
function setLabel(text, show) {
  labelEl.textContent = text;
  labelEl.style.opacity = show ? 1 : 0;
}

canvas.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const objs = pickables.map(p => p.obj);
  const hits = raycaster.intersectObjects(objs, true);
  if (hits.length) {
    canvas.style.cursor = 'pointer';
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry && !hovered.has(entry.obj)) {
      hovered.forEach(o => applyHover(o, false));
      hovered.clear();
      hovered.add(entry.obj);
      applyHover(entry.obj, true);
      if (entry.obj === water) waterUniforms.uHover.value = 1;
      setLabel(entry.name, true);
    }
  } else {
    if (hovered.size) {
      hovered.forEach(o => { applyHover(o, false); if (o === water) waterUniforms.uHover.value = 0; });
      hovered.clear();
    }
    canvas.style.cursor = 'grab';
    setLabel('', false);
  }
});

canvas.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry) { selected = entry; setLabel(entry.name, true); }
  }
});

camera.position.copy(intro.from);
controls.target.copy(intro.fromT);
controls.enabled = false;

// ---------- animate ----------
const clock3 = new THREE.Clock();
const statsEl = document.getElementById('stats');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);
  const t = clock3.elapsedTime;

  waterUniforms.uTime.value = t;
  caustTex.offset.set(t * 0.012, t * 0.008);
  waterLights.forEach((pl, i) => {
    pl.intensity = 70 + Math.sin(t * 1.2 + i * 2.1) * 10;
  });

  if (intro.active) {
    intro.t += dt / 1.8;
    const k = Math.min(intro.t, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(intro.from, intro.to, e);
    controls.target.lerpVectors(intro.fromT, intro.toT, e);
    if (k >= 1) { intro.active = false; controls.enabled = true; }
  }
  if (autoOrbit && !intro.active) controls.autoRotate = true;
  else controls.autoRotate = false;

  controls.update();
  renderer.render(scene, camera);
  statsEl.textContent = `${renderer.info.render.triangles.toLocaleString()} tris · ${renderer.info.render.calls} draw calls`;
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
