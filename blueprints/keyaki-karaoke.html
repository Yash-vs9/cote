<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyaki Karaoke Lounge — Private Room (WebGL)</title>
<style>
  :root { --panel: rgba(18,20,24,0.72); --line: rgba(255,255,255,0.14); --txt: #e8e6e1; --acc: #c084fc; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#101216; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; color:var(--txt); pointer-events:none; user-select:none; }
  #title { top:16px; left:18px; }
  #title h1 { font-size:15px; font-weight:600; letter-spacing:0.04em; }
  #title p  { font-size:11px; opacity:0.65; margin-top:3px; letter-spacing:0.08em; }
  .chip { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:10px; opacity:0.9; margin-top:8px; letter-spacing:0.05em; }
  #readout { top:16px; right:18px; text-align:right; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; backdrop-filter:blur(6px); min-width:130px; }
  #readout .lbl { opacity:0.55; font-size:10px; text-transform:uppercase; letter-spacing:0.14em; }
  #readout .val { margin-top:4px; font-weight:600; color:var(--acc); }
  #hint { bottom:18px; left:50%; transform:translateX(-50%); font-size:12px; opacity:0.85; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 16px; letter-spacing:0.03em; white-space:nowrap; }
  #tools { bottom:18px; right:18px; display:flex; gap:8px; pointer-events:auto; }
  .btn { font:inherit; font-size:12px; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; letter-spacing:0.03em; transition:background .15s, border-color .15s; }
  .btn:hover { background:rgba(255,255,255,0.12); }
  .btn.on { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title">
  <h1>Keyaki Karaoke Lounge · Private Room</h1>
  <p>TOKYO METROPOLITAN ADVANCED NURTURING HIGH SCHOOL</p>
  <div class="chip" id="stats"></div>
</div>
<div class="hud" id="readout"><div class="lbl">Selection</div><div class="val" id="sel">—</div></div>
<div class="hud" id="hint">🖱️&nbsp;Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click to inspect</div>
<div class="hud" id="tools">
  <button class="btn" id="btnOrbit">Auto-orbit</button>
  <button class="btn" id="btnReset">Reset view</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================ renderer / scene / camera ============================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B0A10);
scene.fog = new THREE.Fog(0x0B0A10, 5, 14);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 60);
const HOME_POS = new THREE.Vector3(2.4, 1.7, 1.4);
const HOME_TGT = new THREE.Vector3(-0.7, 1.1, -0.7);
camera.position.copy(HOME_POS);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
pmrem.dispose();

/* ============================ lighting: dark atmosphere + dynamic RGB ============================ */
scene.add(new THREE.HemisphereLight(0x3A2E55, 0x151219, 0.35));
const tvFill = new THREE.PointLight(0x9FC7FF, 6, 6, 2);
tvFill.position.set(0, 1.6, -1.8);
scene.add(tvFill);
const tableSpot = new THREE.PointLight(0xFFD9A0, 8, 4, 2);
tableSpot.position.set(-0.8, 2.5, 1.2);
scene.add(tableSpot);
const ballGlint = new THREE.PointLight(0xFFFFFF, 4, 4, 2);
ballGlint.position.set(0, 2.7, 0);
scene.add(ballGlint);
// dynamic RGB LED strip lights (animated in the render loop)
const lightSofa = new THREE.PointLight(0xFF00FF, 5, 4.5, 2);
lightSofa.position.set(-1.4, 0.5, 2.3);
scene.add(lightSofa);
const lightTable = new THREE.PointLight(0x00FFFF, 4, 4, 2);
lightTable.position.set(-0.8, 0.45, 1.2);
scene.add(lightTable);

/* ============================ PBR materials ============================ */
function acousticTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#23262B';
  ctx.fillRect(0, 0, 256, 256);
  for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
    const x = gx * 64 + 4, y = gy * 64 + 4;
    const v = 38 + Math.random() * 10;
    ctx.fillStyle = `rgb(${v},${v + 2},${v + 6})`;
    ctx.beginPath();
    ctx.roundRect(x, y, 56, 56, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 4); ctx.lineTo(x + 50, y + 4);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 52); ctx.lineTo(x + 50, y + 52);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 5);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function tuftedTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#43104F');
  grad.addColorStop(0.5, '#3B0944');
  grad.addColorStop(1, '#32083A');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
    const cx = gx * 64 + 32, cy = gy * 64 + 32;
    const r = ctx.createRadialGradient(cx, cy, 2, cx, cy, 20);
    r.addColorStop(0, '#26042D');
    r.addColorStop(0.55, '#32083A');
    r.addColorStop(0.8, '#4A1257');
    r.addColorStop(1, '#3B0944');
    ctx.fillStyle = r;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function visualizerTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0A0C12';
  ctx.fillRect(0, 0, 512, 256);
  const bars = 24;
  for (let i = 0; i < bars; i++) {
    const h = 40 + Math.random() * 150;
    const hue = (i / bars) * 360;
    ctx.fillStyle = `hsl(${hue}, 85%, 60%)`;
    ctx.fillRect(i * (512 / bars) + 4, 256 - h, 512 / bars - 8, h);
  }
  ctx.fillStyle = '#8FB4FF';
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('KEYAKI KARAOKE', 256, 40);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function discoTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#101216';
  ctx.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = Math.random() > 0.3 ? '#DFE6EE' : '#9FB0C4';
    ctx.fillRect(Math.random() * 256, Math.random() * 128, 3 + Math.random() * 4, 3 + Math.random() * 4);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const M = {
  floor:      new THREE.MeshStandardMaterial({ color: 0x232127, roughness: 1 }),
  ceiling:    new THREE.MeshStandardMaterial({ color: 0x17191D, roughness: 0.9 }),
  wall:       new THREE.MeshStandardMaterial({ map: acousticTexture(), roughness: 0.9 }),
  sofa:       new THREE.MeshStandardMaterial({ map: tuftedTexture(), bumpMap: tuftedTexture(), bumpScale: 0.02, color: 0x3B0944, roughness: 0.4 }),
  sofaFrame:  new THREE.MeshStandardMaterial({ color: 0x2E0736, roughness: 0.5 }),
  glassTable: new THREE.MeshPhysicalMaterial({ color: 0x101216, transmission: 0.35, roughness: 0.05, metalness: 0.2, ior: 1.5, thickness: 0.03, transparent: true, opacity: 0.9 }),
  metalDark:  new THREE.MeshStandardMaterial({ color: 0x1C1E22, roughness: 0.4, metalness: 0.8 }),
  chrome:     new THREE.MeshStandardMaterial({ color: 0xC8CCD2, roughness: 0.15, metalness: 0.9 }),
  tvBezel:    new THREE.MeshStandardMaterial({ color: 0x101214, roughness: 0.4, metalness: 0.5 }),
  tvScreen:   new THREE.MeshStandardMaterial({ map: visualizerTexture(), emissive: 0xFFFFFF, emissiveMap: visualizerTexture(), emissiveIntensity: 1.6, roughness: 0.4 }),
  remoteScr:  new THREE.MeshStandardMaterial({ color: 0x0A0C10, emissive: 0x5FE8FF, emissiveIntensity: 1.4 }),
  micLed:     new THREE.MeshStandardMaterial({ color: 0x0A0C10, emissive: 0xFF3B5C, emissiveIntensity: 2.5 }),
  stripSofa:  new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xFF00FF, emissiveIntensity: 2.2 }),
  stripTable: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x00FFFF, emissiveIntensity: 2.2 }),
  door:       new THREE.MeshStandardMaterial({ color: 0x2A2430, roughness: 0.7 }),
  disco:      new THREE.MeshStandardMaterial({ map: discoTexture(), metalness: 0.9, roughness: 0.12 }),
};

/* ============================ room shell ============================ */
const ROOM = { w: 6, l: 5, h: 3 };
const NORTH = -ROOM.l / 2, SOUTH = ROOM.l / 2, WEST = -ROOM.w / 2, EAST = ROOM.w / 2;
const DOORWAY = { z: 0.55, w: 1.1, h: 2.2 }; // real opening in the east wall

function box(w, h, d, mat, x, y, z, opts = {}) {
  const { cast = true, recv = true } = opts;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = recv;
  scene.add(m);
  return m;
}

function buildShell() {
  // floor + ceiling
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.l), M.floor);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  box(ROOM.w, 0.1, ROOM.l, M.ceiling, 0, ROOM.h + 0.05, 0, { cast: false });

  // acoustic-panel walls (north, south, west, and east split around the doorway)
  box(ROOM.w, ROOM.h, 0.14, M.wall, 0, ROOM.h / 2, NORTH - 0.07);
  box(ROOM.w, ROOM.h, 0.14, M.wall, 0, ROOM.h / 2, SOUTH + 0.07);
  box(0.14, ROOM.h, ROOM.l, M.wall, WEST - 0.07, ROOM.h / 2, 0);
  box(0.14, ROOM.h, DOORWAY.z - DOORWAY.w / 2 - NORTH, M.wall, EAST + 0.07, ROOM.h / 2, (NORTH + DOORWAY.z - DOORWAY.w / 2) / 2);
  box(0.14, ROOM.h, SOUTH - (DOORWAY.z + DOORWAY.w / 2), M.wall, EAST + 0.07, ROOM.h / 2, (SOUTH + DOORWAY.z + DOORWAY.w / 2) / 2);
  box(0.14, ROOM.h - DOORWAY.h, DOORWAY.w, M.wall, EAST + 0.07, DOORWAY.h + (ROOM.h - DOORWAY.h) / 2, DOORWAY.z);

  // doorway casing + threshold (opening stays clear)
  box(0.12, DOORWAY.h, 0.08, M.metalDark, EAST, DOORWAY.h / 2, DOORWAY.z - DOORWAY.w / 2, { cast: false });
  box(0.12, DOORWAY.h, 0.08, M.metalDark, EAST, DOORWAY.h / 2, DOORWAY.z + DOORWAY.w / 2, { cast: false });
  box(0.12, 0.1, DOORWAY.w + 0.16, M.metalDark, EAST, DOORWAY.h + 0.05, DOORWAY.z, { cast: false });
  box(0.35, 0.04, DOORWAY.w + 0.2, M.metalDark, EAST + 0.03, 0.02, DOORWAY.z, { cast: false });

  // lit corridor outside the door
  const corr = new THREE.Group();
  const corrFloor = new THREE.Mesh(new THREE.PlaneGeometry(3.5, ROOM.l), M.floor);
  corrFloor.rotation.x = -Math.PI / 2;
  corrFloor.position.set(4.75, 0.004, 0);
  corr.add(corrFloor);
  box(3.5, ROOM.h, 0.14, M.wall, 4.75, ROOM.h / 2, NORTH - 0.07, { cast: false });
  box(3.5, ROOM.h, 0.14, M.wall, 4.75, ROOM.h / 2, SOUTH + 0.07, { cast: false });
  box(0.14, ROOM.h, ROOM.l + 0.2, M.wall, 6.5, ROOM.h / 2, 0, { cast: false });
  box(3.5, 0.1, ROOM.l, M.ceiling, 4.75, ROOM.h + 0.05, 0, { cast: false });
  const strip = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.04, 0.04), M.stripTable);
  strip.position.set(4.75, 2.97, 0);
  corr.add(strip);
  const corrLight = new THREE.PointLight(0x9FD8FF, 6, 6, 2);
  corrLight.position.set(4.75, 2.5, 0);
  scene.add(corrLight);
  scene.add(corr);
}

/* ============================ open door (swings into the room) ============================ */
const doorsGroup = new THREE.Group(); doorsGroup.name = 'Door'; scene.add(doorsGroup);

function buildDoor() {
  const g = new THREE.Group();
  g.position.set(EAST, 0, DOORWAY.z + DOORWAY.w / 2); // hinge on the south jamb
  const pivot = new THREE.Group();
  const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.05, DOORWAY.w - 0.18), M.door);
  leaf.position.set(0.02, 1.06, -(DOORWAY.w - 0.18) / 2);
  const stileH = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.05, 0.05), M.metalDark);
  stileH.position.set(0.03, 1.06, -0.025);
  const stileF = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.05, 0.05), M.metalDark);
  stileF.position.set(0.03, 1.06, -(DOORWAY.w - 0.18) + 0.025);
  const railT = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.05, DOORWAY.w - 0.18), M.metalDark);
  railT.position.set(0.03, 2.06, -(DOORWAY.w - 0.18) / 2);
  const railB = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.05, DOORWAY.w - 0.18), M.metalDark);
  railB.position.set(0.03, 0.025, -(DOORWAY.w - 0.18) / 2);
  // small round observation window in the door
  const windowGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.03, 16), M.tvScreen);
  windowGlass.rotation.x = Math.PI / 2;
  windowGlass.position.set(0.035, 1.35, -(DOORWAY.w - 0.18) / 2);
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.2), M.chrome);
  handle.position.set(0.06, 1.05, -0.12);
  const hingeA = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.16, 0.04), M.metalDark);
  hingeA.position.set(0.05, 1.7, 0.02);
  const hingeB = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.16, 0.04), M.metalDark);
  hingeB.position.set(0.05, 0.4, 0.02);
  pivot.add(leaf, stileH, stileF, railT, railB, windowGlass, handle, hingeA, hingeB);
  pivot.rotation.y = Math.PI * 100 / 180; // always open, into the room
  g.add(pivot);
  g.userData.label = 'Karaoke room door (open)';
  doorsGroup.add(g);
}

/* ============================ L-shaped leather sofa ============================ */
const sofaGroup = new THREE.Group(); sofaGroup.name = 'Sofa'; scene.add(sofaGroup);

function buildSofa() {
  const g = new THREE.Group();
  // main section along the south wall
  const base1 = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.3, 0.75), M.sofaFrame);
  base1.position.set(-1.4, 0.15, 2.075);
  const seat1 = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.16, 0.68), M.sofa);
  seat1.position.set(-1.4, 0.44, 2.07);
  const back1 = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.62, 0.2), M.sofa);
  back1.position.set(-1.4, 0.78, 2.42);
  const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.6, 0.75), M.sofaFrame);
  arm1.position.set(0.32, 0.36, 2.075);
  // short section along the west wall
  const base2 = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.3, 1.55), M.sofaFrame);
  base2.position.set(-2.625, 0.15, 1.675);
  const seat2 = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.16, 1.5), M.sofa);
  seat2.position.set(-2.6, 0.44, 1.675);
  const back2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.62, 1.5), M.sofa);
  back2.position.set(-2.78, 0.78, 1.675);
  const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.6, 0.24), M.sofaFrame);
  arm2.position.set(-2.625, 0.36, 0.78);
  g.add(base1, seat1, back1, arm1, base2, seat2, back2, arm2);
  g.userData.label = 'Leather sofa';
  sofaGroup.add(g);
}

/* ============================ low black glass coffee table + tech ============================ */
const tableGroup = new THREE.Group(); tableGroup.name = 'Table'; scene.add(tableGroup);
const techGroup = new THREE.Group(); techGroup.name = 'Tech'; scene.add(techGroup);

function buildTable() {
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.05, 0.65), M.glassTable);
  top.position.set(0, 0.32, 0);
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.02, 0.55), M.glassTable);
  shelf.position.set(0, 0.14, 0);
  g.add(top, shelf);
  for (const [lx, lz] of [[-0.5, -0.28], [0.5, -0.28], [-0.5, 0.28], [0.5, 0.28]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.25, 0.03), M.metalDark);
    leg.position.set(lx, 0.155, lz);
    g.add(leg);
  }
  g.position.set(-0.8, 0, 1.15);
  g.userData.label = 'Coffee table';
  tableGroup.add(g);

  // remote control terminal on the table
  const rem = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.09), M.metalDark);
  rem.position.set(-0.95, 0.375, 1.05);
  const remScr = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.025, 0.06), M.remoteScr);
  remScr.position.set(-0.95, 0.413, 1.05);
  rem.userData.label = 'Remote control terminal';
  techGroup.add(rem, remScr);

  // two wireless microphones on the table
  for (const [mx, mz] of [[-0.6, 1.15], [-0.72, 1.26]]) {
    const mic = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.028, 0.16, 12), M.metalDark);
    mic.position.set(mx, 0.4, mz);
    const grille = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.07, 12), M.chrome);
    grille.position.set(mx, 0.52, mz);
    const led = new THREE.Mesh(new THREE.TorusGeometry(0.026, 0.005, 8, 14), M.micLed);
    led.position.set(mx, 0.44, mz);
    led.rotation.x = Math.PI / 2;
    mic.userData.label = 'Wireless microphone';
    techGroup.add(mic, grille, led);
  }
}

/* ============================ TV + wall speakers ============================ */
function buildTech() {
  // 65-inch wall-mounted TV
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.87, 0.06), M.tvBezel);
  bezel.position.set(0, 1.7, NORTH + 0.06);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 0.79), M.tvScreen);
  screen.position.set(0, 1.7, NORTH + 0.095);
  bezel.userData.label = '65" TV screen';
  techGroup.add(bezel, screen);

  // dual wall speakers flanking the TV
  for (const sx of [-1, 1]) {
    const spk = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.5, 0.3), M.metalDark);
    spk.position.set(sx * 2.86, 1.5, -1.5);
    const driver = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.04, 16), M.chrome);
    driver.rotation.z = Math.PI / 2;
    driver.position.set(sx * 2.78, 1.5, -1.5);
    spk.userData.label = 'Wall speaker';
    techGroup.add(spk, driver);
  }
}

/* ============================ RGB LED strips + disco ball ============================ */
const decorGroup = new THREE.Group(); decorGroup.name = 'Decor'; scene.add(decorGroup);

function buildDecor() {
  // strip behind the sofa (south wall + west wall)
  const s1 = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.03, 0.03), M.stripSofa);
  s1.position.set(-1.4, 0.2, 2.47);
  const s2 = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 1.5), M.stripSofa);
  s2.position.set(-2.95, 0.2, 1.65);
  // strip under the coffee table
  const s3 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.02, 0.02), M.stripTable);
  s3.position.set(-0.8, 0.29, 1.47);
  s1.userData.label = 'RGB LED strip';
  decorGroup.add(s1, s2, s3);

  // disco ball
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 16), M.disco);
  ball.position.set(0, 2.62, 0);
  const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.35, 6), M.metalDark);
  wire.position.set(0, 2.8, 0);
  ball.userData.label = 'Disco ball';
  decorGroup.add(ball, wire);
}

/* ============================ build the lounge ============================ */
buildShell();
buildDoor();
buildSofa();
buildTable();
buildTech();
buildDecor();

/* ============================ picking & selection ============================ */
const pickGroups = [sofaGroup, tableGroup, techGroup, doorsGroup, decorGroup];
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const selEl = document.getElementById('sel');

let activeGroup = null, hlMats = [], hlBase = [];

function findLabel(o) {
  while (o) {
    if (o.userData && o.userData.label) return o.userData.label;
    o = o.parent;
  }
  return null;
}

function clearHighlight() {
  if (activeGroup) {
    hlMats.forEach((m, i) => {
      const b = hlBase[i];
      if (m.emissive && b.e) m.emissive.copy(b.e);
      m.emissiveIntensity = b.i;
    });
    hlMats = []; hlBase = []; activeGroup = null;
  }
}

function highlight(group) {
  clearHighlight();
  activeGroup = group;
  hlMats = [];
  hlBase = [];
  group.traverse(o => {
    if (o.isMesh && o.material) {
      hlMats.push(o.material);
      hlBase.push({ e: o.material.emissive ? o.material.emissive.clone() : null, i: o.material.emissiveIntensity });
    }
  });
}

renderer.domElement.addEventListener('pointermove', e => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickGroups, true)[0];
  renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
});

renderer.domElement.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickGroups, true);
  if (!hits.length) { clearHighlight(); selEl.textContent = '—'; return; }
  let obj = hits[0].object;
  while (obj && !pickGroups.includes(obj)) obj = obj.parent;
  if (!obj) return;
  highlight(obj);
  selEl.textContent = findLabel(hits[0].object) || obj.name || 'Object';
});

/* ============================ controls & HUD ============================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.6;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.enablePan = false;
controls.autoRotateSpeed = 0.6;

controls.addEventListener('start', () => { renderer.domElement.style.cursor = 'grabbing'; });
controls.addEventListener('end',   () => { renderer.domElement.style.cursor = 'grab'; });

const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnOrbit.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btnReset').addEventListener('click', () => {
  controls.autoRotate = false;
  btnOrbit.classList.remove('on');
  camera.position.copy(HOME_POS);
  controls.target.copy(HOME_TGT);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// scene stats
let tris = 0, meshes = 0;
scene.traverse(o => {
  if (o.isMesh) {
    meshes++;
    const g = o.geometry;
    if (g.index) tris += g.index.count / 3;
    else if (g.attributes.position) tris += g.attributes.position.count / 3;
  }
});
document.getElementById('stats').textContent = `${meshes} meshes · ${Math.round(tris).toLocaleString()} tris`;

/* ============================ render loop (dynamic RGB + disco ball) ============================ */
const clock = new THREE.Clock();
let intro = true;
const introT0 = performance.now();
const INTRO_FROM = new THREE.Vector3(4.2, 2.6, 2.6);
const INTRO_TGT0 = new THREE.Vector3(0, 1, 0);

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  if (intro) {
    const p = Math.min((performance.now() - introT0) / 1500, 1);
    const e = 1 - Math.pow(1 - p, 3);
    camera.position.lerpVectors(INTRO_FROM, HOME_POS, e);
    controls.target.lerpVectors(INTRO_TGT0, HOME_TGT, e);
    if (p >= 1) intro = false;
  }

  // dynamic RGB LED strips — cycle hues, tint the room with matching lights
  const h1 = (t * 0.12) % 1;
  const c1 = new THREE.Color().setHSL(h1, 0.85, 0.55);
  const c2 = new THREE.Color().setHSL((h1 + 0.5) % 1, 0.85, 0.55);
  M.stripSofa.emissive.copy(c1);
  M.stripTable.emissive.copy(c2);
  lightSofa.color.copy(c1);
  lightTable.color.copy(c2);

  // slow-spinning disco ball
  decorGroup.children.forEach(o => { if (o.isMesh && o.userData.label === 'Disco ball') o.rotation.y += dt * 0.4; });

  if (activeGroup) {
    const p = 0.35 + 0.25 * (0.5 + 0.5 * Math.sin(t * 3.5));
    hlMats.forEach(m => {
      if (m.emissive) m.emissive.setHex(0xFFB84D);
      m.emissiveIntensity = p;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
