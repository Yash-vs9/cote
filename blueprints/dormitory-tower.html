<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dormitory Tower · 15-Story Residence</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a20; font-family: 'Segoe UI', system-ui, sans-serif; }
  #c { position: fixed; inset: 0; }
  #ui { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
  #ui button {
    background: rgba(30, 28, 26, 0.75); color: #ffe9d0; border: 1px solid rgba(255, 190, 120, 0.4);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.2s;
  }
  #ui button:hover { background: rgba(140, 90, 40, 0.65); }
  #stats {
    position: fixed; bottom: 14px; left: 14px; z-index: 10; color: #ffd9a8; font-size: 12px;
    background: rgba(30, 28, 26, 0.65); padding: 6px 12px; border-radius: 12px; backdrop-filter: blur(4px);
  }
  #label {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(24, 20, 16, 0.9); color: #fff0dc; padding: 8px 18px; border-radius: 18px;
    font-size: 14px; border: 1px solid rgba(255, 190, 120, 0.5); opacity: 0; transition: opacity 0.25s;
    pointer-events: none; max-width: 80vw; text-align: center;
  }
  #hint { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 9; color: rgba(255, 220, 180, 0.55); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btnOrbit">Auto-orbit</button>
  <button id="btnReset">Reset view</button>
</div>
<div id="stats">…</div>
<div id="label"></div>
<div id="hint">Drag to orbit · scroll to zoom · click anything to inspect it</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3c9a0);
scene.fog = new THREE.Fog(0xf0cba0, 90, 320);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1200);
const ctl = new OrbitControls(camera, canvas);
ctl.target.set(0, 18, 0);
ctl.enableDamping = true;
ctl.dampingFactor = 0.08;
ctl.minDistance = 5;
ctl.maxDistance = 220;

// ---------- helpers ----------
const H = (w, h, d, mat, x, y, z, ry = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.y = ry;
  return m;
};
const std = (o, extra = {}) => Object.assign(new THREE.MeshStandardMaterial(o), extra);
const pickable = [];
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- textures ----------
function concreteTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#e0e0e0'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(${rand(0, 255) | 0},${rand(0, 255) | 0},${rand(0, 255) | 0},${rand(0.015, 0.05)})`;
    g.fillRect(rand(0, 512), rand(0, 512), rand(1, 3), rand(1, 3));
  }
  // panel seams
  g.strokeStyle = 'rgba(110, 110, 110, 0.5)'; g.lineWidth = 4;
  for (let i = 0; i <= 6; i++) {
    g.beginPath(); g.moveTo(i * 512 / 6, 0); g.lineTo(i * 512 / 6, 512); g.stroke();
  }
  g.lineWidth = 6;
  for (let i = 0; i <= 6; i++) {
    g.beginPath(); g.moveTo(0, i * 512 / 6); g.lineTo(512, i * 512 / 6); g.stroke();
  }
  g.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) {
    if ((i + j) % 2) g.fillRect(i * 512 / 6 + 3, j * 512 / 6 + 3, 512 / 6 - 6, 512 / 6 - 6);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function paverTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#a9a49c'; g.fillRect(0, 0, 512, 512);
  const n = 8, s = 512 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const l = 1 + rand(-0.06, 0.06);
    g.fillStyle = `rgb(${Math.round(169 * l)}, ${Math.round(164 * l)}, ${Math.round(156 * l)})`;
    g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
  }
  g.strokeStyle = 'rgba(60,60,60,0.4)'; g.lineWidth = 3;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i * s); g.lineTo(512, i * s); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const matConcrete = std({ map: concreteTexture(), roughness: 0.5, metalness: 0.02 });
matConcrete.map.repeat.set(3, 3);
const matDarkConcrete = std({ color: 0xb8b8b8, roughness: 0.55, metalness: 0.02 });
const matBalcGlass = new THREE.MeshPhysicalMaterial({
  color: 0x8fa3ad, roughness: 0.2, metalness: 0.2,
  transparent: true, opacity: 0.7,
});
const matDarkGlass = new THREE.MeshPhysicalMaterial({
  color: 0x2c3b44, roughness: 0.25, metalness: 0.2,
  transparent: true, opacity: 0.85,
});
const matFrame = std({ color: 0x6a7074, roughness: 0.4, metalness: 0.6 });
const matSteel = std({ color: 0x2c3034, roughness: 0.4, metalness: 0.8 });
const matWarmGlow = new THREE.MeshBasicMaterial({ color: 0xffe0a8, transparent: true, opacity: 0.85 });

// ---------- tower core ----------
const tower = new THREE.Group();
const FACE_ROT = [0, Math.PI / 2, -Math.PI / 2, Math.PI];
const faceData = [
  { rot: 0, fx: 0, fz: 12.5 },
  { rot: Math.PI / 2, fx: 12.5, fz: 0 },
  { rot: -Math.PI / 2, fx: -12.5, fz: 0 },
  { rot: Math.PI, fx: 0, fz: -12.5 },
];
const COLS = [-5.5, 0, 5.5];
const FLOORS = 15;
const FH = 3.2;

// facade planes
const facadeGroup = new THREE.Group();
for (const f of faceData) {
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(25, FLOORS * FH), matConcrete);
  pane.position.set(f.fx, (FLOORS * FH) / 2, f.fz);
  pane.rotation.y = f.rot;
  pane.receiveShadow = true;
  facadeGroup.add(pane);
}
// corner pilasters
const pilaster = std({ color: 0xd4d4d4, roughness: 0.5 });
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  tower.add(H(0.7, FLOORS * FH, 0.7, pilaster, sx * 12.5, (FLOORS * FH) / 2, sz * 12.5));
}
tower.add(facadeGroup);
pickable.push({ obj: facadeGroup, name: 'Tower facade — 15 stories of precast concrete panels' });

// ---------- instanced balcony modules ----------
const balconyGroup = new THREE.Group();
const slabGeo = new THREE.BoxGeometry(4.6, 0.14, 1.5);
const railGeo = new THREE.BoxGeometry(4.5, 1.15, 0.05);
const srailGeo = new THREE.BoxGeometry(0.05, 1.15, 1.45);
const doorGeo = new THREE.BoxGeometry(4.4, 2.25, 0.06);
const matSlab = std({ color: 0xd8d8d8, roughness: 0.55, metalness: 0.02 });
const N_BALC = 14 * 3 * 4;   // 14 upper floors × 3 columns × 4 faces
const instSlabs = new THREE.InstancedMesh(slabGeo, matSlab, N_BALC);
const instRail = new THREE.InstancedMesh(railGeo, matBalcGlass, N_BALC);
const instSRail = new THREE.InstancedMesh(srailGeo, matBalcGlass, N_BALC * 2);
const instDoor = new THREE.InstancedMesh(doorGeo, matDarkGlass, N_BALC);
[instSlabs, instRail, instSRail, instDoor].forEach(m => { m.userData.noHighlight = true; m.castShadow = true; });

const M = new THREE.Matrix4();
const Q = new THREE.Quaternion();
const P = new THREE.Vector3();
const V = new THREE.Vector3();
let bi = 0;
for (let fi = 0; fi < 4; fi++) {
  const f = faceData[fi];
  Q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), FACE_ROT[fi]);
  for (let i = 1; i < FLOORS; i++) {           // floor 0 = lobby
    const y = i * FH;
    for (const cx of COLS) {
      P.copy(new THREE.Vector3(cx, 0, 0).applyQuaternion(Q).add(new THREE.Vector3(f.fx, y, f.fz)));
      const off = (o) => V.copy(o).applyQuaternion(Q).add(P);
      instSlabs.setMatrixAt(bi, M.compose(off(new THREE.Vector3(0, 0.07, 0.75)), Q, new THREE.Vector3(1, 1, 1)));
      instRail.setMatrixAt(bi, M.compose(off(new THREE.Vector3(0, 0.645, 1.5)), Q, new THREE.Vector3(1, 1, 1)));
      instSRail.setMatrixAt(bi, M.compose(off(new THREE.Vector3(2.28, 0.645, 0.75)), Q, new THREE.Vector3(1, 1, 1)));
      instSRail.setMatrixAt(bi + N_BALC, M.compose(off(new THREE.Vector3(-2.28, 0.645, 0.75)), Q, new THREE.Vector3(1, 1, 1)));
      instDoor.setMatrixAt(bi, M.compose(off(new THREE.Vector3(0, 1.13, 0.12)), Q, new THREE.Vector3(1, 1, 1)));
      bi++;
    }
  }
}
balconyGroup.add(instSlabs, instRail, instSRail, instDoor);
tower.add(balconyGroup);
pickable.push({ obj: balconyGroup, name: 'Balcony modules — 168 instanced, smoked glass railings' });

// lit room windows (a few warm-lit rooms at dusk)
const litWin = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.6, 1.3),
  new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false }), 26);
let wi = 0;
const used = new Set();
while (wi < 26) {
  const fi = Math.floor(rand(0, 4));
  const i = Math.floor(rand(1, FLOORS));
  const cIdx = Math.floor(rand(0, 3));
  const key = fi * 100 + i * 10 + cIdx;
  if (used.has(key)) continue;
  used.add(key);
  const f = faceData[fi];
  Q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), FACE_ROT[fi]);
  P.copy(new THREE.Vector3(COLS[cIdx], 0, 0).applyQuaternion(Q).add(new THREE.Vector3(f.fx, i * FH, f.fz)));
  const o = new THREE.Vector3(0, 1.3, 0.16).applyQuaternion(Q).add(P);
  M.compose(o, Q, new THREE.Vector3(1, 1, 1));
  litWin.setMatrixAt(wi++, M);
}
tower.add(litWin);

// ---------- roof ----------
tower.add(H(25.2, 0.5, 25.2, matConcrete, 0, FLOORS * FH + 0.25, 0));
tower.add(H(25.7, 1.1, 25.7, matDarkConcrete, 0, FLOORS * FH + 1.05, 0));
tower.add(H(6, 3, 6, matConcrete, 4, FLOORS * FH + 3.2, -4));
tower.add(H(4.5, 3.5, 4.5, matConcrete, 0, FLOORS * FH + 3.4, 13));
pickable.push({ obj: tower, name: 'Roof level — parapet, machine rooms' });

// ---------- central glass elevator spine ----------
const spine = new THREE.Group();
const matSpineGlass = new THREE.MeshPhysicalMaterial({
  color: 0xa9c4d4, roughness: 0.08, metalness: 0.15,
  transparent: true, opacity: 0.55, transmission: 0.35, thickness: 0.08,
});
const spineFront = new THREE.Mesh(new THREE.PlaneGeometry(5.6, FLOORS * FH), matSpineGlass);
spineFront.position.set(0, (FLOORS * FH) / 2, 12.72);
spineFront.rotation.y = Math.PI;
spine.add(spineFront);
for (const sx of [-2.8, 2.8]) {
  const side = new THREE.Mesh(new THREE.PlaneGeometry(0.3, FLOORS * FH), matSpineGlass);
  side.position.set(sx, (FLOORS * FH) / 2, 12.6);
  side.rotation.y = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
  spine.add(side);
}
for (let i = 0; i < FLOORS; i++) {
  spine.add(H(5.7, 0.12, 0.12, matFrame, 0, i * FH + 0.05, 12.72));
}
spine.add(H(0.12, FLOORS * FH, 0.12, matFrame, 0, (FLOORS * FH) / 2, 12.72));
// elevator cabs (animated)
const cabGeo = new THREE.BoxGeometry(2.3, 2.4, 1.9);
const cabMat = std({ color: 0x3a4650, roughness: 0.4, metalness: 0.5 });
const cabLightMat = new THREE.MeshBasicMaterial({ color: 0xffecc0 });
const cabA = new THREE.Mesh(cabGeo, cabMat);
const cabAl = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.4), cabLightMat);
cabAl.position.set(0, 0.7, 0.96);
cabA.add(cabAl);
cabA.position.set(-1.35, 2, 12.55);
const cabB = new THREE.Mesh(cabGeo, cabMat);
const cabBl = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.4), cabLightMat);
cabBl.position.set(0, 0.7, 0.96);
cabB.add(cabBl);
cabB.position.set(1.35, 30, 12.55);
spine.add(cabA, cabB);
tower.add(spine);
pickable.push({ obj: spine, name: 'Central glass elevator shaft — dual cabs' });

// ---------- lobby entrance ----------
const lobby = new THREE.Group();
const matLobbyFloor = std({ color: 0xb0aca2, roughness: 0.35, metalness: 0.1 });
const matDesk = std({ color: 0x8a8f94, roughness: 0.4, metalness: 0.3 });
// lobby interior (visible through the glass)
lobby.add(H(14, 0.15, 6.5, matLobbyFloor, 0, 0.075, 9.5));
lobby.add(H(14, 2.8, 0.2, matDarkConcrete, 0, 1.4, 6.2));
const desk = H(3.6, 1.05, 1.1, matDesk, -3.2, 0.525, 10.4);
lobby.add(desk);
const monitor = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55), new THREE.MeshBasicMaterial({ color: 0x7fd4ff }));
monitor.position.set(-3.2, 1.35, 10.05);
lobby.add(monitor);
const lamp = H(8, 0.1, 0.5, new THREE.MeshBasicMaterial({ color: 0xfff0cc }), 0, 2.75, 9.5);
lobby.add(lamp);
const sofa = H(2.4, 0.45, 0.9, std({ color: 0x5a5f66, roughness: 0.6 }), 3, 0.225, 10.6);
lobby.add(sofa);
// turnstile gates
const turnstiles = new THREE.Group();
for (const tx of [-2.4, 0, 2.4]) {
  const gate = new THREE.Group();
  gate.position.set(tx, 0, 9.4);
  const p1 = H(0.14, 1.0, 0.4, matSteel, -0.62, 0.5, 0);
  const p2 = H(0.14, 1.0, 0.4, matSteel, 0.62, 0.5, 0);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.85), matBalcGlass);
  glass.position.set(0, 0.85, 0.15);
  gate.add(p1, p2, glass);
  for (let a = 0; a < 3; a++) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.05), matSteel);
    arm.position.set(Math.cos(a * Math.PI * 2 / 3) * 0.3, 0.95, Math.sin(a * Math.PI * 2 / 3) * 0.3);
    gate.add(arm);
  }
  const reader = H(0.12, 0.5, 0.1, std({ color: 0x22262a, roughness: 0.4 }), 0.85, 0.5, 0.1);
  const readerLight = new THREE.Mesh(new THREE.CircleGeometry(0.04, 8), new THREE.MeshBasicMaterial({ color: 0x39ffa0 }));
  readerLight.position.set(0.85, 0.72, 0.16);
  gate.add(reader, readerLight);
  turnstiles.add(gate);
}
lobby.add(turnstiles);
pickable.push({ obj: turnstiles, name: 'Keycard turnstile gates' });
// warm interior light
const lobbyLight = new THREE.PointLight(0xffe2ac, 14, 20, 2);
lobbyLight.position.set(0, 2.6, 9.5);
lobby.add(lobbyLight);

// entrance glass + open doors
const entGlass = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.2), matDarkGlass);
entGlass.position.set(0, 1.6, 12.48);
entGlass.rotation.y = Math.PI;
lobby.add(entGlass);
for (const sgn of [-1, 1]) {
  const hinge = new THREE.Group();
  hinge.position.set(sgn * 2.2, 0, 12.5);
  const leaf = new THREE.Group();
  leaf.add(H(0.06, 2.5, 1.1, matDarkGlass, -sgn * 0.55, 1.25, 0));
  leaf.add(H(1.0, 0.08, 0.08, matFrame, -sgn * 0.5, 1.1, 0.02));
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 8), matFrame);
  handle.rotation.z = Math.PI / 2;
  handle.position.set(-sgn * 0.2, 1.25, 0.06);
  leaf.add(handle);
  hinge.add(leaf);
  hinge.rotation.y = -sgn * Math.PI / 2;
  lobby.add(hinge);
}
pickable.push({ obj: lobby, name: 'Lobby entrance — glass doors open & passable' });

// canopy overhang
const canopy = new THREE.Group();
const canopySlab = H(10, 0.5, 5.5, matConcrete, 0, 4.3, 13.6);
canopySlab.castShadow = true;
canopy.add(canopySlab);
const soffit = new THREE.Mesh(new THREE.PlaneGeometry(9.4, 4.9), new THREE.MeshBasicMaterial({ color: 0xffe8b8, transparent: true, opacity: 0.8 }));
soffit.rotation.x = Math.PI / 2;
soffit.position.set(0, 4.02, 13.6);
canopy.add(soffit);
for (const sx of [-4.5, 4.5]) {
  canopy.add(H(0.35, 4.3, 0.35, matConcrete, sx, 2.15, 11.6));
}
// sign on canopy front
function makeSignTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 220;
  const g = c.getContext('2d');
  g.fillStyle = '#2a3a48'; g.fillRect(0, 0, 1024, 220);
  g.strokeStyle = '#ffc879'; g.lineWidth = 10; g.strokeRect(12, 12, 1000, 196);
  g.fillStyle = '#ffe9c8'; g.font = 'bold 92px "Segoe UI", sans-serif'; g.textAlign = 'center';
  g.fillText('KEYAKI DORMITORY TOWER', 512, 145);
  g.font = '44px "Segoe UI", sans-serif'; g.fillStyle = '#ffc879';
  g.fillText('STUDENT RESIDENCE · 15F', 512, 196);
  return new THREE.CanvasTexture(c);
}
const sign = new THREE.Mesh(new THREE.PlaneGeometry(10.4, 2.2), new THREE.MeshBasicMaterial({ map: makeSignTexture() }));
sign.position.set(0, 4.3, 16.4);
canopy.add(sign);
scene.add(canopy);
pickable.push({ obj: canopy, name: 'Entrance canopy with sign' });

scene.add(lobby);

// ---------- ground / plaza ----------
const matPaver = std({ map: paverTexture(), roughness: 0.45, metalness: 0.05 });
matPaver.map.repeat.set(12, 12);
const plaza = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), matPaver);
plaza.rotation.x = -Math.PI / 2;
plaza.receiveShadow = true;
scene.add(plaza);
pickable.push({ obj: plaza, name: 'Entrance plaza — granite pavers' });

// path from lobby
const path = new THREE.Mesh(new THREE.PlaneGeometry(4, 18), std({ color: 0x8f8b83, roughness: 0.8 }));
path.rotation.x = -Math.PI / 2;
path.position.set(0, 0.02, 24);
scene.add(path);

// road + sidewalk at south edge
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 200), std({ color: 0x3a3d42, roughness: 0.95 }));
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.03, 60);
scene.add(road);
const laneTex = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f0d070'; g.fillRect(224, 0, 64, 128);
  return new THREE.CanvasTexture(c);
})();
laneTex.wrapS = laneTex.wrapT = THREE.RepeatWrapping;
laneTex.repeat.set(6, 1);
const dashes = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 200),
  new THREE.MeshBasicMaterial({ map: laneTex, transparent: true }));
dashes.rotation.x = -Math.PI / 2;
dashes.position.set(0, 0.06, 60);
scene.add(dashes);

// grass + trees + bushes
const grassMat = std({ color: 0x9cb85e, roughness: 0.95 });
for (const [gx, gz] of [[-50, -30], [50, -30], [-50, 30], [50, 30]]) {
  const grass = H(70, 0.1, 70, grassMat, gx, -0.05, gz);
  grass.receiveShadow = true;
  scene.add(grass);
}
function makeTree(x, z, s) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.32 * s, 3 * s, 7), std({ color: 0x5d4328, roughness: 0.9 }));
  trunk.position.y = 1.5 * s;
  t.add(trunk);
  for (let i = 0; i < 5; i++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry((0.95 + Math.random() * 0.5) * s, 0),
      std({ color: i % 2 ? 0x4f9e46 : 0x61ad4f, roughness: 0.9, flatShading: true }));
    blob.position.set((Math.random() - 0.5) * 1.6 * s, (2.9 + Math.random() * 1.0) * s, (Math.random() - 0.5) * 1.6 * s);
    t.add(blob);
  }
  t.position.set(x, 0, z);
  return t;
}
[[-16, 18], [16, 18], [-20, 4], [20, 4], [-26, -10], [26, -10], [-14, -18], [14, -18], [-8, 26], [8, 26]].forEach(([x, z]) => {
  const tr = makeTree(x, z, 1 + Math.random() * 0.7);
  tr.children.forEach(mm => { mm.castShadow = true; mm.receiveShadow = true; });
  scene.add(tr);
});
function makeBush(x, z, s) {
  const b = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry((0.5 + Math.random() * 0.3) * s, 0),
      std({ color: i % 2 ? 0x3f8a3c : 0x55a04a, roughness: 0.9, flatShading: true }));
    blob.position.set((Math.random() - 0.5) * 1.1 * s, (0.4 + Math.random() * 0.3) * s, (Math.random() - 0.5) * 1.1 * s);
    b.add(blob);
  }
  b.position.set(x, 0, z);
  return b;
}
[[-11.5, 16.5], [11.5, 16.5], [-11.5, -16.5], [11.5, -16.5], [-16, 13], [16, 13]].forEach(([x, z]) => scene.add(makeBush(x, z, 1.1)));

}

// ---------- distant buildings ----------
function makeBuilding(x, z, w, h, d, tint) {
  const b = new THREE.Group();

  win.position.set(0, h / 2, d / 2 + 0.02);
  b.add(win);
  b.position.set(x, 0, z);
  return b;
}

// ---------- picking / labels ----------
const labelEl = document.getElementById('label');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hovered = new Set();
function highlight(mesh, on) {
  if (mesh.userData.noHighlight) return;
  if (mesh.material && mesh.material.emissive) {
    if (on) {
      if (!mesh.userData._baseEm) mesh.userData._baseEm = mesh.material.emissive.clone();
      mesh.material.emissive.copy(mesh.userData._baseEm).addScalar(on ? 0.3 : 0);
      mesh.material.emissiveIntensity = on ? 0.5 : 0;
    } else {
      if (mesh.userData._baseEm) mesh.material.emissive.copy(mesh.userData._baseEm);
      mesh.material.emissiveIntensity = 0;
    }
  }
}
function applyHover(group, on) {
  group.traverse(o => { if (o.isMesh) highlight(o, on); });
}
function setLabel(text, show) {
  labelEl.textContent = text;
  labelEl.style.opacity = show ? 1 : 0;
}
canvas.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    canvas.style.cursor = 'pointer';
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry && !hovered.has(entry.obj)) {
      hovered.forEach(o => applyHover(o, false));
      hovered.clear();
      hovered.add(entry.obj);
      applyHover(entry.obj, true);
      setLabel(entry.name, true);
    }
  } else {
    if (hovered.size) { hovered.forEach(o => applyHover(o, false)); hovered.clear(); }
    canvas.style.cursor = 'grab';
    setLabel('', false);
  }
});
canvas.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry) setLabel(entry.name, true);
  }
});

// ---------- buttons ----------
let autoOrbit = false;
document.getElementById('btnOrbit').addEventListener('click', () => {
  autoOrbit = !autoOrbit;
  document.getElementById('btnOrbit').textContent = autoOrbit ? 'Orbit: ON' : 'Auto-orbit';
});
document.getElementById('btnReset').addEventListener('click', () => {
  intro = { active: true, t: 0 };
  intro.from = camera.position.clone();
  intro.to = new THREE.Vector3(34, 14, 40);
  intro.fromT = ctl.target.clone();
  intro.toT = new THREE.Vector3(0, 18, 0);
  ctl.enabled = false;
});

// ---------- intro fly-in ----------
let intro = { active: true, t: 0 };
intro.from = new THREE.Vector3(90, 55, 110);
intro.to = new THREE.Vector3(34, 14, 40);
intro.fromT = new THREE.Vector3(0, 30, 0);
intro.toT = new THREE.Vector3(0, 18, 0);
camera.position.copy(intro.from);
ctl.target.copy(intro.fromT);
ctl.enabled = false;

// ---------- animate ----------
const clock3 = new THREE.Clock();
const statsEl = document.getElementById('stats');
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);
  const t = clock3.elapsedTime;
  // elevator cabs travel the spine
  const ph = (t * 0.045) % 1;
  cabA.position.y = 1.5 + ph * 45;
  cabB.position.y = 1.5 + ((ph + 0.5) % 1) * 45;
  if (intro.active) {
    intro.t += dt / 2.2;
    const k = Math.min(intro.t, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(intro.from, intro.to, e);
    ctl.target.lerpVectors(intro.fromT, intro.toT, e);
    if (k >= 1) { intro.active = false; ctl.enabled = true; }
  }
  ctl.autoRotate = autoOrbit && !intro.active;
  ctl.update();
  renderer.render(scene, camera);
  statsEl.textContent = `${renderer.info.render.triangles.toLocaleString()} tris · ${renderer.info.render.calls} draw calls`;
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
