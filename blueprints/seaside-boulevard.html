<!DOCTYPE html>

<style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2b488);
scene.fog = new THREE.Fog(0xf0b488, 80, 420);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1200);
const ctl = new OrbitControls(camera, canvas);
ctl.target.set(0, 1.5, 8);
ctl.enableDamping = true;
ctl.dampingFactor = 0.08;
ctl.maxPolarAngle = Math.PI * 0.495;
ctl.minDistance = 2;
ctl.maxDistance = 200;

// ---------- helpers ----------
const H = (w, h, d, mat, x, y, z, ry = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.y = ry;
  return m;
};
const std = (o, extra = {}) => Object.assign(new THREE.MeshStandardMaterial(o), extra);
const pickable = [];
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- textures ----------
function brickTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  const bw = 64, bh = 26;
  for (let row = 0; row < 128 / bh; row++) {
    for (let col = -1; col < 256 / bw + 1; col++) {
      const l = 1 + rand(-0.12, 0.12);
      const r = Math.round(150 * l), gg = Math.round(74 * l), b = Math.round(22 * l);
      g.fillStyle = `rgb(${r},${gg},${b})`;
      const off = row % 2 === 1 ? bw / 2 : 0;
      g.fillRect(col * bw + off, row * bh, bw - 2, bh - 2);
      g.fillStyle = 'rgba(255,255,255,0.06)';
      g.fillRect(col * bw + off + 2, row * bh + 2, bw - 6, bh - 6);
    }
  }
  g.strokeStyle = '#5c3a14'; g.lineWidth = 2;
  for (let row = 0; row <= 128 / bh; row++) {
    g.beginPath(); g.moveTo(0, row * bh); g.lineTo(256, row * bh); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function grassTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#7a9448'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++) {
    const l = rand(0.75, 1.25);
    g.fillStyle = `rgba(${Math.round(105 * l)}, ${Math.round(140 * l)}, ${Math.round(62 * l)}, 0.5)`;
    g.fillRect(rand(0, 256), rand(0, 256), 1, rand(2, 4));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function rockTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#5c5854'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1600; i++) {
    const v = rand(50, 130) | 0;
    g.fillStyle = `rgba(${v},${v},${v - 8},0.4)`;
    g.fillRect(rand(0, 256), rand(0, 256), rand(2, 5), rand(2, 5));
  }
  for (let i = 0; i < 30; i++) {
    g.strokeStyle = `rgba(30,30,30,${rand(0.1, 0.3)})`;
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(rand(0, 256), rand(0, 256)); g.lineTo(rand(0, 256), rand(0, 256)); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const matBrick = std({ map: brickTexture(), roughness: 0.6, metalness: 0.0 });
const matGrass = std({ map: grassTexture(), roughness: 0.95 });
const matRock = std({ map: rockTexture(), roughness: 0.9, metalness: 0.02 });
const matIron = std({ color: 0x111111, roughness: 0.3, metalness: 0.85 });
const matWood = std({ color: 0x4a3a28, roughness: 0.8 });

// ---------- brick boulevard ----------
const path = new THREE.Mesh(new THREE.PlaneGeometry(220, 4), matBrick);
path.rotation.x = -Math.PI / 2;
path.position.set(0, 0.02, -2);
path.receiveShadow = true;
scene.add(path);
matBrick.map.repeat.set(110, 3);
pickable.push({ obj: path, name: 'Red-brick seaside boulevard' });

// grass embankment behind the path
const grass = new THREE.Mesh(new THREE.PlaneGeometry(220, 34), matGrass);
grass.rotation.x = -Math.PI / 2;
grass.position.set(0, -0.02, -21);
grass.receiveShadow = true;
scene.add(grass);
matGrass.map.repeat.set(30, 8);
const curb = H(220, 0.16, 0.25, std({ color: 0x8a867e, roughness: 0.7 }), 0, 0.08, -4.1);
scene.add(curb);

// ---------- ocean drop-off cliff ----------
const cliff = new THREE.Group();
cliff.add(H(220, 1.1, 1.7, matRock, 0, -0.55, 0.85));
cliff.add(H(220, 2.2, 3.4, matRock, 0, -1.65, 2.7));
cliff.add(H(220, 1.4, 3.0, matRock, 0, -2.6, 4.6));
scene.add(cliff);
pickable.push({ obj: cliff, name: 'Ocean drop-off cliff' });

// ---------- animated ocean shader ----------
const oceanUniforms = {
  uTime: { value: 0 },
  uDeep: { value: new THREE.Color(0x004466) },
  uShallow: { value: new THREE.Color(0x1a6a8a) },
  uSunDir: { value: new THREE.Vector3(0.3, 0.14, 0.94).normalize() },
  uSunCol: { value: new THREE.Color(1.0, 0.62, 0.3) },
};
const oceanMat = new THREE.ShaderMaterial({
  uniforms: oceanUniforms,
  side: THREE.DoubleSide,
  vertexShader: `
    uniform float uTime;
    varying vec3 vWorldPos;
    void main() {
      vec3 p = position;
      float w = sin(p.x * 0.08 + uTime * 0.8) * 0.28
              + cos(p.z * 0.06 + uTime * 0.6) * 0.22
              + sin((p.x + p.z) * 0.15 + uTime * 1.1) * 0.12;
      p.y += w;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uSunDir;
    uniform vec3 uSunCol;
    varying vec3 vWorldPos;
    void main() {
      vec3 dx = dFdx(vWorldPos);
      vec3 dy = dFdy(vWorldPos);
      vec3 n = normalize(cross(dx, dy));
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - max(dot(n, V), 0.0), 2.6);
      vec3 col = mix(uDeep, uShallow, fres * 0.75);
      vec3 Hv = normalize(uSunDir + V);
      float streak = pow(max(dot(n, Hv), 0.0), 700.0) * 1.4;
      float glow = pow(max(dot(n, Hv), 0.0), 70.0) * 0.3;
      col += uSunCol * streak;
      col += uSunCol * glow;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const ocean = new THREE.Mesh(new THREE.PlaneGeometry(3000, 2200), oceanMat);
ocean.rotation.x = -Math.PI / 2;
ocean.position.set(0, -3.3, 1100);
scene.add(ocean);
pickable.push({ obj: ocean, name: 'Open sea — animated vertex ocean' });

// ---------- wrought-iron fence (instanced, modular) ----------
const fence = new THREE.Group();
// rails
fence.add(H(220, 0.09, 0.09, matIron, 0, 1.18, 0));
fence.add(H(220, 0.09, 0.09, matIron, 0, 0.72, 0));
// pickets every 0.5 m
const N_PICK = 440;
const instPickets = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06, 1.15, 0.07), matIron, N_PICK);
const pm = new THREE.Matrix4();
for (let i = 0; i < N_PICK; i++) {
  pm.makeTranslation(-110 + i * 0.5, 0.6, 0);
  instPickets.setMatrixAt(i, pm);
}
instPickets.castShadow = true;
fence.add(instPickets);
// main posts every 8 m with finials
const N_POST = 28;
const instPosts = new THREE.InstancedMesh(new THREE.BoxGeometry(0.16, 1.5, 0.16), matIron, N_POST);
const instFinials = new THREE.InstancedMesh(new THREE.SphereGeometry(0.09, 8, 6), matIron, N_POST);
for (let i = 0; i < N_POST; i++) {
  pm.makeTranslation(-112 + i * 8, 0.75, 0);
  instPosts.setMatrixAt(i, pm);
  pm.makeTranslation(-112 + i * 8, 1.62, 0);
  instFinials.setMatrixAt(i, pm);
}
instPosts.castShadow = true;
fence.add(instPosts, instFinials);
scene.add(fence);
pickable.push({ obj: fence, name: 'Black wrought-iron coastal fence' });

// ---------- cast-iron street lamps (every 8 m) ----------
const lamps = new THREE.Group();
const lanternGlowTex = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, 'rgba(255, 180, 90, 0.95)');
  gr.addColorStop(0.5, 'rgba(255, 140, 60, 0.45)');
  gr.addColorStop(1, 'rgba(255, 120, 50, 0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
for (let i = 0; i < 28; i++) {
  const x = -112 + i * 8;
  const lamp = new THREE.Group();
  lamp.position.set(x, 0, 0.12);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 3.5, 8), matIron);
  post.position.y = 1.75;
  post.castShadow = true;
  lamp.add(post);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.16, 8), matIron);
  base.position.y = 0.08;
  lamp.add(base);
  // curved bracket arm
  const arm = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.035, 6, 10, Math.PI), matIron);
  arm.rotation.z = Math.PI;
  arm.position.set(0.26, 3.32, 0);
  lamp.add(arm);
  // lantern
  const housing = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.34, 0.26), matIron);
  housing.position.set(0.54, 3.32, 0);
  lamp.add(housing);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.26, 0.2),
    new THREE.MeshStandardMaterial({ color: 0xffb050, emissive: 0xff8a30, emissiveIntensity: 2.6, roughness: 0.3 }));
  glass.position.set(0.54, 3.32, 0);
  lamp.add(glass);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4),
    new THREE.MeshBasicMaterial({ map: lanternGlowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.position.set(0.54, 3.32, 0);
  lamp.add(glow);
  lamps.add(lamp);
}
scene.add(lamps);
pickable.push({ obj: lamps, name: 'Cast-iron street lamps — every 8 m' });

// ---------- benches on the land side ----------
function makeBench(x) {
  const b = new THREE.Group();
  b.position.set(x, 0, -2.7);
  b.add(H(1.8, 0.07, 0.5, matWood, 0, 0.47, 0));
  b.add(H(1.8, 0.5, 0.06, matWood, 0, 0.75, -0.25));
  b.add(H(0.07, 0.45, 0.07, matIron, -0.8, 0.225, -0.15));
  b.add(H(0.07, 0.45, 0.07, matIron, 0.8, 0.225, -0.15));
  b.add(H(0.07, 0.45, 0.07, matIron, -0.8, 0.225, 0.15));
  b.add(H(0.07, 0.45, 0.07, matIron, 0.8, 0.225, 0.15));
  return b;
}
const benches = new THREE.Group();
for (const bx of [-60, 0, 60]) benches.add(makeBench(bx));
scene.add(benches);
pickable.push({ obj: benches, name: 'Seaside benches' });

// rocks along the fence base
const rocks = new THREE.Group();
for (let i = 0; i < 14; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25 + rand(0, 0.35), 0), matRock);
  r.position.set(-100 + i * 15 + rand(-4, 4), 0.2, rand(0.2, 0.7));
  r.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
  r.castShadow = true;
  rocks.add(r);
}
scene.add(rocks);

// ---------- trees on the land side ----------
function makeTree(x, z, s) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * s, 0.26 * s, 2.8 * s, 6), std({ color: 0x3f2f1e, roughness: 0.9 }));
  trunk.position.y = 1.4 * s;
  t.add(trunk);
  for (let i = 0; i < 4; i++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry((0.85 + Math.random() * 0.4) * s, 0),
      std({ color: i % 2 ? 0x3c5a2e : 0x4a6e38, roughness: 0.9, flatShading: true }));
    blob.position.set((Math.random() - 0.5) * 1.3 * s, (2.6 + Math.random() * 0.8) * s, (Math.random() - 0.5) * 1.3 * s);
    t.add(blob);
  }
  t.position.set(x, 0, z);
  return t;
}
for (const [tx, tz] of [[-45, -14], [-18, -18], [20, -16], [52, -13], [78, -19]]) {
  const tr = makeTree(tx, tz, 1 + Math.random() * 0.6);
  tr.children.forEach(mm => { mm.castShadow = true; mm.receiveShadow = true; });
  scene.add(tr);
}

// ---------- lighthouse on the sea ----------
const lighthouse = new THREE.Group();
lighthouse.position.set(170, -3.3, 260);
const lhBase = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2.2, 6, 12), matRock);
lhBase.position.y = 3;
lighthouse.add(lhBase);
const lhTower = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.3, 12, 12), std({ color: 0xe8e0d4, roughness: 0.7 }));
lhTower.position.y = 12;
lighthouse.add(lhTower);
const lhGallery = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.2, 12), matIron);
lhGallery.position.y = 18.6;
lighthouse.add(lhGallery);
const lhLantern = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 1.6, 12),
  new THREE.MeshStandardMaterial({ color: 0xffd080, emissive: 0xff9a30, emissiveIntensity: 3 }));
lhLantern.position.y = 19.5;
lighthouse.add(lhLantern);
const lhRoof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 12), matIron);
lhRoof.position.y = 20.4;
lighthouse.add(lhRoof);
scene.add(lighthouse);
pickable.push({ obj: lighthouse, name: 'Coastal lighthouse' });

// distant ships
function makeShip(x, z, s) {
  const sh = new THREE.Group();
  sh.add(H(5 * s, 1.2 * s, 1.6 * s, std({ color: 0x2c3034, roughness: 0.6 }), 0, 0.6 * s, 0));
  sh.add(H(0.8 * s, 1.4 * s, 0.8 * s, std({ color: 0x3a3f45, roughness: 0.6 }), 0.8 * s, 1.3 * s, 0));
  sh.position.set(x, -3.3 + 0.5, z);
  return sh;
}
scene.add(makeShip(-190, 420, 1.2));
scene.add(makeShip(120, 560, 0.9));

// seagulls
const birds = new THREE.Group();
const birdMat = new THREE.MeshBasicMaterial({ color: 0x2a2a30, side: THREE.DoubleSide });
for (let i = 0; i < 4; i++) {
  const b = new THREE.Group();
  const w1 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.12), birdMat);
  w1.position.set(-0.12, 0, 0);
  w1.rotation.z = 0.35;
  const w2 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.12), birdMat);
  w2.position.set(0.12, 0, 0);
  w2.rotation.z = -0.35;
  b.add(w1, w2);
  b.userData.phase = rand(0, Math.PI * 2);
  b.userData.radius = 6 + rand(0, 8);
  b.userData.cy = 9 + rand(0, 5);
  b.userData.speed = rand(0.3, 0.6);
  birds.add(b);
}
scene.add(birds);

// ---------- sky (golden hour) ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 16),
  new THREE.MeshBasicMaterial({
    map: (() => {
      const c = document.createElement('canvas'); c.width = 64; c.height = 256;
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, '#2c2a4a');
      gr.addColorStop(0.35, '#8a5a7c');
      gr.addColorStop(0.62, '#e88a5a');
      gr.addColorStop(0.8, '#f8b878');
      gr.addColorStop(1, '#f8c890');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
      return new THREE.CanvasTexture(c);
    })(),
    side: THREE.BackSide, fog: false,
  })
);
scene.add(sky);
// low sun disc over the sea
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(9, 32),
  new THREE.MeshBasicMaterial({ color: 0xffc890, transparent: true, opacity: 0.95, fog: false }));
sunDisc.position.set(60, 18, 500);
sunDisc.lookAt(0, 0, 0);
scene.add(sunDisc);
const sunGlow = new THREE.Mesh(new THREE.CircleGeometry(26, 32),
  new THREE.MeshBasicMaterial({ color: 0xffa860, transparent: true, opacity: 0.35, fog: false }));
sunGlow.position.copy(sunDisc.position);
sunGlow.lookAt(0, 0, 0);
scene.add(sunGlow);
// warm clouds
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffd0a8, transparent: true, opacity: 0.7, fog: false });
function makeCloud(x, y, z, s) {
  const cl = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry((1.3 + Math.random() * 0.7) * s, 8, 6), cloudMat);
    p.position.set((Math.random() - 0.5) * 4 * s, Math.random() * 0.6 * s, (Math.random() - 0.5) * 2 * s);
    cl.add(p);
  }
  cl.position.set(x, y, z);
  return cl;
}
for (const [cx, cy, cz, cs] of [[-150, 55, -80, 2.2], [90, 70, -120, 2.6], [220, 45, 60, 1.8], [-80, 80, 140, 3]]) {
  scene.add(makeCloud(cx, cy, cz, cs));
}

// ---------- lights (golden hour) ----------
const hemi = new THREE.HemisphereLight(0xffc9a0, 0x4a3a30, 0.7);
scene.add(hemi);
const fill = new THREE.DirectionalLight(0x8fb4dc, 0.35);
fill.position.set(40, 30, -60);
scene.add(fill);
// low sun casting long shadows across the path
const sun = new THREE.DirectionalLight(0xff9a50, 2.4);
sun.position.set(-35, 9, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0004;
scene.add(sun);
// warm lamp pools (a few real lights)
for (const lx of [-80, -32, 16, 64, 112]) {
  const pl = new THREE.PointLight(0xffa050, 6, 14, 2);
  pl.position.set(lx, 3.3, 0.3);
  scene.add(pl);
}

// ---------- picking / labels ----------
const labelEl = document.getElementById('label');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hovered = new Set();
function highlight(mesh, on) {
  if (mesh.userData.noHighlight) return;
  if (mesh.material && mesh.material.emissive) {
    if (on) {
      if (!mesh.userData._baseEm) mesh.userData._baseEm = mesh.material.emissive.clone();
      mesh.material.emissive.copy(mesh.userData._baseEm).addScalar(on ? 0.3 : 0);
      mesh.material.emissiveIntensity = on ? 0.5 : 0;
    } else {
      if (mesh.userData._baseEm) mesh.material.emissive.copy(mesh.userData._baseEm);
      mesh.material.emissiveIntensity = 0;
    }
  }
}
function applyHover(group, on) {
  group.traverse(o => { if (o.isMesh) highlight(o, on); });
}
function setLabel(text, show) {
  labelEl.textContent = text;
  labelEl.style.opacity = show ? 1 : 0;
}
canvas.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    canvas.style.cursor = 'pointer';
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry && !hovered.has(entry.obj)) {
      hovered.forEach(o => applyHover(o, false));
      hovered.clear();
      hovered.add(entry.obj);
      applyHover(entry.obj, true);
      setLabel(entry.name, true);
    }
  } else {
    if (hovered.size) { hovered.forEach(o => applyHover(o, false)); hovered.clear(); }
    canvas.style.cursor = 'grab';
    setLabel('', false);
  }
});
canvas.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry) setLabel(entry.name, true);
  }
});

// ---------- buttons ----------
let autoOrbit = false;
document.getElementById('btnOrbit').addEventListener('click', () => {
  autoOrbit = !autoOrbit;
  document.getElementById('btnOrbit').textContent = autoOrbit ? 'Orbit: ON' : 'Auto-orbit';
});
document.getElementById('btnReset').addEventListener('click', () => {
  intro = { active: true, t: 0 };
  intro.from = camera.position.clone();
  intro.to = new THREE.Vector3(16, 3.2, -12);
  intro.fromT = ctl.target.clone();
  intro.toT = new THREE.Vector3(0, 1.5, 8);
  ctl.enabled = false;
});

// ---------- intro fly-in ----------
let intro = { active: true, t: 0 };
intro.from = new THREE.Vector3(90, 34, -70);
intro.to = new THREE.Vector3(16, 3.2, -12);
intro.fromT = new THREE.Vector3(0, 4, 0);
intro.toT = new THREE.Vector3(0, 1.5, 8);
camera.position.copy(intro.from);
ctl.target.copy(intro.fromT);
ctl.enabled = false;

// ---------- animate ----------
const clock3 = new THREE.Clock();
const statsEl = document.getElementById('stats');
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);
  const t = clock3.elapsedTime;
  oceanUniforms.uTime.value = t;
  birds.children.forEach((b, i) => {
    const ph = b.userData.phase + t * b.userData.speed;
    b.position.set(Math.sin(ph) * b.userData.radius * (i % 2 ? 1 : -1) + 20, b.userData.cy + Math.sin(t * 2 + i) * 0.5, Math.cos(ph) * b.userData.radius);
    b.rotation.y = Math.atan2(Math.cos(ph) * b.userData.speed, Math.cos(ph) * 0) + Math.PI / 2;
    b.rotation.z = Math.sin(t * 9 + i * 2) * 0.25;
  });
  if (intro.active) {
    intro.t += dt / 2.2;
    const k = Math.min(intro.t, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(intro.from, intro.to, e);
    ctl.target.lerpVectors(intro.fromT, intro.toT, e);
    if (k >= 1) { intro.active = false; ctl.enabled = true; }
  }
  ctl.autoRotate = autoOrbit && !intro.active;
  ctl.update();
  renderer.render(scene, camera);
  statsEl.textContent = `${renderer.info.render.triangles.toLocaleString()} tris · ${renderer.info.render.calls} draw calls`;
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
