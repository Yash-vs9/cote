<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Studio · Room 401</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161412; font-family: 'Segoe UI', system-ui, sans-serif; }
  #c { position: fixed; inset: 0; }
  #ui { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
  #ui button {
    background: rgba(30, 26, 22, 0.72); color: #ffe9cf; border: 1px solid rgba(255, 200, 130, 0.35);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.2s;
  }
  #ui button:hover { background: rgba(130, 90, 40, 0.7); }
  #stats {
    position: fixed; bottom: 14px; left: 14px; z-index: 10; color: #ffd9a8; font-size: 12px;
    background: rgba(30, 26, 22, 0.6); padding: 6px 12px; border-radius: 12px; backdrop-filter: blur(4px);
  }
  #label {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(24, 20, 16, 0.9); color: #fff0dc; padding: 8px 18px; border-radius: 18px;
    font-size: 14px; border: 1px solid rgba(255, 200, 130, 0.5); opacity: 0; transition: opacity 0.25s;
    pointer-events: none; max-width: 80vw; text-align: center;
  }
  #hint { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 9; color: rgba(255, 225, 185, 0.55); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btnOrbit">Auto-orbit</button>
  <button id="btnReset">Reset view</button>
</div>
<div id="stats">…</div>
<div id="label"></div>
<div id="hint">Drag to orbit · scroll to zoom · click anything to inspect it</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3e8d8);
scene.fog = new THREE.Fog(0xf3e8d8, 8, 30);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 400);
const ctl = new OrbitControls(camera, canvas);
ctl.target.set(0, 1.1, -0.3);
ctl.enableDamping = true;
ctl.dampingFactor = 0.08;
ctl.minDistance = 0.4;
ctl.maxDistance = 12;

// ---------- helpers ----------
const H = (w, h, d, mat, x, y, z, ry = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.y = ry;
  return m;
};
const std = (o, extra = {}) => Object.assign(new THREE.MeshStandardMaterial(o), extra);
const pickable = [];
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- textures ----------
function tatamiTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#c2b280'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 260; i++) {
    g.strokeStyle = `rgba(${rand(0, 255) | 0},${rand(0, 255) | 0},${rand(0, 255) | 0},${rand(0.02, 0.07)})`;
    g.lineWidth = 1;
    const y = rand(0, 256);
    g.beginPath(); g.moveTo(0, y); g.lineTo(256, y + rand(-2, 2)); g.stroke();
  }
  for (let i = 0; i < 90; i++) {
    g.fillStyle = `rgba(120, 105, 60, ${rand(0.05, 0.14)})`;
    g.fillRect(rand(18, 238), rand(0, 256), rand(1, 3), rand(2, 6));
  }
  // heri border on the long sides (left/right edges)
  for (const side of [0, 1]) {
    g.fillStyle = '#4a5340';
    g.fillRect(side ? 236 : 0, 0, 20, 256);
    g.fillStyle = '#3c4432';
    g.fillRect(side ? 236 : 0, 0, 4, 256);
    g.fillStyle = '#5c6650';
    g.fillRect(side ? 252 : 4, 0, 4, 256);
  }
  return new THREE.CanvasTexture(c);
}
function wallTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f0efe9'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 500; i++) {
    g.fillStyle = `rgba(${rand(0, 255) | 0},${rand(0, 255) | 0},${rand(0, 255) | 0},${rand(0.01, 0.035)})`;
    g.fillRect(rand(0, 256), rand(0, 256), rand(1, 3), rand(1, 3));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const matWall = std({ map: wallTexture(), roughness: 0.8, metalness: 0.0 });
const matTatami = std({ map: tatamiTexture(), roughness: 0.6, metalness: 0.0 });
const matWood = std({ color: 0x9a6a3c, roughness: 0.5, metalness: 0.02 });
const matWhite = std({ color: 0xf5f5f2, roughness: 0.7 });
const matSteel = std({ color: 0x3a3d42, roughness: 0.4, metalness: 0.7 });
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xdceaf2, roughness: 0.06, metalness: 0.1,
  transparent: true, opacity: 0.85, transmission: 0.75, thickness: 0.05,
});
const matWarm = new THREE.MeshBasicMaterial({ color: 0xffe2ac, transparent: true, opacity: 0.9 });

// ---------- room dimensions (8 tatami = 3.64 × 3.64) ----------
const ROOM = 3.64, HH = 2.5;

// ---------- tatami floor (8 mats, 4×2) ----------
const floorGroup = new THREE.Group();
const matW = 0.91, matD = 1.82;
for (let i = 0; i < 4; i++) {
  for (let j = 0; j < 2; j++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(matW, 0.07, matD), matTatami);
    m.position.set(-ROOM / 2 + matW / 2 + i * matW, -0.035, -ROOM / 2 + matD / 2 + j * matD);
    m.receiveShadow = true;
    floorGroup.add(m);
  }
}
scene.add(floorGroup);
pickable.push({ obj: floorGroup, name: 'Tatami floor — 8 mats (13.25 m²)' });

// ---------- walls (with openings) ----------
const baseboard = std({ color: 0xd8d4ca, roughness: 0.6 });
function baseband(z, ry) {
  const b = H(ROOM + 0.02, 0.09, 0.025, baseboard, 0, 0.045, z);
  b.rotation.y = ry || 0;
  return b;
}
// north wall — sliding balcony door opening x -0.8..0.8, y 0..2.1
const northWall = new THREE.Group();
northWall.add(H(1.02, HH, 0.1, matWall, -1.41, HH / 2, -ROOM / 2));
northWall.add(H(1.02, HH, 0.1, matWall, 1.41, HH / 2, -ROOM / 2));
northWall.add(H(1.6, 0.4, 0.1, matWall, 0, 2.3, -ROOM / 2));
scene.add(northWall);
scene.add(H(ROOM + 0.02, 0.09, 0.025, baseboard, 0, 0.045, -ROOM / 2));

// south wall — front door opening x 0.2..1.05 and bathroom door x -1.05..-0.2
const southWall = new THREE.Group();
southWall.add(H(0.77, HH, 0.1, matWall, -1.435, HH / 2, ROOM / 2));
southWall.add(H(0.4, HH, 0.1, matWall, 0, HH / 2, ROOM / 2));
southWall.add(H(0.77, HH, 0.1, matWall, 1.435, HH / 2, ROOM / 2));
southWall.add(H(ROOM, 0.4, 0.1, matWall, 0, 2.3, ROOM / 2));
scene.add(southWall);
scene.add(H(ROOM + 0.02, 0.09, 0.025, baseboard, 0, 0.045, ROOM / 2));

// east & west walls
for (const sx of [-1, 1]) {
  scene.add(H(0.1, HH, ROOM, matWall, sx * ROOM / 2, HH / 2, 0));
  const bb = H(0.025, 0.09, ROOM, baseboard, sx * ROOM / 2, 0.045, 0);
  scene.add(bb);
}

// ---------- ceiling ----------
scene.add(H(ROOM, 0.08, ROOM, matWhite, 0, HH + 0.04, 0));
const ceilLight = new THREE.Mesh(new THREE.CircleGeometry(0.16, 20), matWarm);
ceilLight.rotation.x = Math.PI / 2;
ceilLight.position.set(0, HH - 0.02, 0);
scene.add(ceilLight);

// ---------- balcony sliding door (open) + balcony ----------
const slideGroup = new THREE.Group();
const panelMat = matGlass;
const frameMat = std({ color: 0x9aa0a6, roughness: 0.3, metalness: 0.6 });
function makePanel(x, z, w) {
  const p = new THREE.Group();
  p.add(H(w, 0.06, 0.04, frameMat, x, 2.06, z));
  p.add(H(w, 0.06, 0.04, frameMat, x, 0.03, z));
  p.add(H(0.04, 2.0, 0.04, frameMat, x - w / 2 + 0.03, 1.05, z));
  p.add(H(0.04, 2.0, 0.04, frameMat, x + w / 2 - 0.03, 1.05, z));
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.09, 1.94), panelMat);
  glass.position.set(x, 1.05, z);
  glass.rotation.y = Math.PI;
  p.add(glass);
  const handle = H(0.02, 0.5, 0.06, frameMat, x - 0.1, 1.0, z + 0.05);
  p.add(handle);
  return p;
}
// both panels stacked at the right side of the opening (x 0..0.8) → left half fully open
slideGroup.add(makePanel(0.4, -1.77, 0.8));
slideGroup.add(makePanel(0.4, -1.85, 0.8));
scene.add(slideGroup);
pickable.push({ obj: slideGroup, name: 'Balcony sliding door — open & passable' });

// casing around the opening
scene.add(H(0.06, 2.1, 0.06, frameMat, -0.8, 1.05, -ROOM / 2 - 0.03));
scene.add(H(0.06, 2.1, 0.06, frameMat, 0.8, 1.05, -ROOM / 2 - 0.03));
scene.add(H(1.66, 0.07, 0.06, frameMat, 0, 2.12, -ROOM / 2 - 0.03));

// balcony
const balcony = new THREE.Group();
const balSlab = H(2.9, 0.12, 1.5, std({ color: 0xcfc9bf, roughness: 0.7 }), 0, -0.06, -2.55);
balcony.add(balSlab);
const railMat = std({ color: 0x6a7076, roughness: 0.35, metalness: 0.6 });
const balGlass = new THREE.MeshPhysicalMaterial({
  color: 0xbfd6e4, roughness: 0.1, metalness: 0.2, transparent: true, opacity: 0.35,
});
// outer railing at z = -3.25
const railTop = H(2.9, 0.05, 0.05, railMat, 0, 1.1, -3.22);
const railMid = H(2.9, 0.05, 0.05, railMat, 0, 0.6, -3.22);
balcony.add(railTop, railMid);
const glassInf = new THREE.Mesh(new THREE.PlaneGeometry(2.86, 0.9), balGlass);
glassInf.position.set(0, 0.82, -3.22);
glassInf.rotation.y = Math.PI;
balcony.add(glassInf);
for (const px of [-1.4, 1.4]) {
  balcony.add(H(0.05, 1.12, 0.05, railMat, px, 0.56, -3.22));
}
// side railings
for (const sx of [-1, 1]) {
  balcony.add(H(0.05, 0.05, 1.4, railMat, sx * 1.4, 1.1, -2.5));
  balcony.add(H(0.05, 0.05, 1.4, railMat, sx * 1.4, 0.6, -2.5));
  balcony.add(H(0.05, 1.12, 0.05, railMat, sx * 1.4, 0.56, -3.22));
}
scene.add(balcony);
pickable.push({ obj: balcony, name: 'Private balcony — 4th floor view' });

// sheer curtain over the balcony door
const curtainMat = new THREE.MeshBasicMaterial({ color: 0xfff8ec, transparent: true, opacity: 0.18, side: THREE.DoubleSide });
const curtain = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.0), curtainMat);
curtain.position.set(0, 1.05, -1.74);
curtain.rotation.y = Math.PI;
scene.add(curtain);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.7, 6), frameMat);
rod.rotation.z = Math.PI / 2;
rod.position.set(0, 2.14, -1.74);
scene.add(rod);

// ---------- bed (right corner, east wall) ----------
const bed = new THREE.Group();
const matFrame = std({ color: 0x7a5230, roughness: 0.45, metalness: 0.02 });
const matSheet = std({ color: 0xf7f6f2, roughness: 0.85 });
const matPillow = std({ color: 0xfdfdfa, roughness: 0.9 });
const matBlanket = std({ color: 0xdfe6ec, roughness: 0.9 });
// bed runs along the east wall, headboard at the north end
const base = H(1.02, 0.32, 2.05, matFrame, 1.28, 0.16, -0.3);
bed.add(base);
const headboard = H(1.02, 0.5, 0.06, matFrame, 1.28, 0.55, -1.31);
bed.add(headboard);
const mattress = H(0.98, 0.14, 1.98, matSheet, 1.28, 0.39, -0.3);
bed.add(mattress);
const pillow = H(0.5, 0.11, 0.32, matPillow, 1.28, 0.51, -1.12);
pillow.rotation.y = 0.15;
bed.add(pillow);
const blanket = H(0.98, 0.1, 1.15, matBlanket, 1.28, 0.51, 0.35);
bed.add(blanket);
for (const lz of [-1.15, -0.3, 0.55]) {
  bed.add(H(0.06, 0.32, 0.06, matFrame, 0.8, 0.16, lz));
  bed.add(H(0.06, 0.32, 0.06, matFrame, 1.76, 0.16, lz));
}
scene.add(bed);
pickable.push({ obj: bed, name: 'Twin bed — white sheets & blanket' });

// nightstand + landline phone
const nightstand = new THREE.Group();
nightstand.position.set(1.55, 0, 0.78);
nightstand.add(H(0.45, 0.5, 0.4, matWood, 0, 0.25, 0));
nightstand.add(H(0.49, 0.04, 0.44, matWhite, 0, 0.52, 0));
// landline phone
const phone = new THREE.Group();
phone.position.set(0, 0.56, 0);
phone.add(H(0.24, 0.03, 0.17, std({ color: 0x4a4e52, roughness: 0.4 }), 0, 0.015, 0));
phone.add(H(0.06, 0.02, 0.14, std({ color: 0x2c2f33, roughness: 0.5 }), -0.1, 0.05, 0));
phone.add(H(0.05, 0.02, 0.16, std({ color: 0x2c2f33, roughness: 0.5 }), 0.09, 0.045, 0.03));
phone.rotation.y = -0.3;
nightstand.add(phone);
const alarm = new THREE.Mesh(new THREE.CircleGeometry(0.035, 10), new THREE.MeshBasicMaterial({ color: 0x4fd2ff }));
alarm.position.set(0.1, 0.62, -0.1);
nightstand.add(alarm);
scene.add(nightstand);
pickable.push({ obj: nightstand, name: 'Nightstand with landline phone' });

// ---------- workstation (west wall) ----------
const desk = new THREE.Group();
desk.position.set(-1.55, 0, -0.15);
const top = H(1.15, 0.04, 0.55, matWood, 0, 0.75, 0);
desk.add(top);
for (const lx of [-0.5, 0.5]) {
  desk.add(H(0.035, 0.75, 0.035, matSteel, lx, 0.375, -0.2));
  desk.add(H(0.035, 0.75, 0.035, matSteel, lx, 0.375, 0.2));
}
// desk lamp (warm 3000K)
const lamp = new THREE.Group();
lamp.position.set(-0.32, 0.77, 0.05);
lamp.add(H(0.02, 0.32, 0.02, matSteel, 0, 0.16, 0));
lamp.add(H(0.16, 0.05, 0.12, matSteel, 0, 0.34, 0));
const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.16, 14, 1, true), std({ color: 0x4a3820, roughness: 0.5, emissive: 0xffb86a, emissiveIntensity: 1.6, side: THREE.DoubleSide }));
lampShade.position.set(0, 0.45, 0);
lampShade.rotation.x = Math.PI;
lamp.add(lampShade);
const lampGlow = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), matWarm);
lampGlow.position.set(0, 0.4, 0);
lamp.add(lampGlow);
const lampLight = new THREE.PointLight(0xffc890, 2.6, 3.2, 2);
lampLight.position.set(0, 0.5, 0.15);
lamp.add(lampLight);
desk.add(lamp);
// laptop
const laptop = new THREE.Group();
laptop.position.set(0.12, 0.78, -0.05);
laptop.rotation.y = -0.25;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.27),
  new THREE.MeshBasicMaterial({ color: 0x9fd8ff }));
screen.position.set(0, 0.12, -0.01);
laptop.add(screen);
const lid = H(0.45, 0.03, 0.3, std({ color: 0x2c2f33, roughness: 0.4 }), 0, 0.27, 0);
laptop.add(lid);
const kb = H(0.42, 0.02, 0.24, std({ color: 0x3a3d42, roughness: 0.4 }), 0, 0.01, 0.05);
laptop.add(kb);
desk.add(laptop);
// mug + books
const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.09, 12), std({ color: 0xd96a5a, roughness: 0.6 }));
mug.position.set(0.32, 0.81, 0.12);
desk.add(mug);
// chair
const chair = new THREE.Group();
chair.position.set(-1.55, 0, 0.75);
const seat = H(0.42, 0.05, 0.42, matWood, 0, 0.45, 0);
chair.add(seat);
const back = H(0.42, 0.55, 0.04, matWood, 0, 0.75, -0.2);
back.rotation.x = -0.1;
chair.add(back);
chair.add(H(0.035, 0.45, 0.035, matSteel, -0.18, 0.225, -0.18));
chair.add(H(0.035, 0.45, 0.035, matSteel, 0.18, 0.225, -0.18));
chair.add(H(0.035, 0.45, 0.035, matSteel, -0.18, 0.225, 0.18));
chair.add(H(0.035, 0.45, 0.035, matSteel, 0.18, 0.225, 0.18));
scene.add(chair);
scene.add(desk);
pickable.push({ obj: desk, name: 'Study desk — lamp, laptop & mug' });

// wall shelf above the desk
const shelf = new THREE.Group();
shelf.position.set(-1.62, 0, -0.15);
const board = H(0.85, 0.03, 0.2, matWood, 0, 1.7, 0);
shelf.add(board);
for (const sx of [-0.38, 0.38]) {
  shelf.add(H(0.03, 0.25, 0.03, matWood, sx, 1.56, -0.05));
}
for (let i = 0; i < 5; i++) {
  const book = new THREE.Mesh(new THREE.BoxGeometry(0.05 + Math.random() * 0.02, 0.16 + Math.random() * 0.07, 0.14),
    std({ color: [0x7a4a3a, 0x3f5a8a, 0x3f7a4a, 0x8a7a3a, 0x4a3f6a][i], roughness: 0.7 }));
  book.position.set(-0.3 + i * 0.13, 1.79, 0.02);
  shelf.add(book);
}
const plant = new THREE.Group();
plant.position.set(0.34, 1.71, 0);
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.09, 10), std({ color: 0xb86a4a, roughness: 0.7 }));
pot.position.y = 0.045;
plant.add(pot);
const leafMat = std({ color: 0x4f9e46, roughness: 0.8 });
for (let i = 0; i < 4; i++) {
  const lf = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 5), leafMat);
  lf.position.set((Math.random() - 0.5) * 0.06, 0.13 + Math.random() * 0.05, (Math.random() - 0.5) * 0.06);
  plant.add(lf);
}
shelf.add(plant);
scene.add(shelf);
pickable.push({ obj: shelf, name: 'Wall shelf — books & plant' });

// ---------- mini-fridge (front-left corner) ----------
const fridge = new THREE.Group();
fridge.position.set(-1.62, 0, 1.42);
const body = H(0.55, 0.92, 0.55, std({ color: 0xedeae2, roughness: 0.6 }), 0, 0.46, 0);
fridge.add(body);
const doorLine = H(0.02, 0.85, 0.56, std({ color: 0xc9c6bd, roughness: 0.5 }), -0.26, 0.43, 0);
fridge.add(doorLine);
const handle = H(0.02, 0.3, 0.03, matSteel, -0.2, 0.5, 0.28);
fridge.add(handle);
const magnet = new THREE.Mesh(new THREE.CircleGeometry(0.03, 8), std({ color: 0xe05a4a, roughness: 0.5 }));
magnet.position.set(-0.1, 0.62, 0.28);
fridge.add(magnet);
fridge.add(H(0.55, 0.03, 0.55, std({ color: 0x8a8f94, roughness: 0.4, metalness: 0.3 }), 0, 0.91, 0));
scene.add(fridge);
pickable.push({ obj: fridge, name: 'Mini-fridge' });

// ---------- front door (south, open into the room) + keycard scanner ----------
const doorGroup = new THREE.Group();
// casing
doorGroup.add(H(0.06, 2.1, 0.08, matWood, 0.2, 1.05, ROOM / 2 + 0.04));
doorGroup.add(H(0.06, 2.1, 0.08, matWood, 1.05, 1.05, ROOM / 2 + 0.04));
doorGroup.add(H(0.91, 0.07, 0.08, matWood, 0.625, 2.12, ROOM / 2 + 0.04));
// door leaf — hinged at the east jamb, swung 90° into the room
const hinge = new THREE.Group();
hinge.position.set(1.05, 0, ROOM / 2);
const leaf = new THREE.Group();
leaf.add(H(0.05, 2.1, 0.85, std({ color: 0x8a8f94, roughness: 0.45, metalness: 0.3 }), -0.425, 1.05, 0));
const keypad = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.16, 0.03), std({ color: 0x22262a, roughness: 0.4 }));
keypad.position.set(-0.42, 1.35, 0.03);
leaf.add(keypad);
const keyGlow = new THREE.Mesh(new THREE.CircleGeometry(0.02, 8), new THREE.MeshBasicMaterial({ color: 0x39ffa0 }));
keyGlow.position.set(-0.42, 1.28, 0.05);
leaf.add(keyGlow);
const handle2 = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.14, 8), matSteel);
handle2.rotation.z = Math.PI / 2;
handle2.position.set(-0.12, 1.05, 0.08);
leaf.add(handle2);
hinge.add(leaf);
hinge.rotation.y = -Math.PI / 2;
doorGroup.add(hinge);
scene.add(doorGroup);
pickable.push({ obj: doorGroup, name: 'Front door — open, green keycard scanner' });

// room number plaque beside the door
function makePlaqueTexture() {

function makeTree(x, z, s) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * s, 0.25 * s, 2.2 * s, 6), std({ color: 0x5d4328, roughness: 0.9 }));
  trunk.position.y = 1.1 * s;
  t.add(trunk);
  for (let i = 0; i < 4; i++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry((0.8 + Math.random() * 0.4) * s, 0),
      std({ color: i % 2 ? 0x4f9e46 : 0x61ad4f, roughness: 0.9, flatShading: true }));
    blob.position.set((Math.random() - 0.5) * 1.3 * s, (2.3 + Math.random() * 0.8) * s, (Math.random() - 0.5) * 1.3 * s);
    t.add(blob);
  }
  t.position.set(x, 0, z);
  return t;
}

// ---------- picking / labels ----------
const labelEl = document.getElementById('label');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hovered = new Set();
function highlight(mesh, on) {
  if (mesh.userData.noHighlight) return;
  if (mesh.material && mesh.material.emissive) {
    if (on) {
      if (!mesh.userData._baseEm) mesh.userData._baseEm = mesh.material.emissive.clone();
      mesh.material.emissive.copy(mesh.userData._baseEm).addScalar(on ? 0.3 : 0);
      mesh.material.emissiveIntensity = on ? 0.5 : 0;
    } else {
      if (mesh.userData._baseEm) mesh.material.emissive.copy(mesh.userData._baseEm);
      mesh.material.emissiveIntensity = 0;
    }
  }
}
function applyHover(group, on) {
  group.traverse(o => { if (o.isMesh) highlight(o, on); });
}
function setLabel(text, show) {
  labelEl.textContent = text;
  labelEl.style.opacity = show ? 1 : 0;
}
canvas.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    canvas.style.cursor = 'pointer';
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry && !hovered.has(entry.obj)) {
      hovered.forEach(o => applyHover(o, false));
      hovered.clear();
      hovered.add(entry.obj);
      applyHover(entry.obj, true);
      setLabel(entry.name, true);
    }
  } else {
    if (hovered.size) { hovered.forEach(o => applyHover(o, false)); hovered.clear(); }
    canvas.style.cursor = 'grab';
    setLabel('', false);
  }
});
canvas.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables.map(p => p.obj), true);
  if (hits.length) {
    const entry = pickables.find(p => {
      let o = hits[0].object;
      while (o) { if (o === p.obj) return true; o = o.parent; }
      return false;
    });
    if (entry) setLabel(entry.name, true);
  }
});

// ---------- buttons ----------
let autoOrbit = false;
document.getElementById('btnOrbit').addEventListener('click', () => {
  autoOrbit = !autoOrbit;
  document.getElementById('btnOrbit').textContent = autoOrbit ? 'Orbit: ON' : 'Auto-orbit';
});
document.getElementById('btnReset').addEventListener('click', () => {
  intro = { active: true, t: 0 };
  intro.from = camera.position.clone();
  intro.to = new THREE.Vector3(1.6, 1.5, 2.4);
  intro.fromT = ctl.target.clone();
  intro.toT = new THREE.Vector3(0, 1.1, -0.3);
  ctl.enabled = false;
});

// ---------- intro fly-in ----------
let intro = { active: true, t: 0 };
intro.from = new THREE.Vector3(4.2, 2.4, 5.2);
intro.to = new THREE.Vector3(1.6, 1.5, 2.4);
intro.fromT = new THREE.Vector3(0, 1, 0);
intro.toT = new THREE.Vector3(0, 1.1, -0.3);
camera.position.copy(intro.from);
ctl.target.copy(intro.fromT);
ctl.enabled = false;

// ---------- animate ----------
const clock3 = new THREE.Clock();
const statsEl = document.getElementById('stats');
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);
  if (intro.active) {
    intro.t += dt / 1.6;
    const k = Math.min(intro.t, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(intro.from, intro.to, e);
    ctl.target.lerpVectors(intro.fromT, intro.toT, e);
    if (k >= 1) { intro.active = false; ctl.enabled = true; }
  }
  ctl.autoRotate = autoOrbit && !intro.active;
  ctl.update();
  renderer.render(scene, camera);
  statsEl.textContent = `${renderer.info.render.triangles.toLocaleString()} tris · ${renderer.info.render.calls} draw calls`;
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
