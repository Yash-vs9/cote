<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 1-D — Interactive Classroom (WebGL)</title>
<style>
  :root { --panel: rgba(18,20,24,0.72); --line: rgba(255,255,255,0.14); --txt: #e8e6e1; --acc: #ffb84d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#101216; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; color:var(--txt); pointer-events:none; user-select:none; }
  #title { top:16px; left:18px; }
  #title h1 { font-size:15px; font-weight:600; letter-spacing:0.04em; }
  #title p  { font-size:11px; opacity:0.65; margin-top:3px; letter-spacing:0.08em; }
  .chip { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:10px; opacity:0.9; margin-top:8px; letter-spacing:0.05em; }
  #readout { top:16px; right:18px; text-align:right; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; backdrop-filter:blur(6px); min-width:130px; }
  #readout .lbl { opacity:0.55; font-size:10px; text-transform:uppercase; letter-spacing:0.14em; }
  #readout .val { margin-top:4px; font-weight:600; color:var(--acc); }
  #hint { bottom:18px; left:50%; transform:translateX(-50%); font-size:12px; opacity:0.85; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 16px; letter-spacing:0.03em; white-space:nowrap; }
  #tools { bottom:18px; right:18px; display:flex; gap:8px; pointer-events:auto; }
  .btn { font:inherit; font-size:12px; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; letter-spacing:0.03em; transition:background .15s, border-color .15s; }
  .btn:hover { background:rgba(255,255,255,0.12); }
  .btn.on { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title">
  <h1>Class 1-D · Classroom Interior</h1>
  <p>TOKYO METROPOLITAN ADVANCED NURTURING HIGH SCHOOL</p>
  <div class="chip" id="stats"></div>
</div>
<div class="hud" id="readout"><div class="lbl">Selection</div><div class="val" id="sel">—</div></div>
<div class="hud" id="hint">🖱️&nbsp;Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click to inspect</div>
<div class="hud" id="tools">
  <button class="btn" id="btnOrbit">Auto-orbit</button>
  <button class="btn" id="btnReset">Reset view</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================ renderer / scene / camera ============================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3ef); // exterior sky
scene.fog = new THREE.Fog(0xcfe3ef, 26, 60);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 120);
// default view: the classroom as seen from outside, through the west glass wall
const HOME_POS = new THREE.Vector3(-10.2, 2.3, 3.2);
const HOME_TGT = new THREE.Vector3(0.5, 1.3, -0.5);
camera.position.copy(HOME_POS);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
pmrem.dispose();

/* ============================ lighting ============================ */
// 6500K soft sky fill
scene.add(new THREE.HemisphereLight(0xfffdfa, 0x8f8a82, 1.05));

// 5600K directional sun key light entering through the west windows at ~35°
const sun = new THREE.DirectionalLight(0xfff1dc, 2.7);
sun.position.set(-8.5, 5.9, 1.2);
sun.target.position.set(0, 0.9, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;  sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;    sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

// soft fill coming from the emissive ceiling panels
const fill = new THREE.PointLight(0xfffdf5, 35, 14, 2);
fill.position.set(0, 3.2, 0);
scene.add(fill);

/* ============================ PBR materials ============================ */
const M = {
  floor:     new THREE.MeshPhysicalMaterial({ color: 0xD4A373, roughness: 0.25, metalness: 0.0, clearcoat: 0.5, clearcoatRoughness: 0.35 }),
  seam:      new THREE.MeshStandardMaterial({ color: 0xB98B5B, roughness: 0.5 }),
  wall:      new THREE.MeshStandardMaterial({ color: 0xEFEDE8, roughness: 0.92 }),
  wainscot:  new THREE.MeshStandardMaterial({ color: 0x44352A, roughness: 0.5 }),
  ceiling:   new THREE.MeshStandardMaterial({ color: 0xF4F4F0, roughness: 0.92 }),
  ledFrame:  new THREE.MeshStandardMaterial({ color: 0xE2E0D9, roughness: 0.8 }),
  led:       new THREE.MeshStandardMaterial({ color: 0xFFF8E7, emissive: 0xFFF3D6, emissiveIntensity: 1.25, roughness: 0.6 }),
  deskTop:   new THREE.MeshStandardMaterial({ color: 0xE6C280, roughness: 0.4 }),
  steel:     new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.85 }),
  chairWood: new THREE.MeshStandardMaterial({ color: 0xDCB283, roughness: 0.45 }),
  daisWood:  new THREE.MeshStandardMaterial({ color: 0x9C7148, roughness: 0.5 }),
  podium:    new THREE.MeshPhysicalMaterial({ color: 0x4A2C17, roughness: 0.28, metalness: 0.0, clearcoat: 0.4 }),
  board:     new THREE.MeshPhysicalMaterial({ color: 0xF6F8FA, roughness: 0.05, metalness: 0.1, clearcoat: 0.9, clearcoatRoughness: 0.05 }),
  boardFrame:new THREE.MeshStandardMaterial({ color: 0xB4B9BE, roughness: 0.5, metalness: 0.6 }),
  tvBezel:   new THREE.MeshStandardMaterial({ color: 0x14161A, roughness: 0.35, metalness: 0.5 }),
  tvScreen:  new THREE.MeshStandardMaterial({ color: 0x0A0C10, emissive: 0x8FB8FF, emissiveIntensity: 1.3, roughness: 0.4 }),
  locker:    new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.35, metalness: 0.85 }),
  lockerKey: new THREE.MeshStandardMaterial({ color: 0x1B1D20, roughness: 0.5, metalness: 0.4 }),
  lockerLed: new THREE.MeshStandardMaterial({ color: 0x0A0C10, emissive: 0x4CF07A, emissiveIntensity: 2.2 }),
  glass:     new THREE.MeshPhysicalMaterial({ color: 0xDFE8F0, transmission: 0.92, roughness: 0.02, ior: 1.52, thickness: 0.06, envMapIntensity: 1.0 }),
  mullion:   new THREE.MeshStandardMaterial({ color: 0x2C3136, roughness: 0.4, metalness: 0.6 }),
  camHousing:new THREE.MeshPhysicalMaterial({ color: 0x1A1A1A, roughness: 0.1, metalness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.1 }),
  camDome:   new THREE.MeshPhysicalMaterial({ color: 0x11141A, roughness: 0.05, metalness: 0.2, transmission: 0.7, ior: 1.5 }),
  camLed:    new THREE.MeshStandardMaterial({ color: 0x0A0C10, emissive: 0xFF3B30, emissiveIntensity: 2.5 }),
  treeTrunk: new THREE.MeshStandardMaterial({ color: 0x6B4A2F, roughness: 0.9 }),
  foliage:   new THREE.MeshStandardMaterial({ color: 0x3E6B34, roughness: 0.9, flatShading: true }),
  benchWood: new THREE.MeshStandardMaterial({ color: 0x8F6B45, roughness: 0.7 }),
  benchMetal:new THREE.MeshStandardMaterial({ color: 0x55585C, roughness: 0.4, metalness: 0.6 }),
  facade:    new THREE.MeshStandardMaterial({ color: 0xE6DCC3, roughness: 0.9 }),
  plinth:    new THREE.MeshStandardMaterial({ color: 0x8A8478, roughness: 0.9 }),
  winFrame:  new THREE.MeshStandardMaterial({ color: 0x4A4E53, roughness: 0.5, metalness: 0.4 }),
  winGlass:  new THREE.MeshStandardMaterial({ color: 0x2F3B49, roughness: 0.25, metalness: 0.5 }),
  fascia:    new THREE.MeshStandardMaterial({ color: 0x7C8896, roughness: 0.7 }),
  blindRoll: new THREE.MeshStandardMaterial({ color: 0xE9E2D2, roughness: 0.8 }),
  doorWood:  new THREE.MeshPhysicalMaterial({ color: 0x8F6036, roughness: 0.35, metalness: 0.0, clearcoat: 0.5, clearcoatRoughness: 0.25 }),
  doorWoodPanel: new THREE.MeshStandardMaterial({ color: 0x7C522E, roughness: 0.4 }),
  doorFrame: new THREE.MeshStandardMaterial({ color: 0x3A3F44, roughness: 0.4, metalness: 0.5 }),
  brass:     new THREE.MeshStandardMaterial({ color: 0xC9A227, roughness: 0.25, metalness: 1.0 }),
  threshold: new THREE.MeshStandardMaterial({ color: 0x666A70, roughness: 0.5, metalness: 0.15 }),
  mat:       new THREE.MeshStandardMaterial({ color: 0x33423A, roughness: 0.95 }),
  dust:      new THREE.PointsMaterial({ color: 0xFFF3DC, size: 0.025, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }),
};

/* ============================ room geometry ============================ */
const ROOM = { w: 10, l: 12, h: 3.5 };
const NORTH = -ROOM.l / 2, SOUTH = ROOM.l / 2, WEST = -ROOM.w / 2, EAST = ROOM.w / 2;
const DOORWAY = { z: 2.8, w: 1.1, h: 2.2 }; // real opening cut through the east wall

function box(w, h, d, mat, x, y, z, opts = {}) {
  const { cast = true, recv = true, rotY = 0 } = opts;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (rotY) m.rotation.y = rotY;
  m.castShadow = cast;
  m.receiveShadow = recv;
  scene.add(m);
  return m;
}

function buildRoom() {
  // polished light-oak parquet floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.l), M.floor);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  // plank seams running parallel to the long walls
  for (let i = 1; i < 10; i++) box(0.008, 0.002, ROOM.l, M.seam, WEST + i, 0.004, 0, { cast: false });

  // solid walls: north, south, east (west is a glass curtain wall)
  box(ROOM.w, ROOM.h, 0.18, M.wall, 0, ROOM.h / 2, NORTH - 0.09);
  box(ROOM.w, ROOM.h, 0.18, M.wall, 0, ROOM.h / 2, SOUTH + 0.09);
  // east wall with a real doorway opening cut through it (DOORWAY), so objects can pass
  box(0.18, ROOM.h, DOORWAY.z - DOORWAY.w / 2 - NORTH, M.wall, EAST + 0.09, ROOM.h / 2, (NORTH + DOORWAY.z - DOORWAY.w / 2) / 2);
  box(0.18, ROOM.h, SOUTH - (DOORWAY.z + DOORWAY.w / 2), M.wall, EAST + 0.09, ROOM.h / 2, (SOUTH + DOORWAY.z + DOORWAY.w / 2) / 2);
  box(0.18, ROOM.h - DOORWAY.h, DOORWAY.w, M.wall, EAST + 0.09, DOORWAY.h + (ROOM.h - DOORWAY.h) / 2, DOORWAY.z);

  // dark wooden wainscoting, bottom 1 m (north & east walls; south is lockers)
  box(ROOM.w, 1.0, 0.06, M.wainscot, 0, 0.5, NORTH + 0.03);
  // east wainscoting split so the doorway stays clear
  box(0.06, 1.0, DOORWAY.z - DOORWAY.w / 2 - NORTH, M.wainscot, EAST - 0.03, 0.5, (NORTH + DOORWAY.z - DOORWAY.w / 2) / 2);
  box(0.06, 1.0, SOUTH - (DOORWAY.z + DOORWAY.w / 2), M.wainscot, EAST - 0.03, 0.5, (SOUTH + DOORWAY.z + DOORWAY.w / 2) / 2);
  // chair-rail trim
  box(ROOM.w, 0.035, 0.035, M.wainscot, 0, 1.02, NORTH + 0.055);
  box(0.035, 0.035, DOORWAY.z - DOORWAY.w / 2 - NORTH, M.wainscot, EAST - 0.055, 1.02, (NORTH + DOORWAY.z - DOORWAY.w / 2) / 2);
  box(0.035, 0.035, SOUTH - (DOORWAY.z + DOORWAY.w / 2), M.wainscot, EAST - 0.055, 1.02, (SOUTH + DOORWAY.z + DOORWAY.w / 2) / 2);

  // suspended acoustic ceiling
  box(ROOM.w, 0.12, ROOM.l, M.ceiling, 0, ROOM.h + 0.06, 0, { cast: false });
  // acoustic tile seams (4 x 6 grid) + recessed LED panel lights
  const cellX = ROOM.w / 4, cellZ = ROOM.l / 6;
  for (let i = 1; i < 4; i++) box(0.008, 0.004, ROOM.l, M.seam, WEST + i * cellX, ROOM.h - 0.02, 0, { cast: false });
  for (let j = 1; j < 6; j++) box(ROOM.w, 0.004, 0.008, M.seam, 0, ROOM.h - 0.02, NORTH + j * cellZ, { cast: false });
  for (let i = 0; i < 4; i++) for (let j = 0; j < 6; j++) {
    const x = WEST + (i + 0.5) * cellX, z = NORTH + (j + 0.5) * cellZ;
    box(1.5, 0.02, 1.1, M.ledFrame, x, ROOM.h - 0.03, z, { cast: false });
    box(1.35, 0.015, 0.95, M.led, x, ROOM.h - 0.045, z, { cast: false });
  }

}

/* ============================ student seating array (5 x 5) ============================ */
const desksGroup  = new THREE.Group(); desksGroup.name  = 'Desks';   scene.add(desksGroup);
const chairsGroup = new THREE.Group(); chairsGroup.name = 'Chairs';  scene.add(chairsGroup);

const DESK = { w: 0.6, d: 0.45, topT: 0.02, h: 0.72, shelfY: 0.26 };

function makeDesk(group, cx, cz, label) {
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);
  const top = new THREE.Mesh(new THREE.BoxGeometry(DESK.w, DESK.topT, DESK.d), M.deskTop);
  top.position.y = DESK.h;
  top.userData.label = label;
  top.castShadow = true;
  top.receiveShadow = true;
  g.add(top);
  const legX = DESK.w / 2 - 0.04, legZ = DESK.d / 2 - 0.05;
  const lh = DESK.h - DESK.topT;
  for (const [lx, lz] of [[-legX, -legZ], [legX, -legZ], [-legX, legZ], [legX, legZ]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.035, lh, 0.035), M.steel);
    leg.position.set(lx, lh / 2 + DESK.topT, lz);
    leg.castShadow = true;
    g.add(leg);
  }
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(DESK.w - 0.12, 0.02, DESK.d - 0.12), M.steel);
  shelf.position.y = DESK.shelfY;
  g.add(shelf);
  group.add(g);
}

function makeChair(group, cx, cz, label) {
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.045, 0.42), M.chairWood);
  seat.position.y = 0.44;
  seat.userData.label = label;
  seat.castShadow = true;
  g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.5, 0.03), M.chairWood);
  back.position.set(0, 0.72, 0.19); // backrest on the south side — students face the whiteboard (north)
  back.castShadow = true;
  g.add(back);
  for (const [lx, lz] of [[-0.19, -0.17], [0.19, -0.17], [-0.19, 0.17], [0.19, 0.17]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.42, 0.03), M.steel);
    leg.position.set(lx, 0.21, lz);
    g.add(leg);
  }
  for (const lx of [-0.19, 0.19]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.6, 0.03), M.steel);
    post.position.set(lx, 0.55, 0.19);
    g.add(post);
  }
  group.add(g);
}

const ROWS = 5, COLS = 5, PITCH = 1.2, SPACING = 1.0;
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const cx = (c - (COLS - 1) / 2) * SPACING;
  const cz = (r - (ROWS - 1) / 2) * PITCH;
  makeDesk(desksGroup, cx, cz, `Desk · row ${r + 1}, col ${c + 1}`);
  makeChair(chairsGroup, cx, cz + 0.52, `Chair · row ${r + 1}, col ${c + 1}`);
}

/* ============================ instructional front wall (north) ============================ */
const displaysGroup = new THREE.Group(); displaysGroup.name = 'Displays'; scene.add(displaysGroup);

function buildFront() {
  // raised teacher platform (dais)
  box(3.0, 0.15, 1.2, M.daisWood, 0, 0.075, NORTH + 0.7);

  // polished walnut podium, center-right on the dais
  const podium = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.05, 0.5), M.podium);
  body.position.set(0.6, 0.675, NORTH + 0.7);
  body.castShadow = true;
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.04, 0.6), M.podium);
  top.position.set(0.6, 1.2, NORTH + 0.7);
  podium.add(body, top);
  scene.add(podium);

  // flush-mounted magnetic dry-erase whiteboard, centered on the front wall
  const board = new THREE.Mesh(new THREE.BoxGeometry(4.0, 1.2, 0.05), M.board);
  board.position.set(0, 2.05, NORTH - 0.03);
  board.userData.label = 'Whiteboard';
  displaysGroup.add(board);
  box(4.1, 0.05, 0.06, M.boardFrame, 0, 1.45, NORTH - 0.05, { cast: false });
  box(4.1, 0.05, 0.06, M.boardFrame, 0, 2.65, NORTH - 0.05, { cast: false });
  box(0.05, 1.2, 0.06, M.boardFrame, -2.03, 2.05, NORTH - 0.05, { cast: false });
  box(0.05, 1.2, 0.06, M.boardFrame,  2.03, 2.05, NORTH - 0.05, { cast: false });

  // two 55-inch displays flanking the whiteboard
  for (const sx of [-3.15, 3.15]) {
    const tv = new THREE.Group();
    const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.69, 0.06), M.tvBezel);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.14, 0.61), M.tvScreen);
    screen.position.z = 0.035;
    screen.userData.label = '55" wall display';
    tv.add(bezel, screen);
    tv.position.set(sx, 2.1, NORTH - 0.04);
    displaysGroup.add(tv);
  }
}

/* ============================ storage rear wall (south) — locker bank ============================ */
const lockersGroup = new THREE.Group(); lockersGroup.name = 'Lockers'; scene.add(lockersGroup);

function buildLockers() {
  const cols = 5, rows = 5, w = 0.9, h = 0.6, baseY = 0.1;
  const totalW = w * cols;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = -totalW / 2 + w * (c + 0.5);
    const y = baseY + h * (r + 0.5);
    const face = new THREE.Mesh(new THREE.BoxGeometry(w - 0.02, h - 0.02, 0.06), M.locker);
    face.position.set(x, y, SOUTH - 0.13);
    face.receiveShadow = true;
    face.userData.label = `Locker · row ${rows - r}, col ${c + 1}`;
    lockersGroup.add(face);
    const pad = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.11, 0.02), M.lockerKey);
    pad.position.set(x + w / 2 - 0.18, y + h / 2 - 0.14, SOUTH - 0.085);
    const led = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.01), M.lockerLed);
    led.position.set(x + w / 2 - 0.18, y + h / 2 - 0.1, SOUTH - 0.07);
    lockersGroup.add(pad, led);
  }
}

/* ============================ west daylight wall — glass curtain + blinds ============================ */
function buildWindows() {
  // frame rails + mullions
  box(0.08, 0.1, ROOM.l, M.mullion, WEST + 0.02, ROOM.h - 0.05, 0, { cast: false });
  box(0.08, 0.1, ROOM.l, M.mullion, WEST + 0.02, 0.05, 0, { cast: false });
  const bays = 8;
  for (let i = 0; i <= bays; i++) {
    const z = NORTH + (ROOM.l / bays) * i;
    box(0.07, ROOM.h, 0.07, M.mullion, WEST + 0.02, ROOM.h / 2, z, { cast: false });
  }
  // floor-to-ceiling glass panes (plane faces +x, i.e. into the room)
  for (let i = 0; i < bays; i++) {
    const z = NORTH + (ROOM.l / bays) * (i + 0.5);
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(1.18, ROOM.h), M.glass);
    pane.position.set(WEST - 0.01, ROOM.h / 2, z);
    pane.rotation.y = Math.PI / 2;
    scene.add(pane);
  }
  // roller blinds rolled all the way up so the classroom is clearly visible from outside
  for (let i = 0; i < 10; i++) {
    const z = NORTH + (ROOM.l / 10) * (i + 0.5);
    const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.98, 16), M.blindRoll);
    roll.rotation.x = Math.PI / 2;
    roll.position.set(WEST + 0.07, ROOM.h - 0.06, z);
    scene.add(roll);
    box(0.92, 0.05, 0.02, M.mullion, WEST + 0.07, ROOM.h - 0.03, z, { cast: false });
  }
}

/* ============================ exterior: grounds, landscaping & facade ============================ */
function noiseTexture(base, shades, n, repeat) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = shades[Math.random() * shades.length | 0];
    ctx.globalAlpha = 0.1 + Math.random() * 0.15;
    const s = 1 + Math.random() * 3;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, s, s);
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildTree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09 * s, 0.14 * s, 1.7 * s, 8), M.treeTrunk);
  trunk.position.y = 0.85 * s;
  const f1 = new THREE.Mesh(new THREE.SphereGeometry(0.85 * s, 10, 8), M.foliage);
  f1.position.set(0, 2.3 * s, 0);
  const f2 = new THREE.Mesh(new THREE.SphereGeometry(0.6 * s, 10, 8), M.foliage);
  f2.position.set(0.45 * s, 1.9 * s, 0.2 * s);
  const f3 = new THREE.Mesh(new THREE.SphereGeometry(0.6 * s, 10, 8), M.foliage);
  f3.position.set(-0.4 * s, 1.85 * s, -0.15 * s);
  g.add(trunk, f1, f2, f3);
  g.position.set(x, 0, z);
  scene.add(g);
}

function buildBush(x, z, s = 1) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.42 * s, 8, 6), M.foliage);
  b.scale.y = 0.65;
  b.position.y = 0.28 * s;
  g.add(b);
  g.position.set(x, 0, z);
  scene.add(g);
}

function buildBench(x, z, rotY = 0) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.07, 1.35), M.benchWood);
  seat.position.y = 0.44;
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.5, 1.35), M.benchWood);
  back.position.set(-0.18, 0.7, 0);
  const mkLeg = (lx, lz) => {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.44, 0.06), M.benchMetal);
    l.position.set(lx, 0.22, lz);
    return l;
  };
  g.add(seat, back, mkLeg(-0.15, 0.55), mkLeg(-0.15, -0.55), mkLeg(0.15, 0.55), mkLeg(0.15, -0.55));
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);
}

function buildClouds() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(128, 64, 8, 128, 64, 112);
  grad.addColorStop(0, 'rgba(255,255,255,0.92)');
  grad.addColorStop(0.6, 'rgba(255,255,255,0.45)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 128);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const spots = [[-18, 7.5, 6, 3], [-10, 8.5, -8, 2.2], [-26, 7, -2, 4], [14, 8, 5, 2.6], [-4, 9, 14, 2.4], [22, 7.8, -6, 3.2]];
  for (const [x, y, z, s] of spots) {
    const sp = new THREE.Sprite(mat);
    sp.position.set(x, y, z);
    sp.scale.set(7 * s, 3.5 * s, 1);
    scene.add(sp);
  }
}

function buildExterior() {
  // ---- textured grounds: lawns, paved apron (west) and a path from the doorway (east) ----
  const grassTex = noiseTexture('#6C9A50', ['#5E8A45', '#53793C', '#78A85B', '#6FA254'], 2600, 14);
  const grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 });
  const paveTex = noiseTexture('#B7B1A6', ['#ABA497', '#C2BCB1', '#A39C90'], 1800, 10);
  const paveMat = new THREE.MeshStandardMaterial({ map: paveTex, roughness: 0.95 });

  const mkGround = (w, h, x, z, mat) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0, z);
    scene.add(m);
    return m;
  };
  mkGround(80, 80, -45, 0, grassMat);        // west lawn
  mkGround(60, 60, 35.25, 0, grassMat);      // east lawn
  const plaza = mkGround(6, 14, -8.4, 0, paveMat);   // paved apron in front of the glass wall
  plaza.position.y = 0.012;
  const path = mkGround(1.6, 10, 10.3, 2.8, paveMat); // path leading from the doorway
  path.position.y = 0.012;

  // ---- landscaping: trees, bushes, benches ----
  buildTree(-14.5, -5.5, 1.15);
  buildTree(-16.5, -1.2, 0.9);
  buildTree(-14.5, 3.2, 1.05);
  buildTree(-17, 6, 0.85);
  buildTree(11, -4, 1.0);
  buildTree(13, 5.5, 1.1);
  buildBush(-5.7, -5.9);
  buildBush(-5.7, 5.9);
  buildBush(5.7, -5.9);
  buildBush(5.7, 5.9);
  buildBush(-2.2, -6.55);
  buildBush(2.2, -6.55);
  buildBush(-2.2, 6.55);
  buildBush(2.2, 6.55);
  buildBench(-9.5, 4.2);
  buildBench(-9.5, -5);

  // ---- building exterior: cream cladding, plinth, parapet, facade windows ----
  box(ROOM.w + 0.4, ROOM.h, 0.05, M.facade, 0, ROOM.h / 2, NORTH - 0.215, { cast: false });
  box(ROOM.w + 0.4, ROOM.h, 0.05, M.facade, 0, ROOM.h / 2, SOUTH + 0.215, { cast: false });
  box(0.05, ROOM.h, DOORWAY.z - DOORWAY.w / 2 - NORTH, M.facade, EAST + 0.215, ROOM.h / 2, (NORTH + DOORWAY.z - DOORWAY.w / 2) / 2, { cast: false });
  box(0.05, ROOM.h, SOUTH - (DOORWAY.z + DOORWAY.w / 2), M.facade, EAST + 0.215, ROOM.h / 2, (SOUTH + DOORWAY.z + DOORWAY.w / 2) / 2, { cast: false });
  box(0.05, ROOM.h - DOORWAY.h, DOORWAY.w, M.facade, EAST + 0.215, DOORWAY.h + (ROOM.h - DOORWAY.h) / 2, DOORWAY.z, { cast: false });
  box(ROOM.w + 0.4, 0.5, 0.12, M.plinth, 0, 0.25, NORTH - 0.26, { cast: false });
  box(ROOM.w + 0.4, 0.5, 0.12, M.plinth, 0, 0.25, SOUTH + 0.26, { cast: false });
  box(ROOM.w + 0.4, 0.35, 0.12, M.facade, 0, 3.795, NORTH - 0.26, { cast: false });
  box(ROOM.w + 0.4, 0.35, 0.12, M.facade, 0, 3.795, SOUTH + 0.26, { cast: false });
  box(0.12, 0.35, ROOM.l + 0.4, M.facade, EAST + 0.26, 3.795, 0, { cast: false });
  for (const wx of [-3.5, -1.2, 1.2, 3.5]) {
    box(2.5, 1.6, 0.06, M.winFrame, wx, 2.0, NORTH - 0.235, { cast: false });
    box(2.3, 1.4, 0.02, M.winGlass, wx, 2.0, NORTH - 0.21, { cast: false });
    box(2.5, 1.6, 0.06, M.winFrame, wx, 2.0, SOUTH + 0.235, { cast: false });
    box(2.3, 1.4, 0.02, M.winGlass, wx, 2.0, SOUTH + 0.21, { cast: false });
  }

  // ---- fascia band above the glass line + "Class 1-D" sign, facing the street (west) ----
  box(0.3, 0.42, ROOM.l + 0.2, M.fascia, WEST - 0.05, ROOM.h + 0.21, 0, { cast: false });
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2F3B4C';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#7C8B9F';
  ctx.lineWidth = 10;
  ctx.strokeRect(12, 12, c.width - 24, c.height - 24);
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 120px Arial, sans-serif';
  ctx.fillText('Class 1-D', c.width / 2, c.height / 2 - 34);
  ctx.font = '40px Arial, sans-serif';
  ctx.fillStyle = '#C7D2DE';
  ctx.fillText('TOKYO METROPOLITAN ADVANCED NURTURING', c.width / 2, c.height / 2 + 60);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(2.7, 0.675),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 })
  );
  sign.position.set(WEST - 0.24, ROOM.h + 0.21, -2.6);
  sign.rotation.y = -Math.PI / 2;
  scene.add(sign);

  // ---- soft clouds drifting in the sky ----
  buildClouds();
}

/* ============================ CCTV dome cameras (NE + SW corners) ============================ */
const camerasGroup = new THREE.Group(); camerasGroup.name = 'Cameras'; scene.add(camerasGroup);

function makeCam(group, x, z, label) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.06, 24), M.camHousing);
  base.position.y = -0.03;
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), M.camDome);
  dome.position.y = -0.07;
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.02), M.camLed);
  led.position.set(0.06, 0.02, 0.06);
  g.add(base, dome, led);
  g.userData.label = label;
  g.position.set(x, ROOM.h - 0.08, z);
  g.lookAt(0, 1.1, 0); // angled ~45° downward toward the desk grid
  group.add(g);
}
makeCam(camerasGroup, EAST - 0.45, NORTH + 0.45, 'CCTV camera · NE corner');
makeCam(camerasGroup, WEST + 0.45, SOUTH - 0.45, 'CCTV camera · SW corner');

/* ============================ classroom door (east wall) — always open ============================ */
const doorsGroup = new THREE.Group(); doorsGroup.name = 'Door'; scene.add(doorsGroup);

function buildDoor() {
  const g = new THREE.Group();
  g.position.set(EAST - 0.12, 0, 2.8); // doorway centered at z = 2.8 on the east wall

  // ---- threshold: stone step bridging the opening ----
  const threshold = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, DOORWAY.w + 0.08), M.threshold);
  threshold.position.set(0.17, 0.022, 0);
  threshold.castShadow = true;
  threshold.receiveShadow = true;

  // ---- entrance mat just inside the room ----
  const mat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.015, 0.95), M.mat);
  mat.position.set(-0.3, 0.008, 0.1);
  mat.receiveShadow = true;
  mat.userData.label = 'Entrance mat';

  // ---- interior casing: jambs + header with overhang ----
  const jambL = new THREE.Mesh(new THREE.BoxGeometry(0.09, DOORWAY.h, 0.1), M.doorFrame);
  jambL.position.set(0.1, DOORWAY.h / 2, -DOORWAY.w / 2 - 0.02);
  const jambR = new THREE.Mesh(new THREE.BoxGeometry(0.09, DOORWAY.h, 0.1), M.doorFrame);
  jambR.position.set(0.1, DOORWAY.h / 2, DOORWAY.w / 2 + 0.02);
  const header = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.12, DOORWAY.w + 0.14), M.doorFrame);
  header.position.set(0.1, DOORWAY.h + 0.06, 0);

  // ---- exterior casing on the outside face of the opening ----
  const extJambL = new THREE.Mesh(new THREE.BoxGeometry(0.09, DOORWAY.h, 0.08), M.doorFrame);
  extJambL.position.set(0.35, DOORWAY.h / 2, -DOORWAY.w / 2 - 0.01);
  const extJambR = new THREE.Mesh(new THREE.BoxGeometry(0.09, DOORWAY.h, 0.08), M.doorFrame);
  extJambR.position.set(0.35, DOORWAY.h / 2, DOORWAY.w / 2 + 0.01);
  const extHeader = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.1, DOORWAY.w + 0.1), M.doorFrame);
  extHeader.position.set(0.35, DOORWAY.h + 0.05, 0);

  // ---- door leaf: hinged on the north jamb, swung open into the room ----
  const pivot = new THREE.Group();
  pivot.position.set(0.02, 0, -0.475); // hinge axis at the north edge of the doorway
  const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.02, 0.92), M.doorWood);
  leaf.position.set(0.025, 1.01, 0.475);
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  // framed-panel detailing on both faces
  for (const s of [-1, 1]) {
    for (const [py, ph, pw] of [[1.955, 0.1, 0.78], [0.68, 0.52, 0.78]]) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(0.015, ph, pw), M.doorWoodPanel);
      panel.position.set(0.025 + s * 0.0175, py, 0.475);
      pivot.add(panel);
    }
  }
  // glazed panel
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.58, 0.5), M.glass);
  glass.position.set(0.025, 1.6, 0.475);
  // brass lever handle + backplate on the latch side
  const lever = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.022, 0.24), M.brass);
  lever.position.set(0.048, 1.02, 0.79);
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 0.035), M.brass);
  plate.position.set(0.048, 1.02, 0.79);
  // hinges on the hinge edge
  const hingeA = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.045), M.steel);
  hingeA.position.set(0.05, 1.72, 0.05);
  const hingeB = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.045), M.steel);
  hingeB.position.set(0.05, 0.55, 0.05);
  pivot.add(leaf, glass, lever, plate, hingeA, hingeB);
  pivot.rotation.y = -Math.PI * 110 / 180; // always open
  g.add(threshold, mat, jambL, jambR, header, extJambL, extJambR, extHeader, pivot);
  g.userData.label = 'Classroom door (open)';
  doorsGroup.add(g);
}

/* ============================ atmospheric dust in the sunbeam ============================ */
function buildDust() {
  const N = 220;
  const pos = new Float32Array(N * 3);
  const seeds = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pos[i * 3]     = WEST + 0.4 + Math.random() * 3.4;
    pos[i * 3 + 1] = 0.4 + Math.random() * 2.8;
    pos[i * 3 + 2] = NORTH + Math.random() * ROOM.l;
    seeds[i] = Math.random() * Math.PI * 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, M.dust);
  pts.userData.seeds = seeds;
  pts.userData.base = pos.slice();
  scene.add(pts);
  return pts;
}

/* ============================ build the room ============================ */
buildRoom();
buildFront();
buildLockers();
buildWindows();
buildExterior();
buildDoor();
const dust = buildDust();

/* ============================ picking & selection ============================ */
const pickGroups = [desksGroup, chairsGroup, lockersGroup, camerasGroup, doorsGroup, displaysGroup];
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const selEl = document.getElementById('sel');

let activeGroup = null, hlMats = [], hlBase = [];

function findLabel(o) {
  while (o) {
    if (o.userData && o.userData.label) return o.userData.label;
    o = o.parent;
  }
  return null;
}

function clearHighlight() {
  if (activeGroup) {
    hlMats.forEach((m, i) => {
      const b = hlBase[i];
      if (m.emissive && b.e) m.emissive.copy(b.e);
      m.emissiveIntensity = b.i;
    });
    hlMats = []; hlBase = []; activeGroup = null;
  }
}

function highlight(group) {
  clearHighlight();
  activeGroup = group;
  hlMats = [];
  hlBase = [];
  group.traverse(o => {
    if (o.isMesh && o.material) {
      hlMats.push(o.material);
      hlBase.push({ e: o.material.emissive ? o.material.emissive.clone() : null, i: o.material.emissiveIntensity });
    }
  });
}

renderer.domElement.addEventListener('pointermove', e => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickGroups, true)[0];
  renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
});

renderer.domElement.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickGroups, true);
  if (!hits.length) { clearHighlight(); selEl.textContent = '—'; return; }
  let obj = hits[0].object;
  while (obj && !pickGroups.includes(obj)) obj = obj.parent;
  if (!obj) return;
  highlight(obj);
  selEl.textContent = findLabel(hits[0].object) || obj.name || 'Object';
});

/* ============================ controls & HUD ============================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.enablePan = false;
controls.autoRotateSpeed = 0.8;

controls.addEventListener('start', () => { renderer.domElement.style.cursor = 'grabbing'; });
controls.addEventListener('end',   () => { renderer.domElement.style.cursor = 'grab'; });

const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnOrbit.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btnReset').addEventListener('click', () => {
  controls.autoRotate = false;
  btnOrbit.classList.remove('on');
  camera.position.copy(HOME_POS);
  controls.target.copy(HOME_TGT);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// scene stats
let tris = 0, meshes = 0;
scene.traverse(o => {
  if (o.isMesh) {
    meshes++;
    const g = o.geometry;
    if (g.index) tris += g.index.count / 3;
    else if (g.attributes.position) tris += g.attributes.position.count / 3;
  }
});
document.getElementById('stats').textContent = `${meshes} meshes · ${Math.round(tris).toLocaleString()} tris · PBR`;

/* ============================ render loop ============================ */
const clock = new THREE.Clock();
let intro = true;
const introT0 = performance.now();
const INTRO_FROM = new THREE.Vector3(-20, 8.5, 8);
const INTRO_TGT0 = new THREE.Vector3(0, 0.8, 0);

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // gentle fly-in at load
  if (intro) {
    const p = Math.min((performance.now() - introT0) / 1400, 1);
    const e = 1 - Math.pow(1 - p, 3);
    camera.position.lerpVectors(INTRO_FROM, HOME_POS, e);
    controls.target.lerpVectors(INTRO_TGT0, HOME_TGT, e);
    if (p >= 1) intro = false;
  }

  // drifting dust motes in the sunbeam
  const pos = dust.geometry.attributes.position;
  const base = dust.userData.base, seeds = dust.userData.seeds;
  for (let i = 0; i < pos.count; i++) {
    pos.array[i * 3]     = base[i * 3]     + Math.sin(t * 0.25 + seeds[i]) * 0.18;
    pos.array[i * 3 + 1] = base[i * 3 + 1] + Math.sin(t * 0.4 + seeds[i] * 1.7) * 0.1;
    pos.array[i * 3 + 2] = base[i * 3 + 2] + Math.cos(t * 0.2 + seeds[i] * 0.9) * 0.15;
  }
  pos.needsUpdate = true;

  // pulsing highlight on the selected group
  if (activeGroup) {
    const p = 0.35 + 0.25 * (0.5 + 0.5 * Math.sin(t * 3.5));
    hlMats.forEach(m => {
      if (m.emissive) m.emissive.setHex(0xFFB84D);
      m.emissiveIntensity = p;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
